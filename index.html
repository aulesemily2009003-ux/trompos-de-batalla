<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GUERRA BEYBLADE</title>

<script src="https://unpkg.com/peerjs/dist/peerjs.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050711;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:#080b16;
}

.screen{
    position:absolute;
    inset:0;
    z-index:20;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
      radial-gradient(circle at center,#182344 0%,#090d1c 55%,#03040a 100%);
    color:white;
}

.hidden{
    display:none !important;
}

.title{
    font-size:clamp(35px,8vw,75px);
    text-align:center;
    font-weight:900;
    color:#fff;
    text-shadow:
      0 0 10px #28a9ff,
      0 0 25px #28a9ff,
      0 0 45px #176fff;
    margin-bottom:12px;
}

.subtitle{
    color:#b8c8e8;
    font-size:clamp(14px,3vw,20px);
    margin-bottom:25px;
    text-align:center;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:12px;
    width:min(420px,90vw);
}

button{
    border:0;
    border-radius:15px;
    padding:16px 22px;
    font-size:18px;
    font-weight:bold;
    color:white;
    background:linear-gradient(135deg,#147eff,#4d2dff);
    box-shadow:0 6px 20px #0008;
    cursor:pointer;
    transition:.15s;
}

button:hover{
    transform:scale(1.03);
}

button:active{
    transform:scale(.96);
}

.btn-red{
    background:linear-gradient(135deg,#ff304f,#b9002d);
}

.btn-green{
    background:linear-gradient(135deg,#00bd7c,#007e67);
}

.info{
    margin-top:18px;
    padding:12px 18px;
    border-radius:12px;
    background:#ffffff10;
    border:1px solid #ffffff20;
    color:#cdd8ef;
    text-align:center;
}

.onlineBox{
    width:min(500px,94vw);
    padding:25px;
    background:#10172b;
    border:1px solid #ffffff22;
    border-radius:22px;
    box-shadow:0 15px 50px #0008;
    text-align:center;
}

.roomCode{
    font-size:clamp(25px,7vw,48px);
    font-weight:900;
    letter-spacing:5px;
    margin:18px 0;
    color:#4db6ff;
    text-shadow:0 0 15px #158cff;
    word-break:break-all;
}

input{
    width:100%;
    padding:15px;
    margin:8px 0;
    border:1px solid #ffffff25;
    border-radius:12px;
    background:#080c18;
    color:white;
    text-align:center;
    font-size:18px;
    outline:none;
}

.playersText{
    font-size:20px;
    margin:12px 0;
    color:#fff;
}

.status{
    min-height:28px;
    color:#aebddd;
    margin:10px 0 18px;
}

#hud{
    position:absolute;
    top:10px;
    left:0;
    width:100%;
    z-index:10;
    pointer-events:none;
    color:white;
}

.playerHUD{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
}

.hudCard{
    min-width:130px;
    padding:7px 10px;
    border-radius:10px;
    background:#050814cc;
    border:1px solid #ffffff22;
}

.hudName{
    font-size:13px;
    margin-bottom:4px;
}

.lifeBack{
    width:100%;
    height:8px;
    border-radius:10px;
    background:#222;
    overflow:hidden;
}

.lifeBar{
    height:100%;
    width:100%;
    background:#29e66b;
    transition:.15s;
}

#menuGameBtn{
    position:absolute;
    top:10px;
    right:10px;
    z-index:30;
    padding:9px 13px;
    font-size:13px;
    pointer-events:auto;
}

#message{
    position:absolute;
    z-index:25;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    pointer-events:none;
}

.messageBox{
    padding:25px 35px;
    border-radius:20px;
    background:#050814e8;
    border:1px solid #ffffff22;
    text-align:center;
    color:white;
    box-shadow:0 15px 60px #000;
}

.messageBox h2{
    font-size:38px;
    margin-bottom:15px;
}

#mobileControls{
    position:absolute;
    inset:0;
    z-index:15;
    pointer-events:none;
}

#joystick{
    position:absolute;
    left:25px;
    bottom:25px;
    width:145px;
    height:145px;
    border-radius:50%;
    background:#ffffff12;
    border:2px solid #ffffff25;
    pointer-events:auto;
    touch-action:none;
}

#stick{
    position:absolute;
    width:60px;
    height:60px;
    left:42px;
    top:42px;
    border-radius:50%;
    background:#ffffff35;
    border:2px solid #ffffff55;
}

#attack{
    position:absolute;
    right:28px;
    bottom:35px;
    width:115px;
    height:115px;
    border-radius:50%;
    padding:0;
    background:linear-gradient(135deg,#ff254b,#8f0022);
    border:4px solid #ffffff40;
    box-shadow:0 0 25px #ff204d88;
    pointer-events:auto;
    touch-action:none;
    font-size:20px;
}

.mobileOnly{
    display:none;
}

@media(max-width:800px){
    .mobileOnly{
        display:block;
    }

    #menuGameBtn{
        font-size:11px;
        padding:8px 10px;
    }

    .hudCard{
        min-width:95px;
    }

    .hudName{
        font-size:11px;
    }

    #joystick{
        width:125px;
        height:125px;
    }

    #stick{
        width:52px;
        height:52px;
        left:35px;
        top:35px;
    }

    #attack{
        width:100px;
        height:100px;
    }
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<!-- MENÚ PRINCIPAL -->
<div id="mainMenu" class="screen">

    <div class="title">⚡ GUERRA BEYBLADE ⚡</div>

    <div class="subtitle">
        Batalla de trompos
    </div>

    <div class="menu">

        <button onclick="startSolo()">
            🌀 JUGAR SOLO
        </button>

        <button onclick="openOnline()">
            🌐 ONLINE — 4 JUGADORES
        </button>

        <button class="btn-green" onclick="openOnlineCPU()">
            🤖 ONLINE + CPU
        </button>

    </div>

    <div class="info">
        👥 LÍMITE ONLINE: <b>4 JUGADORES</b><br>
        📱 Celular + 💻 Computadora
    </div>

</div>


<!-- MENÚ ONLINE -->
<div id="onlineMenu" class="screen hidden">

    <div class="title" style="font-size:clamp(30px,7vw,55px)">
        🌐 ONLINE
    </div>

    <div class="onlineBox">

        <div class="subtitle">
            👥 Máximo <b>4 jugadores</b> por partida
        </div>

        <button onclick="createRoom()">
            ➕ CREAR PARTIDA
        </button>

        <div id="hostArea" class="hidden">

            <div style="margin-top:18px">
                CÓDIGO DE SALA
            </div>

            <div id="roomCode" class="roomCode">
                ----
            </div>

            <button onclick="copyRoom()">
                📋 COPIAR CÓDIGO
            </button>

            <div id="playersText" class="playersText">
                Jugadores: 1/4
            </div>

            <div id="hostStatus" class="status">
                Esperando jugadores...
            </div>

            <button id="startOnlineBtn" class="btn-green hidden" onclick="startOnlineBattle()">
                ⚔️ INICIAR BATALLA
            </button>

            <button id="startCPUBtn" class="hidden" onclick="startOnlineCPUFromRoom()">
                🤖 INICIAR CON CPU
            </button>

        </div>


        <div id="joinArea">

            <input
                id="joinCode"
                placeholder="ESCRIBE EL CÓDIGO"
                maxlength="30"
            >

            <button onclick="joinRoom()">
                🚀 UNIRSE A PARTIDA
            </button>

        </div>

        <div id="joinStatus" class="status"></div>

        <button class="btn-red" onclick="goMainMenu()">
            ↩️ MENÚ PRINCIPAL
        </button>

    </div>

</div>


<!-- HUD -->
<div id="hud" class="hidden">
    <div id="playerHUD" class="playerHUD"></div>
</div>


<button id="menuGameBtn" class="btn-red hidden" onclick="goMainMenu()">
    ↩️ MENÚ
</button>


<!-- MENSAJE -->
<div id="message" class="hidden">
    <div class="messageBox">
        <h2 id="messageTitle"></h2>
        <p id="messageText"></p>
        <br>
        <button onclick="restartGame()">🔄 REVANCHA</button>
        <button class="btn-red" onclick="goMainMenu()">↩️ MENÚ</button>
    </div>
</div>


<!-- CONTROLES CELULAR -->
<div id="mobileControls" class="mobileOnly hidden">

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <button id="attack">
        ⚔️<br>ATACAR
    </button>

</div>

</div>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;
}

resize();
addEventListener("resize",resize);


/* =========================
   VARIABLES
========================= */

let mode = "menu";

let peer = null;
let hostConnection = null;
let connections = {};

let isHost = false;
let localPlayer = 0;

let roomID = "";

const MAX_PLAYERS = 4;

let running = false;
let winner = null;

let lastTime = performance.now();

let attackPressed = false;

const keys = {};

let joystickX = 0;
let joystickY = 0;

let state = {
    players: [],
    started:false
};


/* =========================
   COLORES
========================= */

const colors = [
    "#28a9ff",
    "#ff3155",
    "#ffd43b",
    "#a855f7"
];


/* =========================
   MENÚ
========================= */

function hideAllScreens(){

    document.getElementById("mainMenu").classList.add("hidden");
    document.getElementById("onlineMenu").classList.add("hidden");

}

function goMainMenu(){

    running = false;
    mode = "menu";

    if(peer){
        try{
            peer.destroy();
        }catch(e){}
    }

    peer = null;
    hostConnection = null;
    connections = {};

    hideAllScreens();

    document.getElementById("mainMenu").classList.remove("hidden");

    document.getElementById("hud").classList.add("hidden");
    document.getElementById("menuGameBtn").classList.add("hidden");
    document.getElementById("mobileControls").classList.add("hidden");
    document.getElementById("message").classList.add("hidden");

}


/* =========================
   SOLO
========================= */

function startSolo(){

    mode = "solo";
    isHost = true;
    localPlayer = 0;

    hideAllScreens();

    document.getElementById("hud").classList.remove("hidden");
    document.getElementById("menuGameBtn").classList.remove("hidden");
    document.getElementById("mobileControls").classList.remove("hidden");

    createBattlePlayers(4);

    running = true;
    winner = null;

}


/* =========================
   ONLINE MENU
========================= */

function openOnline(){

    mode = "online";

    hideAllScreens();

    document.getElementById("onlineMenu").classList.remove("hidden");

    document.getElementById("hostArea").classList.add("hidden");
    document.getElementById("joinArea").classList.remove("hidden");

    document.getElementById("joinStatus").textContent = "";

}


function openOnlineCPU(){

    mode = "onlineCPU";

    hideAllScreens();

    document.getElementById("onlineMenu").classList.remove("hidden");

    document.getElementById("hostArea").classList.add("hidden");
    document.getElementById("joinArea").classList.remove("hidden");

    document.getElementById("joinStatus").textContent =
        "Puedes jugar con otros jugadores y completar los espacios con CPU.";

}


/* =========================
   CREAR JUGADORES
========================= */

function createBattlePlayers(number){

    state.players = [];

    const positions = [
        {x:.5,y:.22},
        {x:.78,y:.50},
        {x:.50,y:.78},
        {x:.22,y:.50}
    ];

    for(let i=0;i<number;i++){

        state.players.push({

            id:i,

            x:W*positions[i].x,
            y:H*positions[i].y,

            life:100,

            angle:0,

            attack:false,

            attackCooldown:0,

            alive:true,

            cpu:false

        });

    }

}


/* =========================
   CREAR SALA
========================= */

function createRoom(){

    if(peer){
        try{peer.destroy();}catch(e){}
    }

    peer = new Peer();

    isHost = true;

    peer.on("open",id=>{

        roomID = id;

        document.getElementById("roomCode").textContent = id;

        document.getElementById("hostArea").classList.remove("hidden");
        document.getElementById("joinArea").classList.add("hidden");

        document.getElementById("playersText").textContent =
            "Jugadores: 1/4";

        document.getElementById("hostStatus").textContent =
            "Esperando jugadores...";

        updateHostButtons();

    });


    peer.on("connection",conn=>{

        if(Object.keys(connections).length >= MAX_PLAYERS-1){

            conn.on("open",()=>{

                conn.send({
                    type:"full"
                });

                setTimeout(()=>{
                    try{conn.close();}catch(e){}
                },500);

            });

            return;
        }


        conn.on("open",()=>{

            let index = findFreePlayer();

            connections[index] = conn;

            conn.playerIndex = index;

            conn.send({
                type:"assigned",
                index:index,
                mode:mode
            });

            updateLobby();

            conn.on("data",data=>{

                if(data.type === "input"){

                    if(state.players[index]){

                        state.players[index].input = data.input;

                    }

                }

                if(data.type === "restart"){

                    restartGame();

                }

            });

            conn.on("close",()=>{

                delete connections[index];

                if(state.players[index]){

                    state.players[index].alive = false;
                    state.players[index].life = 0;

                }

                updateLobby();

            });

        });

    });


    peer.on("error",err=>{

        document.getElementById("hostStatus").textContent =
            "Error de conexión. Intenta crear otra sala.";

    });

}


/* =========================
   UNIRSE
========================= */

function joinRoom(){

    const code = document.getElementById("joinCode").value.trim();

    if(!code){

        document.getElementById("joinStatus").textContent =
            "Escribe el código de la sala.";

        return;
    }

    peer = new Peer();

    isHost = false;

    document.getElementById("joinStatus").textContent =
        "Conectando...";


    peer.on("open",()=>{

        hostConnection = peer.connect(code);

        hostConnection.on("open",()=>{

            document.getElementById("joinStatus").textContent =
                "Conectado. Esperando al anfitrión...";

        });


        hostConnection.on("data",data=>{

            if(data.type === "full"){

                document.getElementById("joinStatus").textContent =
                    "❌ La sala ya está llena. Máximo 4 jugadores.";

                try{peer.destroy();}catch(e){}

            }


            if(data.type === "assigned"){

                localPlayer = data.index;

            }


            if(data.type === "state"){

                state = data.state;

                updateHUD();

            }


            if(data.type === "start"){

                state = data.state;

                startBattleScreen();

            }


            if(data.type === "message"){

                showWinner(data.title,data.text);

            }

        });


        hostConnection.on("close",()=>{

            if(running){

                showWinner(
                    "⚠️ SALA CERRADA",
                    "El anfitrión salió de la partida."
                );

            }

        });

    });


    peer.on("error",()=>{

        document.getElementById("joinStatus").textContent =
            "❌ No se pudo conectar a esa sala.";

    });

}


/* =========================
   BUSCAR ESPACIO
========================= */

function findFreePlayer(){

    const used = [0];

    Object.values(connections).forEach(conn=>{

        used.push(conn.playerIndex);

    });

    for(let i=1;i<MAX_PLAYERS;i++){

        if(!used.includes(i)){

            return i;

        }

    }

    return 1;

}


/* =========================
   LOBBY
========================= */

function updateLobby(){

    const count =
        1 + Object.keys(connections).length;

    document.getElementById("playersText").textContent =
        `Jugadores: ${count}/4`;

    updateHostButtons();

}


function updateHostButtons(){

    const count =
        1 + Object.keys(connections).length;

    const startBtn =
        document.getElementById("startOnlineBtn");

    const cpuBtn =
        document.getElementById("startCPUBtn");

    if(count >= 2){

        startBtn.classList.remove("hidden");

    }else{

        startBtn.classList.add("hidden");

    }


    if(mode === "onlineCPU"){

        cpuBtn.classList.remove("hidden");

    }else{

        cpuBtn.classList.add("hidden");

    }


    if(count >= 4){

        document.getElementById("hostStatus").textContent =
            "🔥 SALA LLENA — 4/4 jugadores";

    }else{

        document.getElementById("hostStatus").textContent =
            `Esperando jugadores... ${count}/4`;

    }

}


/* =========================
   INICIAR BATALLA ONLINE
========================= */

function startOnlineBattle(){

    if(!isHost) return;

    const count =
        1 + Object.keys(connections).length;

    if(count < 2) return;

    createBattlePlayers(count);

    state.started = true;

    broadcast({
        type:"start",
        state:state
    });

    startBattleScreen();

}


/* =========================
   ONLINE + CPU
========================= */

function startOnlineCPUFromRoom(){

    if(!isHost) return;

    const humanCount =
        1 + Object.keys(connections).length;

    createBattlePlayers(4);

    for(let i=humanCount;i<4;i++){

        state.players[i].cpu = true;

    }

    state.started = true;

    broadcast({
        type:"start",
        state:state
    });

    startBattleScreen();

}


/* =========================
   PANTALLA DE JUEGO
========================= */

function startBattleScreen(){

    hideAllScreens();

    document.getElementById("hud").classList.remove("hidden");
    document.getElementById("menuGameBtn").classList.remove("hidden");
    document.getElementById("mobileControls").classList.remove("hidden");
    document.getElementById("message").classList.add("hidden");

    running = true;
    winner = null;

    updateHUD();

}


/* =========================
   REINICIAR
========================= */

function restartGame(){

    document.getElementById("message").classList.add("hidden");

    if(!isHost){

        if(hostConnection){

            hostConnection.send({
                type:"restart"
            });

        }

        return;
    }


    if(mode === "solo"){

        createBattlePlayers(4);

    }else{

        const count =
            mode === "onlineCPU"
            ? 4
            : 1 + Object.keys(connections).length;

        createBattlePlayers(count);

        if(mode === "onlineCPU"){

            const humanCount =
                1 + Object.keys(connections).length;

            for(let i=humanCount;i<4;i++){

                state.players[i].cpu = true;

            }

        }

    }

    running = true;
    winner = null;

    broadcast({
        type:"start",
        state:state
    });

}


/* =========================
   INPUT PC
========================= */

addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()] = true;

    if(e.code === "Space"){

        attackPressed = true;

        e.preventDefault();

    }

});


addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()] = false;

    if(e.code === "Space"){

        attackPressed = false;

    }

});


function getInput(){

    let x = 0;
    let y = 0;

    if(keys["w"] || keys["arrowup"]) y--;
    if(keys["s"] || keys["arrowdown"]) y++;
    if(keys["a"] || keys["arrowleft"]) x--;
    if(keys["d"] || keys["arrowright"]) x++;

    x += joystickX;
    y += joystickY;

    const len = Math.hypot(x,y);

    if(len > 1){

        x /= len;
        y /= len;

    }

    return {
        x:x,
        y:y,
        attack:attackPressed
    };

}


/* =========================
   JOYSTICK CELULAR
========================= */

const joystick =
    document.getElementById("joystick");

const stick =
    document.getElementById("stick");


function joystickMove(clientX,clientY){

    const rect =
        joystick.getBoundingClientRect();

    const cx =
        rect.left + rect.width/2;

    const cy =
        rect.top + rect.height/2;

    let dx = clientX-cx;
    let dy = clientY-cy;

    const max = rect.width*.34;

    const dist = Math.hypot(dx,dy);

    if(dist > max){

        dx = dx/dist*max;
        dy = dy/dist*max;

    }

    joystickX = dx/max;
    joystickY = dy/max;

    stick.style.transform =
        `translate(${dx}px,${dy}px)`;

}


function joystickEnd(){

    joystickX = 0;
    joystickY = 0;

    stick.style.transform =
        "translate(0,0)";

}


joystick.addEventListener("touchstart",e=>{

    e.preventDefault();

    const t = e.touches[0];

    joystickMove(t.clientX,t.clientY);

},{passive:false});


joystick.addEventListener("touchmove",e=>{

    e.preventDefault();

    const t = e.touches[0];

    joystickMove(t.clientX,t.clientY);

},{passive:false});


joystick.addEventListener("touchend",e=>{

    e.preventDefault();

    joystickEnd();

},{passive:false});


const attackButton =
    document.getElementById("attack");


attackButton.addEventListener("touchstart",e=>{

    e.preventDefault();

    attackPressed = true;

},{passive:false});


attackButton.addEventListener("touchend",e=>{

    e.preventDefault();

    attackPressed = false;

},{passive:false});


/* =========================
   ACTUALIZACIÓN
========================= */

function update(dt){

    if(!running) return;

    if(isHost){

        updateHost(dt);

    }else{

        sendLocalInput();

    }

}


function updateHost(dt){

    const speed = 250;

    state.players.forEach((p,i)=>{

        if(!p.alive) return;


        let input = {
            x:0,
            y:0,
            attack:false
        };


        if(i === 0){

            input = getInput();

        }else if(p.cpu){

            input = cpuInput(p,i);

        }else if(p.input){

            input = p.input;

        }


        p.x += input.x * speed * dt;
        p.y += input.y * speed * dt;

        p.x = Math.max(80,Math.min(W-80,p.x));
        p.y = Math.max(100,Math.min(H-80,p.y));

        p.angle += 8*dt;

        if(input.attack && p.attackCooldown <= 0){

            p.attack = true;
            p.attackCooldown = .35;

        }else{

            p.attack = false;

        }

        p.attackCooldown -= dt;

    });


    checkCollisions();

    checkWinner();

    broadcastState();

}


/* =========================
   CPU
========================= */

function cpuInput(p,index){

    let target = null;
    let best = Infinity;

    state.players.forEach((other,j)=>{

        if(j===index || !other.alive) return;

        const d =
            Math.hypot(
                other.x-p.x,
                other.y-p.y
            );

        if(d<best){

            best=d;
            target=other;

        }

    });


    if(!target){

        return {
            x:0,
            y:0,
            attack:false
        };

    }


    const dx =
        target.x-p.x;

    const dy =
        target.y-p.y;

    const d =
        Math.hypot(dx,dy)||1;


    return {
        x:dx/d,
        y:dy/d,
        attack:d<110
    };

}


/* =========================
   COLISIONES
========================= */

function checkCollisions(){

    for(let i=0;i<state.players.length;i++){

        const a=state.players[i];

        if(!a.alive) continue;


        for(let j=i+1;j<state.players.length;j++){

            const b=state.players[j];

            if(!b.alive) continue;


            const dx=b.x-a.x;
            const dy=b.y-a.y;

            const d=Math.hypot(dx,dy);


            if(d<75){

                if(a.attack){

                    b.life -= 2.5;

                }

                if(b.attack){

                    a.life -= 2.5;

                }


                if(a.attack || b.attack){

                    const push = 9;

                    if(a.attack){

                        a.x -= dx/d*push;
                        a.y -= dy/d*push;

                    }

                    if(b.attack){

                        b.x += dx/d*push;
                        b.y += dy/d*push;

                    }

                }

            }

        }

    }


    state.players.forEach(p=>{

        if(p.life<=0){

            p.life=0;
            p.alive=false;

        }

    });

}


/* =========================
   GANADOR
========================= */

function checkWinner(){

    const alive =
        state.players.filter(p=>p.alive);

    if(alive.length <= 1 && state.players.length>1){

        running=false;

        if(alive.length===1){

            winner=alive[0].id;

            const title =
                `🏆 JUGADOR ${winner+1} GANA`;

            const text =
                "¡El último Beyblade con vida ganó la batalla!";

            showWinner(title,text);

            broadcast({
                type:"message",
                title:title,
                text:text
            });

        }

    }

}


/* =========================
   RED
========================= */

function broadcast(data){

    Object.values(connections).forEach(conn=>{

        try{
            conn.send(data);
        }catch(e){}

    });

}


function broadcastState(){

    broadcast({
        type:"state",
        state:state
    });

}


let lastSend=0;

function sendLocalInput(){

    if(!hostConnection) return;

    const now=performance.now();

    if(now-lastSend<40) return;

    lastSend=now;

    hostConnection.send({
        type:"input",
        input:getInput()
    });

}


/* =========================
   HUD
========================= */

function updateHUD(){

    const hud =
        document.getElementById("playerHUD");

    hud.innerHTML="";

    state.players.forEach((p,i)=>{

        const card =
            document.createElement("div");

        card.className="hudCard";

        card.innerHTML=`

            <div class="hudName">
                <span style="
                color:${colors[i]}
                ">●</span>
                JUGADOR ${i+1}
                ${p.cpu ? " 🤖":""}
            </div>

            <div class="lifeBack">

                <div
                class="lifeBar"
                style="
                width:${p.life}%;
                background:${colors[i]}
                "
                ></div>

            </div>

        `;

        hud.appendChild(card);

    });

}


/* =========================
   GANADOR VISUAL
========================= */

function showWinner(title,text){

    running=false;

    document.getElementById("messageTitle").textContent=title;
    document.getElementById("messageText").textContent=text;

    document.getElementById("message").classList.remove("hidden");

}


/* =========================
   COPIAR CÓDIGO
========================= */

function copyRoom(){

    if(!roomID) return;

    navigator.clipboard.writeText(roomID)
    .then(()=>{

        document.getElementById("hostStatus").textContent =
            "✅ Código copiado. Envíalo a los otros jugadores.";

    })
    .catch(()=>{

        document.getElementById("hostStatus").textContent =
            "Copia manualmente el código.";

    });

}


/* =========================
   DIBUJO
========================= */

function drawArena(){

    ctx.clearRect(0,0,W,H);


    // Fondo

    const gradient =
        ctx.createRadialGradient(
            W/2,H/2,50,
            W/2,H/2,Math.max(W,H)
        );

    gradient.addColorStop(0,"#17233f");
    gradient.addColorStop(1,"#050711");

    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,W,H);


    // Arena

    const radius =
        Math.min(W,H)*.40;

    ctx.beginPath();

    ctx.arc(
        W/2,
        H/2,
        radius,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#101827";
    ctx.fill();

    ctx.strokeStyle="#425a80";
    ctx.lineWidth=8;
    ctx.stroke();


    // Líneas

    ctx.beginPath();

    ctx.arc(
        W/2,
        H/2,
        radius*.78,
        0,
        Math.PI*2
    );

    ctx.strokeStyle="#243a5b";
    ctx.lineWidth=2;
    ctx.stroke();


    // Estrellas

    for(let i=0;i<35;i++){

        const x =
            (i*97)%W;

        const y =
            (i*53)%H;

        ctx.fillStyle="#ffffff25";

        ctx.fillRect(x,y,2,2);

    }

}


function drawPlayer(p,i){

    if(!p.alive) return;


    ctx.save();

    ctx.translate(p.x,p.y);

    ctx.rotate(p.angle);


    // Sombra

    ctx.beginPath();

    ctx.ellipse(
        4,
        8,
        31,
        12,
        0,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#0008";
    ctx.fill();


    // Trompo

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        30,
        0,
        Math.PI*2
    );

    ctx.fillStyle=colors[i];
    ctx.fill();


    ctx.lineWidth=5;
    ctx.strokeStyle="#ffffffaa";
    ctx.stroke();


    // Centro

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        11,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#ffffff";
    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        5,
        0,
        Math.PI*2
    );

    ctx.fillStyle=colors[i];
    ctx.fill();


    // Ataque

    if(p.attack){

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            42,
            0,
            Math.PI*2
        );

        ctx.strokeStyle="#fff";
        ctx.lineWidth=5;
        ctx.stroke();

    }


    ctx.restore();


    // Nombre

    ctx.font="bold 12px Arial";
    ctx.textAlign="center";

    ctx.fillStyle="#fff";

    ctx.fillText(
        p.cpu ? "🤖 CPU" : "JUGADOR "+(i+1),
        p.x,
        p.y-42
    );

}


/* =========================
   LOOP
========================= */

function loop(now){

    const dt =
        Math.min(.033,(now-lastTime)/1000);

    lastTime=now;

    update(dt);

    drawArena();

    state.players.forEach((p,i)=>{
        drawPlayer(p,i);
    });

    updateHUD();

    requestAnimationFrame(loop);

}

requestAnimationFrame(loop);

</script>
