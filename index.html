<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>TURBO CAR</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#050812;
    color:white;
}

button{
    font-family:Arial,sans-serif;
    border:0;
}

.hidden{
    display:none!important;
}

/* ======================================================
   INTRO
====================================================== */

#intro{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        linear-gradient(
            #06142f 0%,
            #143d76 42%,
            #ff884b 76%,
            #080b12 100%
        );
}

.sun{
    position:absolute;
    width:170px;
    height:170px;
    left:50%;
    top:13%;
    transform:translateX(-50%);
    border-radius:50%;
    background:#ffd86b;
    box-shadow:
        0 0 40px #ffd86b,
        0 0 110px #ff793c;
}

.mountain{
    position:absolute;
    bottom:23%;
    width:100%;
    height:40%;
    background:#182943;
    clip-path:polygon(
        0 75%,
        10% 42%,
        20% 68%,
        32% 22%,
        43% 67%,
        57% 25%,
        69% 65%,
        82% 34%,
        92% 60%,
        100% 38%,
        100% 100%,
        0 100%
    );
}

.roadIntro{
    position:absolute;
    bottom:-10%;
    left:50%;
    transform:translateX(-50%);
    width:125%;
    height:55%;
    background:#242931;
    clip-path:polygon(
        42% 0,
        58% 0,
        100% 100%,
        0 100%
    );
}

.roadIntro:after{
    content:"";
    position:absolute;
    left:50%;
    width:7px;
    height:100%;
    background:repeating-linear-gradient(
        to bottom,
        white 0 45px,
        transparent 45px 90px
    );
}

.introContent{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.introCar{
    font-size:100px;
    filter:drop-shadow(0 15px 15px #000);
    animation:carFloat 1s infinite alternate;
}

@keyframes carFloat{
    to{transform:translateY(-12px);}
}

.logo{
    font-size:clamp(48px,12vw,115px);
    font-weight:1000;
    letter-spacing:7px;
    background:linear-gradient(
        #fff,
        #ffe000 45%,
        #ff3500
    );
    -webkit-background-clip:text;
    color:transparent;
    filter:drop-shadow(0 8px 8px #000);
}

.subtitle{
    letter-spacing:6px;
    color:#eaf0ff;
    font-size:14px;
}

.start{
    margin-top:35px;
    padding:18px 42px;
    border-radius:50px;
    color:white;
    font-weight:bold;
    font-size:18px;
    background:linear-gradient(
        135deg,
        #ff321d,
        #ff9d00
    );
    box-shadow:0 10px 35px #0009;
}

/* ======================================================
   MENU
====================================================== */

#menu{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 0%,
            #3158a0,
            #0a1227 55%,
            #03050b
        );
}

.city{
    position:absolute;
    bottom:0;
    width:100%;
    height:38%;
    background:
        repeating-linear-gradient(
            90deg,
            #111a2c 0 45px,
            #192641 45px 90px
        );
    clip-path:polygon(
        0 55%,
        6% 25%,
        12% 48%,
        20% 17%,
        28% 51%,
        36% 25%,
        45% 52%,
        54% 13%,
        64% 47%,
        73% 22%,
        82% 53%,
        90% 18%,
        100% 47%,
        100% 100%,
        0 100%
    );
}

.menuContent{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.menuTitle{
    font-size:clamp(50px,11vw,105px);
    font-weight:1000;
    letter-spacing:5px;
    background:linear-gradient(
        white,
        #ffe000 45%,
        #ff3900
    );
    -webkit-background-clip:text;
    color:transparent;
}

.menuSubtitle{
    color:#afc0e7;
    letter-spacing:3px;
    margin-bottom:25px;
}

.mode{
    width:min(600px,94%);
    padding:25px;
    border-radius:25px;
    background:#09101fe6;
    border:1px solid #ffffff25;
    box-shadow:0 20px 60px #0009;
    text-align:center;
    backdrop-filter:blur(15px);
}

.mode h2{
    margin-bottom:18px;
}

.playerSelect{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:20px;
}

.playerBtn{
    padding:12px 22px;
    border-radius:12px;
    color:white;
    background:#ffffff12;
    border:1px solid #ffffff22;
}

.playerBtn.active{
    color:#111;
    background:#ffd400;
}

.startRace{
    padding:16px 35px;
    border-radius:14px;
    color:white;
    font-weight:bold;
    font-size:17px;
    background:linear-gradient(
        135deg,
        #ff3b22,
        #ff9b00
    );
}

.info{
    color:#7f8eae;
    font-size:12px;
    margin-top:15px;
}

/* ======================================================
   JUEGO
====================================================== */

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#76a957;
}

#canvas{
    width:100%;
    height:100%;
    display:block;
}

/* HUD */

.hud{
    position:absolute;
    top:10px;
    left:10px;
    right:10px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    z-index:20;
}

.hudPlayer{
    padding:9px 6px;
    border-radius:11px;
    background:#050b16dd;
    border:1px solid #ffffff20;
    text-align:center;
    font-size:12px;
    font-weight:bold;
}

.p1{border-bottom:3px solid #1590ff;}
.p2{border-bottom:3px solid #ff3535;}
.p3{border-bottom:3px solid #25d96b;}
.p4{border-bottom:3px solid #ffd21c;}

.position{
    font-size:16px;
}

/* ======================================================
   MINIMAPA GRANDE
====================================================== */

#map{
    position:absolute;
    top:75px;
    right:14px;
    width:185px;
    height:250px;
    border-radius:18px;
    background:#07101be8;
    border:1px solid #ffffff35;
    box-shadow:0 10px 35px #0008;
    overflow:hidden;
    z-index:25;
}

#mapTitle{
    position:absolute;
    top:8px;
    left:0;
    right:0;
    text-align:center;
    font-size:11px;
    letter-spacing:2px;
    color:#aab8d7;
    z-index:4;
}

#track{
    position:absolute;
    left:50%;
    top:25px;
    width:125px;
    height:205px;
    transform:translateX(-50%);
}

.mapOuter{
    position:absolute;
    inset:0;
    border:25px solid #303842;
    border-radius:45% 55% 48% 52%;
    transform:rotate(-8deg);
}

.mapInner{
    position:absolute;
    inset:24px;
    border:4px dashed #f1f1f1;
    border-radius:45% 55% 48% 52%;
}

.mapDot{
    position:absolute;
    width:13px;
    height:13px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    border:2px solid white;
    z-index:10;
}

#dot1{background:#168cff;}
#dot2{background:#ff3535;}
#dot3{background:#23d66b;}
#dot4{background:#ffd21c;}

.legend{
    position:absolute;
    bottom:7px;
    left:8px;
    right:8px;
    display:flex;
    justify-content:space-around;
    font-size:9px;
    color:#aab4ca;
}

/* ======================================================
   PROGRESO
====================================================== */

.progress{
    position:absolute;
    left:50%;
    top:58px;
    transform:translateX(-50%);
    width:min(400px,45%);
    height:10px;
    background:#050812bb;
    border-radius:20px;
    z-index:20;
    overflow:hidden;
}

.progressFinish{
    position:absolute;
    right:0;
    width:4px;
    height:100%;
    background:white;
}

.progressDot{
    position:absolute;
    top:0;
    width:8px;
    height:100%;
}

#prog1{background:#168cff;}
#prog2{background:#ff3535;}
#prog3{background:#23d66b;}
#prog4{background:#ffd21c;}

/* ======================================================
   CUENTA
====================================================== */

#countdown{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:110px;
    font-weight:1000;
    z-index:60;
    pointer-events:none;
    text-shadow:0 10px 30px #000;
}

/* ======================================================
   CONTROLES CELULAR
====================================================== */

.mobileControls{
    position:absolute;
    bottom:12px;
    left:12px;
    right:12px;
    display:none;
    justify-content:space-between;
    z-index:40;
}

.wheelArea{
    width:150px;
    height:150px;
}

.wheel{
    width:135px;
    height:135px;
    margin:7px;
    border:13px solid #dce2e9;
    border-radius:50%;
    background:#16191f;
    position:relative;
    box-shadow:
        0 10px 25px #0009,
        inset 0 0 25px #000;
    touch-action:none;
}

.wheel:before{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:80px;
    height:11px;
    transform:translate(-50%,-50%);
    background:#dce2e9;
    border-radius:10px;
}

.wheel:after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:11px;
    height:80px;
    transform:translate(-50%,-50%);
    background:#dce2e9;
    border-radius:10px;
}

.wheelCenter{
    position:absolute;
    left:50%;
    top:50%;
    width:28px;
    height:28px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#ed3030;
    z-index:5;
}

.pedals{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.pedal{
    width:75px;
    height:65px;
    border-radius:18px;
    color:white;
    font-size:25px;
    font-weight:bold;
    box-shadow:0 8px 20px #0009;
    touch-action:none;
}

.gas{
    background:linear-gradient(#26df65,#078b39);
}

.brake{
    background:linear-gradient(#ff5151,#9f0000);
}

/* ======================================================
   RESULTADOS
====================================================== */

#results{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(
            circle,
            #29478d,
            #070b15
        );
}

.resultBox{
    width:min(600px,92%);
    padding:30px;
    background:#101827ee;
    border:1px solid #ffffff20;
    border-radius:25px;
    box-shadow:0 20px 60px #0009;
    text-align:center;
}

.resultBox h1{
    font-size:42px;
    margin-bottom:20px;
}

.resultRow{
    display:flex;
    justify-content:space-between;
    padding:14px;
    margin:7px 0;
    background:#ffffff0b;
    border-radius:10px;
}

.winner{
    color:#ffd400;
    font-weight:bold;
}

.resultButton{
    margin-top:12px;
    padding:14px 25px;
    border-radius:12px;
    color:white;
    font-weight:bold;
    background:linear-gradient(
        135deg,
        #ff3d24,
        #ff9b00
    );
}

@media(max-width:700px){

    .hud{
        grid-template-columns:repeat(4,1fr);
        top:7px;
    }

    .hudPlayer{
        font-size:9px;
        padding:6px 2px;
    }

    .position{
        font-size:13px;
    }

    .progress{
        top:48px;
        width:40%;
    }

    #map{
        width:120px;
        height:165px;
        top:75px;
        right:7px;
    }

    #track{
        width:80px;
        height:125px;
        top:22px;
    }

    .mapOuter{
        border-width:16px;
    }

    .mapInner{
        inset:16px;
    }

    .mobileControls{
        display:flex;
    }

}
</style>
</head>

<body>

<!-- ======================================================
     INTRO
====================================================== -->

<section id="intro">

    <div class="sun"></div>
    <div class="mountain"></div>
    <div class="roadIntro"></div>

    <div class="introContent">

        <div class="introCar">🏎️</div>

        <div class="logo">
            TURBO CAR
        </div>

        <div class="subtitle">
            4 PILOTOS • 1 CIRCUITO • 1 CAMPEÓN
        </div>

        <button class="start" onclick="showMenu()">
            ENTRAR AL CIRCUITO
        </button>

    </div>

</section>


<!-- ======================================================
     MENU
====================================================== -->

<section id="menu" class="hidden">

    <div class="city"></div>

    <div class="menuContent">

        <div class="menuTitle">
            TURBO CAR
        </div>

        <div class="menuSubtitle">
            STREET RACING
        </div>

        <div class="mode">

            <h2>🏁 CONFIGURA LA CARRERA</h2>

            <div class="playerSelect">

                <button class="playerBtn"
                    onclick="selectPlayers(1)">
                    1 JUGADOR
                </button>

                <button class="playerBtn"
                    onclick="selectPlayers(2)">
                    2
                </button>

                <button class="playerBtn"
                    onclick="selectPlayers(3)">
                    3
                </button>

                <button class="playerBtn active"
                    onclick="selectPlayers(4)">
                    4
                </button>

            </div>

            <button
                class="startRace"
                onclick="startGame()">

                🏎️ INICIAR CARRERA

            </button>

            <div class="info">
                Hasta 4 jugadores en el mismo dispositivo.
                Cada piloto tiene su propio carril.
            </div>

        </div>

    </div>

</section>


<!-- ======================================================
     JUEGO
====================================================== -->

<section id="game" class="hidden">

    <canvas id="canvas"></canvas>


    <!-- HUD -->

    <div class="hud">

        <div class="hudPlayer p1">
            🔵 J1
            <div class="position" id="pos1">1º</div>
            <div>
                <span id="speed1">0</span> km/h
            </div>
        </div>

        <div class="hudPlayer p2">
            🔴 J2
            <div class="position" id="pos2">2º</div>
            <div>
                <span id="speed2">0</span> km/h
            </div>
        </div>

        <div class="hudPlayer p3">
            🟢 J3
            <div class="position" id="pos3">3º</div>
            <div>
                <span id="speed3">0</span> km/h
            </div>
        </div>

        <div class="hudPlayer p4">
            🟡 J4
            <div class="position" id="pos4">4º</div>
            <div>
                <span id="speed4">0</span> km/h
            </div>
        </div>

    </div>


    <!-- PROGRESO -->

    <div class="progress">

        <div
            id="prog1"
            class="progressDot"
            style="left:0%">
        </div>

        <div
            id="prog2"
            class="progressDot"
            style="left:0%">
        </div>

        <div
            id="prog3"
            class="progressDot"
            style="left:0%">
        </div>

        <div
            id="prog4"
            class="progressDot"
            style="left:0%">
        </div>

        <div class="progressFinish"></div>

    </div>


    <!-- MAPA -->

    <div id="map">

        <div id="mapTitle">
            CIRCUITO
        </div>

        <div id="track">

            <div class="mapOuter"></div>
            <div class="mapInner"></div>

            <div
                id="dot1"
                class="mapDot">
            </div>

            <div
                id="dot2"
                class="mapDot">
            </div>

            <div
                id="dot3"
                class="mapDot">
            </div>

            <div
                id="dot4"
                class="mapDot">
            </div>

        </div>

        <div class="legend">
            🔵 J1
            🔴 J2
            🟢 J3
            🟡 J4
        </div>

    </div>


    <div id="countdown"></div>


    <!-- CONTROLES CELULAR -->

    <div class="mobileControls">

        <div class="wheelArea">

            <div
                id="wheel"
                class="wheel">

                <div class="wheelCenter"></div>

            </div>

        </div>

        <div class="pedals">

            <button
                id="gas"
                class="pedal gas">
                ▲
            </button>

            <button
                id="brake"
                class="pedal brake">
                ▼
            </button>

        </div>

    </div>

</section>


<!-- ======================================================
     RESULTADOS
====================================================== -->

<section id="results" class="hidden">

    <div class="resultBox">

        <h1>🏆 RESULTADOS</h1>

        <div id="resultList"></div>

        <button
            class="resultButton"
            onclick="startGame()">

            🔄 OTRA CARRERA

        </button>

        <br>

        <button
            class="resultButton"
            onclick="backMenu()">

            MENÚ

        </button>

    </div>

</section>


<script>

/* ======================================================
   CONFIGURACIÓN
====================================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let selectedPlayers=4;

let gameRunning=false;
let raceStarted=false;
let finished=false;

let keys={};

let gas=false;
let brake=false;

let steering=0;

const TOTAL=8000;


/* ======================================================
   PISTA
====================================================== */

const track=[];

for(let i=0;i<900;i++){

    track.push({

        x:
            Math.sin(i*.027)*190+
            Math.sin(i*.009)*330+
            Math.sin(i*.075)*35,

        y:i*10

    });

}


/* ======================================================
   AUTOS
====================================================== */

let cars=[];

function createCars(){

    const colors=[
        "#168cff",
        "#ff3535",
        "#23d66b",
        "#ffd21c"
    ];

    cars=[];

    for(let i=0;i<4;i++){

        cars.push({

            id:i,

            progress:0,

            speed:0,

            maxSpeed:
                10+
                Math.random()*1.2,

            acceleration:.20,

            x:
                [-165,-55,55,165][i],

            color:colors[i],

            finished:false

        });

    }

}


/* ======================================================
   PANTALLAS
====================================================== */

function hideScreens(){

    document
        .querySelectorAll(
            "#intro,#menu,#game,#results"
        )
        .forEach(e=>
            e.classList.add("hidden")
        );

}

function showMenu(){

    hideScreens();

    document
        .getElementById("menu")
        .classList.remove("hidden");

}

function backMenu(){

    gameRunning=false;

    showMenu();

}


/* ======================================================
   JUGADORES
====================================================== */

function selectPlayers(n){

    selectedPlayers=n;

    document
        .querySelectorAll(".playerBtn")
        .forEach((b,i)=>{

            b.classList.toggle(
                "active",
                i===n-1
            );

        });

}


/* ======================================================
   INICIO
====================================================== */

function resize(){

    canvas.width=innerWidth;
    canvas.height=innerHeight;

}

window.addEventListener(
    "resize",
    resize
);


function startGame(){

    hideScreens();

    document
        .getElementById("game")
        .classList.remove("hidden");

    resize();

    createCars();

    finished=false;
    raceStarted=false;
    gameRunning=true;

    countdown();

    requestAnimationFrame(loop);

}


/* ======================================================
   CUENTA
====================================================== */

function countdown(){

    const box=
        document.getElementById(
            "countdown"
        );

    let n=3;

    box.textContent=n;

    const timer=setInterval(()=>{

        n--;

        if(n>0){

            box.textContent=n;

        }else{

            box.textContent="¡YA!";

            raceStarted=true;

            setTimeout(()=>{
                box.textContent="";
            },700);

            clearInterval(timer);

        }

    },1000);

}


/* ======================================================
   TECLADO
====================================================== */

document.addEventListener(
    "keydown",
    e=>{
        keys[e.key.toLowerCase()]=true;
    }
);

document.addEventListener(
    "keyup",
    e=>{
        keys[e.key.toLowerCase()]=false;
    }
);


/*
   J1:
   W A S D

   J2:
   Flechas

   J3:
   I J K L

   J4:
   T F G H
*/


/* ======================================================
   ACTUALIZAR AUTO
====================================================== */

function controlCar(
    car,
    accelerate,
    reverse,
    left,
    right
){

    if(keys[accelerate]){

        car.speed+=car.acceleration;

    }else{

        car.speed*=.975;

    }

    if(keys[reverse]){

        car.speed-=.25;

    }

    car.speed=Math.max(
        -2,
        Math.min(
            car.maxSpeed,
            car.speed
        )
    );


    if(car.speed>.2){

        if(keys[left])
            car.x-=.18*car.speed;

        if(keys[right])
            car.x+=.18*car.speed;

    }


    /*
       El coche intenta volver
       suavemente a su carril.
    */

    car.x*=.992;

    car.progress+=
        Math.max(0,car.speed)*.75;

}


/* ======================================================
   ACTUALIZAR TODOS
====================================================== */

function updateCars(){

    if(!raceStarted)
        return;


    if(selectedPlayers>=1){

        controlCar(
            cars[0],
            "w",
            "s",
            "a",
            "d"
        );

    }


    if(selectedPlayers>=2){

        controlCar(
            cars[1],
            "arrowup",
            "arrowdown",
            "arrowleft",
            "arrowright"
        );

    }


    if(selectedPlayers>=3){

        controlCar(
            cars[2],
            "i",
            "k",
            "j",
            "l"
        );

    }


    if(selectedPlayers>=4){

        controlCar(
            cars[3],
            "t",
            "g",
            "f",
            "h"
        );

    }


    /*
       Los jugadores que no participan
       permanecen quietos.
    */

    for(let i=selectedPlayers;i<4;i++){

        cars[i].speed=0;

    }


    cars.forEach(car=>{

        if(
            car.progress>=TOTAL
        ){

            car.progress=TOTAL;

            car.finished=true;

        }

    });


    if(
        cars
        .slice(0,selectedPlayers)
        .every(c=>c.finished)
    ){

        endRace();

    }

}


/* ======================================================
   CIELO
====================================================== */

function drawSky(){

    const g=
        ctx.createLinearGradient(
            0,0,
            0,canvas.height
        );

    g.addColorStop(0,"#63bdf4");
    g.addColorStop(.48,"#c7e9f4");
    g.addColorStop(1,"#76aa56");

    ctx.fillStyle=g;

    ctx.fillRect(
        0,0,
        canvas.width,
        canvas.height
    );


    /*
       SOL
    */

    ctx.fillStyle="#ffe08a";

    ctx.beginPath();

    ctx.arc(
        canvas.width*.77,
        canvas.height*.18,
        48,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       MONTAÑAS
    */

    ctx.fillStyle="#60875d";

    ctx.beginPath();

    ctx.moveTo(
        0,
        canvas.height*.43
    );

    for(
        let x=0;
        x<=canvas.width;
        x+=80
    ){

        ctx.lineTo(
            x,
            canvas.height*.31+
            Math.sin(x*.015)*60
        );

    }

    ctx.lineTo(
        canvas.width,
        canvas.height
    );

    ctx.lineTo(
        0,
        canvas.height
    );

    ctx.fill();


    /*
       MONTAÑAS LEJANAS
    */

    ctx.fillStyle="#849b79";

    ctx.beginPath();

    ctx.moveTo(
        0,
        canvas.height*.45
    );

    for(
        let x=0;
        x<=canvas.width;
        x+=120
    ){

        ctx.lineTo(
            x,
            canvas.height*.37+
            Math.sin(x*.009)*40
        );

    }

    ctx.lineTo(
        canvas.width,
        canvas.height
    );

    ctx.lineTo(
        0,
        canvas.height
    );

    ctx.fill();

}


/* ======================================================
   ÁRBOL
====================================================== */

function drawTree(x,y,s){

    ctx.fillStyle="#553923";

    ctx.fillRect(
        x-5*s,
        y,
        10*s,
        35*s
    );

    ctx.fillStyle="#14582e";

    ctx.beginPath();

    ctx.arc(
        x,
        y-12*s,
        25*s,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#267a40";

    ctx.beginPath();

    ctx.arc(
        x-17*s,
        y,
        18*s,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        x+17*s,
        y,
        18*s,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* ======================================================
   EDIFICIOS
====================================================== */

function drawBuilding(x,y,s){

    ctx.fillStyle="#35435b";

    ctx.fillRect(
        x,
        y,
        60*s,
        90*s
    );

    for(
        let r=0;
        r<5;
        r++
    ){

        for(
            let c=0;
            c<3;
            c++
        ){

            ctx.fillStyle=
                r%2===0
                ?"rgba(255,222,130,.9)"
                :"rgba(150,210,255,.8)";

            ctx.fillRect(
                x+
                9*s+
                c*17*s,
                y+
                10*s+
                r*16*s,
                8*s,
                10*s
            );

        }

    }

}


/* ======================================================
   PUENTE
====================================================== */

function drawBridge(y){

    ctx.fillStyle="#495463";

    ctx.fillRect(
        0,
        y,
        canvas.width,
        18
    );

    ctx.fillStyle="#303945";

    ctx.fillRect(
        0,
        y+18,
        canvas.width,
        8
    );

    for(
        let x=0;
        x<canvas.width;
        x+=70
    ){

        ctx.fillStyle="#252c36";

        ctx.fillRect(
            x,
            y+26,
            12,
            80
        );

    }

}


/* ======================================================
   CARRETERA
====================================================== */

function drawRoad(){

    const horizon=
        canvas.height*.29;

    const center=
        canvas.width/2;


    for(
        let i=0;
        i<38;
        i++
    ){

        const index=
            Math.floor(
                cars[0].progress/10
            )+i;


        if(index>=track.length-1)
            continue;


        const p=track[index];
        const next=track[index+1];

        const depth=i/38;

        const perspective=
            depth*depth;

        const y=
            horizon+
            perspective*
            (canvas.height-horizon);

        const nextY=
            horizon+
            ((i+1)/38)*
            ((i+1)/38)*
            (canvas.height-horizon);


        const roadWidth=
            45+
            perspective*590;


        const cx=
            center+
            p.x*perspective;

        const nx=
            center+
            next.x*
            ((i+1)/38)*
            ((i+1)/38);


        /*
           césped
        */

        ctx.fillStyle=
            i%2===0
            ?"#71a84f"
            :"#6ba04b";


        ctx.fillRect(
            0,
            y,
            canvas.width,
            nextY-y+3
        );


        /*
           bordes rojos/blancos
        */

        ctx.fillStyle=
            i%2===0
            ?"white"
            :"#e33b35";


        ctx.beginPath();

        ctx.moveTo(
            cx-roadWidth/2-9,
            y
        );

        ctx.lineTo(
            cx-roadWidth/2+2,
            y
        );

        ctx.lineTo(
            nx-roadWidth/2+2,
            nextY
        );

        ctx.lineTo(
            nx-roadWidth/2-9,
            nextY
        );

        ctx.fill();


        ctx.beginPath();

        ctx.moveTo(
            cx+roadWidth/2-2,
            y
        );

        ctx.lineTo(
            cx+roadWidth/2+9,
            y
        );

        ctx.lineTo(
            nx+roadWidth/2+9,
            nextY
        );

        ctx.lineTo(
            nx+roadWidth/2-2,
            nextY
        );

        ctx.fill();


        /*
           ASFALTO
        */

        ctx.fillStyle="#2c3037";

        ctx.beginPath();

        ctx.moveTo(
            cx-roadWidth/2,
            y
        );

        ctx.lineTo(
            cx+roadWidth/2,
            y
        );

        ctx.lineTo(
            nx+roadWidth/2,
            nextY
        );

        ctx.lineTo(
            nx-roadWidth/2,
            nextY
        );

        ctx.fill();


        /*
           cuatro carriles
        */

        ctx.strokeStyle=
            "rgba(255,255,255,.65)";

        ctx.lineWidth=
            2+
            perspective*3;


        for(let lane=1;lane<4;lane++){

            const offset=
                -roadWidth/2+
                roadWidth*(lane/4);

            const nextOffset=
                -roadWidth/2+
                roadWidth*(lane/4);


            if(i%2===0){

                ctx.beginPath();

                ctx.moveTo(
                    cx+offset,
                    y
                );

                ctx.lineTo(
                    nx+nextOffset,
                    nextY
                );

                ctx.stroke();

            }

        }


        /*
           Línea central decorativa
        */

        if(i%3===0){

            ctx.fillStyle="#ffe85d";

            ctx.fillRect(
                cx-2,
                y,
                4+
                perspective*4,
                15+
                perspective*18
            );

        }


        /*
           árboles
        */

        if(i%4===0){

            const s=
                .25+
                perspective*.8;

            drawTree(
                cx-
                roadWidth/2-
                60*s,
                y,
                s
            );

            drawTree(
                cx+
                roadWidth/2+
                60*s,
                y,
                s
            );

        }


        /*
           edificios
        */

        if(i===8){

            drawBuilding(
                cx-
                roadWidth/2-
                150,
                y-80,
                .7
            );

            drawBuilding(
                cx+
                roadWidth/2+
                90,
                y-80,
                .6
            );

        }


        /*
           puente
        */

        if(i===19){

            drawBridge(y);

        }

    }

}


/* ======================================================
   CARRO 3D
====================================================== */

function drawCar(car){

    const index=
        Math.min(
            track.length-1,
            Math.floor(
                car.progress/10
            )
        );

    const p=track[index];

    const center=
        canvas.width/2+
        p.x*.035;


    /*
       Cada auto mantiene su carril.
    */

    const x=
        center+
        car.x;

    const y=
        canvas.height*.73;


    ctx.save();

    ctx.translate(x,y);


    /*
       sombra
    */

    ctx.fillStyle="#0009";

    ctx.beginPath();

    ctx.ellipse(
        0,
        25,
        48,
        13,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       carro
    */

    ctx.fillStyle=car.color;

    ctx.beginPath();

    ctx.roundRect(
        -35,
        -65,
        70,
        105,
        15
    );

    ctx.fill();


    /*
       brillo
    */

    ctx.fillStyle=
        "rgba(255,255,255,.18)";

    ctx.beginPath();

    ctx.roundRect(
        -28,
        -57,
        20,
        75,
        8
    );

    ctx.fill();


    /*
       techo
    */

    ctx.fillStyle="#bfe7ff";

    ctx.beginPath();

    ctx.roundRect(
        -25,
        -46,
        50,
        38,
        11
    );

    ctx.fill();


    /*
       vidrio
    */

    ctx.fillStyle="#152537";

    ctx.beginPath();

    ctx.roundRect(
        -20,
        -41,
        40,
        27,
        7
    );

    ctx.fill();


    /*
       capó
    */

    ctx.fillStyle=car.color;

    ctx.beginPath();

    ctx.roundRect(
        -29,
        -5,
        58,
        38,
        8
    );

    ctx.fill();


    /*
       faros
    */

    ctx.fillStyle="#fff7bf";

    ctx.fillRect(
        -25,
        15,
        13,
        8
    );

    ctx.fillRect(
        12,
        15,
        13,
        8
    );


    /*
       ruedas
    */

    ctx.fillStyle="#111";

    ctx.fillRect(
        -40,
        -25,
        11,
        31
    );

    ctx.fillRect(
        29,
        -25,
        11,
        31
    );


    /*
       spoiler
    */

    ctx.fillStyle="#111";

    ctx.fillRect(
        -31,
        -63,
        62,
        7
    );


    /*
       número
    */

    ctx.fillStyle="white";

    ctx.font="bold 18px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        car.id+1,
        0,
        17
    );


    ctx.restore();

}


/* ======================================================
   POSICIONES
====================================================== */

function getOrder(){

    return cars
        .slice(0,selectedPlayers)
        .sort(
            (a,b)=>
                b.progress-a.progress
        );

}


function updateHUD(){

    const order=getOrder();

    order.forEach(
        (car,index)=>{

            document
                .getElementById(
                    "pos"+
                    (car.id+1)
                )
                .textContent=
                    (index+1)+"º";

        }
    );


    cars.forEach(car=>{

        document
            .getElementById(
                "speed"+
                (car.id+1)
            )
            .textContent=
                Math.round(
                    Math.max(
                        0,
                        car.speed*25
                    )
                );

    });


    /*
       barra de progreso
    */

    cars.forEach(car=>{

        document
            .getElementById(
                "prog"+
                (car.id+1)
            )
            .style.left=
                (
                    car.progress/
                    TOTAL*
                    100
                )+"%";

    });


    updateMap();

}


/* ======================================================
   MINIMAPA
====================================================== */

function updateMap(){

    /*
       Movemos los cuatro puntos
       alrededor del circuito.
    */

    cars.forEach(car=>{

        const p=
            car.progress/TOTAL;

        /*
           trayectoria elíptica
        */

        const angle=
            p*Math.PI*2-
            Math.PI/2;

        const x=
            50+
            Math.cos(angle)*36;

        const y=
            50+
            Math.sin(angle)*40;

        const dot=
            document
            .getElementById(
                "dot"+
                (car.id+1)
            );

        dot.style.left=x+"%";
        dot.style.top=y+"%";

    });

}


/* ======================================================
   LOOP
====================================================== */

function loop(){

    if(!gameRunning)
        return;


    drawSky();

    updateCars();

    drawRoad();


    /*
       Autos en orden de profundidad.
    */

    const visible=
        cars
        .slice(0,selectedPlayers)
        .sort(
            (a,b)=>
                a.x-b.x
        );


    visible.forEach(
        car=>drawCar(car)
    );


    updateHUD();


    requestAnimationFrame(loop);

}


/* ======================================================
   FINAL
====================================================== */

function endRace(){

    if(finished)
        return;

    finished=true;
    gameRunning=false;


    setTimeout(()=>{

        hideScreens();

        document
            .getElementById(
                "results"
            )
            .classList.remove(
                "hidden"
            );


        const order=getOrder();

        const list=
            document
            .getElementById(
                "resultList"
            );

        list.innerHTML="";


        order.forEach(
            (car,index)=>{

                const row=
                    document
                    .createElement(
                        "div"
                    );

                row.className=
                    "resultRow";


                if(index===0)
                    row.classList.add(
                        "winner"
                    );


                row.innerHTML=`

                    <span>
                        ${index+1}º
                        JUGADOR ${car.id+1}
                    </span>

                    <span>
                        ${
                            index===0
                            ?"🏆"
                            :""
                        }
                    </span>

                `;

                list.appendChild(row);

            }
        );

    },800);

}


/* ======================================================
   VOLANTE CELULAR
====================================================== */

const wheel=
    document.getElementById(
        "wheel"
    );

let wheelDown=false;
let wheelStart=0;


wheel.addEventListener(
    "pointerdown",
    e=>{

        wheelDown=true;

        wheelStart=e.clientX;

        wheel.setPointerCapture(
            e.pointerId
        );

    }
);


wheel.addEventListener(
    "pointermove",
    e=>{

        if(!wheelDown)
            return;

        steering=
            Math.max(
                -1,
                Math.min(
                    1,
                    (e.clientX-wheelStart)/60
                )
            );


        /*
           El volante móvil controla
           al Jugador 1.
        */

        keys["a"]=
            steering<-.15;

        keys["d"]=
            steering>.15;

    }
);


wheel.addEventListener(
    "pointerup",
    ()=>{
        wheelDown=false;
        steering=0;
        keys["a"]=false;
        keys["d"]=false;
    }
);


wheel.addEventListener(
    "pointercancel",
    ()=>{
        wheelDown=false;
        steering=0;
        keys["a"]=false;
        keys["d"]=false;
    }
);


/* ======================================================
   GAS Y FRENO
====================================================== */

function holdButton(
    element,
    key
){

    element.addEventListener(
        "pointerdown",
        e=>{
            e.preventDefault();
            keys[key]=true;
        }
    );

    element.addEventListener(
        "pointerup",
        e=>{
            e.preventDefault();
            keys[key]=false;
        }
    );

    element.addEventListener(
        "pointercancel",
        ()=>{
            keys[key]=false;
        }
    );

}


holdButton(
    document.getElementById("gas"),
    "w"
);

holdButton(
    document.getElementById("brake"),
    "s"
);


/* ======================================================
   INICIALIZACIÓN
====================================================== */

resize();

</script>
