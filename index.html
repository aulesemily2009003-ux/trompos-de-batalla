<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>GUERRA BEYBLADE</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
color:white;
background:#030511;
touch-action:none
}
.screen{
position:absolute;
inset:0;
display:none;
align-items:center;
justify-content:center
}
.screen.active{display:flex}

#menu{
background:
radial-gradient(circle at 50% 35%,#314ee8 0%,#111b68 28%,#070a2c 58%,#02030d 100%);
overflow:hidden
}

#menu:before{
content:"";
position:absolute;
inset:-50%;
background:
radial-gradient(circle,#fff8 0 1px,transparent 2px) 0 0/90px 90px,
radial-gradient(circle,#4cefff99 0 1px,transparent 2px) 45px 40px/120px 120px;
animation:stars 18s linear infinite;
opacity:.55
}

@keyframes stars{
to{transform:translate(90px,90px)}
}

.panel{
position:relative;
z-index:2;
width:min(94%,570px);
padding:30px;
border-radius:30px;
background:linear-gradient(145deg,#091039ee,#070a25ee);
border:2px solid #6176ff;
box-shadow:
0 0 20px #4861ff88,
0 0 70px #334eff55,
inset 0 0 30px #ffffff08;
text-align:center
}

.title{
font-size:clamp(45px,11vw,82px);
font-weight:1000;
line-height:.82;
letter-spacing:2px;
background:linear-gradient(180deg,#fff,#5ff5ff 42%,#6b72ff 80%,#d03cff);
-webkit-background-clip:text;
color:transparent;
filter:drop-shadow(0 0 12px #00eaff);
margin-bottom:18px
}

.subtitle{
font-size:19px;
font-weight:bold;
color:#cdd5ff;
letter-spacing:3px;
margin-bottom:25px
}

button{
border:0;
border-radius:16px;
padding:15px 22px;
margin:6px;
font-size:17px;
font-weight:900;
color:white;
cursor:pointer;
transition:.15s;
box-shadow:0 7px 18px #0008
}

button:hover{transform:translateY(-2px);filter:brightness(1.12)}
button:active{transform:scale(.96)}

.blue{background:linear-gradient(135deg,#2879ff,#20dfff)}
.green{background:linear-gradient(135deg,#08c98a,#43ef70)}
.red{background:linear-gradient(135deg,#ff315e,#ff7934)}
.purple{background:linear-gradient(135deg,#814dff,#d23cff)}
.gray{background:linear-gradient(135deg,#303958,#4d587f)}

input{
width:100%;
padding:15px;
margin:7px 0;
border-radius:14px;
border:2px solid #4359af;
background:#101633;
color:white;
font-size:18px;
text-align:center;
outline:none
}

input:focus{
border-color:#45e8ff;
box-shadow:0 0 15px #35dfff55
}

.status{
min-height:25px;
color:#7feeff;
font-weight:bold;
margin:12px
}

.room{
padding:18px;
border-radius:20px;
background:linear-gradient(145deg,#101945,#090e2b);
border:2px solid #566dff;
margin:15px 0;
box-shadow:inset 0 0 20px #4c5dff18
}

.code{
font-size:48px;
font-weight:1000;
letter-spacing:10px;
color:#70efff;
text-shadow:0 0 16px #00dfff
}

.players{
background:#080e2b;
border-radius:18px;
padding:15px;
margin:15px 0;
text-align:left;
border:1px solid #4255a5
}

.player{
display:flex;
justify-content:space-between;
padding:12px;
margin:7px 0;
border-radius:12px;
background:linear-gradient(90deg,#172152,#10183c);
border:1px solid #34478e
}

#game{
background:#02040b
}

#canvas{
position:absolute;
inset:0;
width:100%;
height:100%
}

.hud{
position:absolute;
z-index:5;
top:12px;
left:50%;
transform:translateX(-50%);
width:min(95%,760px);
display:flex;
justify-content:space-between;
pointer-events:none
}

.hud div{
background:linear-gradient(145deg,#090f2ee8,#111941e8);
border:2px solid #526aff;
border-radius:15px;
padding:9px 15px;
font-weight:900;
box-shadow:0 0 18px #4058ff55
}

.pause{
position:absolute;
right:12px;
top:12px;
z-index:10;
font-size:14px
}

#touch{
position:absolute;
inset:0;
z-index:8;
pointer-events:none
}

.joy{
position:absolute;
left:24px;
bottom:25px;
width:130px;
height:130px;
border-radius:50%;
background:radial-gradient(circle,#6174ff44,#18204d33);
border:2px solid #ffffff40;
box-shadow:0 0 30px #425dff44;
pointer-events:auto
}

.stick{
position:absolute;
width:54px;
height:54px;
left:36px;
top:36px;
border-radius:50%;
background:linear-gradient(145deg,#7c8cff,#3a51df);
box-shadow:0 0 25px #536bff
}

.attack{
position:absolute;
right:25px;
bottom:30px;
width:110px;
height:110px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-weight:1000;
font-size:15px;
background:radial-gradient(circle at 35% 30%,#ffbb40,#ff4d45 55%,#c81562);
border:3px solid #ffb55c;
box-shadow:0 0 30px #ff4c4c99;
pointer-events:auto
}

.overlay{
display:none;
position:absolute;
inset:0;
z-index:30;
background:#020414dd;
align-items:center;
justify-content:center;
backdrop-filter:blur(5px)
}

.overlay.show{display:flex}

.result{
width:min(92%,460px);
padding:30px;
border-radius:27px;
background:linear-gradient(145deg,#0c1541,#070b28);
border:2px solid #687aff;
box-shadow:0 0 45px #465dff88;
text-align:center
}

.big{
font-size:34px;
font-weight:1000;
margin-bottom:10px
}

@media(min-width:800px){
#touch{display:none}
}
</style>
</head>

<body>

<div id="menu" class="screen active">
<div class="panel">

<div class="title">
GUERRA<br>BEYBLADE
</div>

<div class="subtitle">⚡ BATALLA DE TROMPOS ⚡</div>

<button class="blue" onclick="solo()">⚔️ JUGAR SOLO</button>
<button class="green" onclick="onlineMenu()">🌐 JUGAR ONLINE</button>
<button class="purple" onclick="instructions()">❓ ¿CÓMO JUGAR?</button>

</div>
</div>

<div id="online" class="screen">
<div class="panel">

<h2>🌐 GUERRA ONLINE</h2>

<input id="name" maxlength="14" placeholder="✏️ Escribe tu nombre">

<button class="green" onclick="createRoom()">🏠 CREAR SALA</button>

<div style="color:#aab8ea;margin:10px">O entra a una sala</div>

<input id="codeInput"
inputmode="numeric"
maxlength="4"
placeholder="🔢 Código de 4 números"
oninput="numbersOnly(this)">

<button class="blue" onclick="joinRoom()">🚀 ENTRAR A SALA</button>

<div id="onlineStatus" class="status"></div>

<button class="gray" onclick="goMenu()">↩️ VOLVER</button>

</div>
</div>

<div id="lobby" class="screen">
<div class="panel">

<h2>⚔️ SALA DE BATALLA</h2>

<div class="room">
<div>CÓDIGO DE LA SALA</div>
<div id="roomCode" class="code">----</div>
</div>

<div id="lobbyStatus" class="status">
Esperando jugadores...
</div>

<div class="players">
<strong>👥 JUGADORES EN LA SALA</strong>
<div id="playerList"></div>
</div>

<button id="startButton"
class="green"
onclick="startOnline()"
disabled>
ESPERANDO JUGADORES...
</button>

<br>

<button class="red" onclick="leaveRoom()">🚪 SALIR DE LA SALA</button>

</div>
</div>

<div id="game" class="screen">

<canvas id="canvas"></canvas>

<div class="hud">
<div id="life">❤️ 100</div>
<div id="alive">⚔️ 0 vivos</div>
</div>

<button class="pause gray" onclick="pauseGame()">⏸ PAUSA</button>

<div id="touch">

<div id="joy" class="joy">
<div id="stick" class="stick"></div>
</div>

<div id="attack" class="attack">
⚡ ATAQUE
</div>

</div>

<div id="pauseOverlay" class="overlay">
<div class="result">

<div class="big">⏸ PAUSA</div>

<button class="green" onclick="pauseGame()">
▶ CONTINUAR
</button>

<button class="red" onclick="leaveGame()">
🚪 SALIR
</button>

</div>
</div>

<div id="resultOverlay" class="overlay">
<div class="result">

<div id="resultTitle" class="big"></div>

<div id="resultInfo"></div>

<br>

<button id="againHost"
class="green"
onclick="again()">
🔄 VOLVER A JUGAR
</button>

<button id="againGuest"
class="green"
onclick="again()"
style="display:none">
🔄 VOLVER A LA SALA
</button>

<br>

<button class="red" onclick="leaveRoom()">
🚪 SALIR DE LA SALA
</button>

</div>
</div>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

let peer=null;
let hostConn=null;
let connections=[];

let room="";
let isHost=false;
let mode="";
let myId=0;

let players=[];

let running=false;
let paused=false;
let finished=false;

let keys={};

let input={
x:0,
y:0,
attack:false
};

let lastFrame=performance.now();
let lastState=0;
let lastInput=0;

function resize(){

W=innerWidth;
H=innerHeight;

const d=Math.min(devicePixelRatio||1,2);

canvas.width=W*d;
canvas.height=H*d;

canvas.style.width=W+"px";
canvas.style.height=H+"px";

ctx.setTransform(d,0,0,d,0,0);
}

addEventListener("resize",resize);
resize();

function screen(id){

document.querySelectorAll(".screen")
.forEach(x=>x.classList.remove("active"));

document.getElementById(id).classList.add("active");

}

function numbersOnly(x){

x.value=x.value
.replace(/[^0-9]/g,"")
.slice(0,4);

}

function randomCode(){

return String(
Math.floor(1000+Math.random()*9000)
);

}

function color(){

return [
"#25dfff",
"#ff3b75",
"#9b5cff",
"#3bea72"
][Math.floor(Math.random()*4)];

}

function makePlayer(id,name,cpu=false){

return{

id:id,
name:name,

x:W*.5,
y:H*.5,

vx:0,
vy:0,

hp:100,
maxHp:100,

color:color(),

angle:Math.random()*6.28,

attack:0,
cool:0,

alive:true,

cpu:cpu,

ix:0,
iy:0,
ia:false,

last:Date.now()

};

}

function onlineMenu(){

cleanup();

document.getElementById("onlineStatus").textContent="";

screen("online");

}

function goMenu(){

cleanup();

screen("menu");

}

function instructions(){

alert(
"⚡ GUERRA BEYBLADE ⚡\n\n"+
"💻 PC:\n"+
"WASD o flechas para moverte.\n"+
"ESPACIO para atacar.\n\n"+
"📱 CELULAR:\n"+
"Usa el joystick para moverte.\n"+
"Pulsa ATAQUE para atacar.\n\n"+
"🌐 ONLINE:\n"+
"Máximo 4 jugadores.\n\n"+
"Si un celular se desconecta,\n"+
"su Beyblade continúa como CPU."
);

}

function solo(){

cleanup();

mode="solo";
isHost=true;
myId=1;

players=[
makePlayer(1,"TÚ"),
makePlayer(2,"CPU 1",true),
makePlayer(3,"CPU 2",true),
makePlayer(4,"CPU 3",true)
];

placePlayers();

beginGame();

}

function placePlayers(){

const pos=[
[W*.5,H*.5],
[W*.25,H*.3],
[W*.75,H*.3],
[W*.5,H*.75]
];

players.forEach((p,i)=>{

p.x=pos[i][0];
p.y=pos[i][1];

p.vx=0;
p.vy=0;

p.hp=100;
p.alive=true;

p.attack=0;
p.cool=0;

p.ix=0;
p.iy=0;
p.ia=false;

p.last=Date.now();

});

}

function createRoom(){

const n=(
document.getElementById("name").value.trim()
||"Jugador 1"
).slice(0,14);

cleanup();

mode="online";
isHost=true;

room=randomCode();

document.getElementById("onlineStatus").textContent=
"Creando sala...";

createHost(n);

}

function createHost(n){

const id="bb"+room;

peer=new Peer(id,{
debug:0,
config:{
iceServers:[
{urls:"stun:stun.l.google.com:19302"},
{urls:"stun:stun1.l.google.com:19302"}
]
}
});

let retry=false;

peer.on("open",()=>{

players=[
makePlayer(1,n,false)
];

myId=1;

document.getElementById("roomCode").textContent=room;

document.getElementById("lobbyStatus").textContent=
"Sala creada. Comparte el código.";

updateLobby();

screen("lobby");

});

peer.on("connection",conn=>{

if(connections.length>=3){

setTimeout(()=>{
try{conn.close()}catch(e){}
},300);

return;

}

connections.push(conn);

conn.on("open",()=>{
conn.__opened=true;
});

conn.on("data",data=>{
hostData(conn,data);
});

conn.on("close",()=>{
guestDisconnected(conn);
});

conn.on("error",()=>{
guestDisconnected(conn);
});

});

peer.on("error",e=>{

if(e.type==="unavailable-id"&&!retry){

retry=true;

try{peer.destroy()}catch(x){}

room=randomCode();

setTimeout(()=>{
createHost(n);
},300);

return;

}

document.getElementById("onlineStatus").textContent=
"No se pudo crear la sala.";

});

}

function joinRoom(){

const n=(
document.getElementById("name").value.trim()
||"Jugador"
).slice(0,14);

const c=
document.getElementById("codeInput").value.trim();

if(!/^[0-9]{4}$/.test(c)){

document.getElementById("onlineStatus").textContent=
"El código debe tener exactamente 4 números.";

return;

}

cleanup();

mode="online";
isHost=false;
room=c;

document.getElementById("onlineStatus").textContent=
"Conectando...";

peer=new Peer({
debug:0,
config:{
iceServers:[
{urls:"stun:stun.l.google.com:19302"},
{urls:"stun:stun1.l.google.com:19302"}
]
}
});

let timed=false;

const timer=setTimeout(()=>{

if(timed)return;

timed=true;

document.getElementById("onlineStatus").textContent=
"No se pudo conectar. Revisa el código.";

try{peer.destroy()}catch(e){}

},12000);

peer.on("open",()=>{

if(timed)return;

const conn=peer.connect(
"bb"+room,
{
reliable:true,
serialization:"json"
}
);

hostConn=conn;

conn.on("open",()=>{

clearTimeout(timer);

send(conn,{
type:"join",
name:n
});

document.getElementById("onlineStatus").textContent=
"¡Conectado!";

});

conn.on("data",data=>{
guestData(data);
});

conn.on("close",()=>{

if(!finished){

alert("Se perdió la conexión con la sala.");

goMenu();

}

});

});

peer.on("error",e=>{

if(timed)return;

if(e.type==="peer-unavailable"){

clearTimeout(timer);

timed=true;

document.getElementById("onlineStatus").textContent=
"No existe esa sala.";

try{peer.destroy()}catch(x){}

}

});

}

function hostData(conn,data){

if(!data||typeof data!=="object")return;

if(data.type==="join"){

if(players.length>=4)return;

let p=players.find(x=>x.conn===conn);

if(!p){

const id=nextId();

if(!id)return;

p=makePlayer(
id,
data.name||("Jugador "+id),
false
);

p.conn=conn;

players.push(p);

}

p.name=(
data.name||p.name
).slice(0,14);

p.cpu=false;
p.last=Date.now();

conn.__playerId=p.id;

send(conn,{
type:"lobby",
players:lobbyData()
});

broadcastLobby();

return;

}

if(data.type==="input"){

const p=players.find(
x=>x.id===conn.__playerId
);

if(!p)return;

p.last=Date.now();
p.cpu=false;

p.ix=Math.max(
-1,
Math.min(1,Number(data.x)||0)
);

p.iy=Math.max(
-1,
Math.min(1,Number(data.y)||0)
);

p.ia=!!data.attack;

return;

}

if(data.type==="ready"){

const p=players.find(
x=>x.id===conn.__playerId
);

if(p){

p.cpu=false;
p.last=Date.now();

}

}

}

function guestData(data){

if(!data||typeof data!=="object")return;

if(data.type==="lobby"){

if(running)return;

players=data.players.map(p=>({

id:p.id,
name:p.name,
color:p.color,

x:0,
y:0,

vx:0,
vy:0,

hp:100,
maxHp:100,

angle:0,
attack:0,
cool:0,

alive:true,
cpu:false,

ix:0,
iy:0,
ia:false,

last:Date.now()

}));

updateLobby();

screen("lobby");

return;

}

if(data.type==="start"){

players=data.players;
myId=data.myId;

beginGame();

return;

}

if(data.type==="state"){

if(!running)return;

players=data.players;

return;

}

if(data.type==="result"){

finished=true;
running=false;

showResult(data.winner);

return;

}

if(data.type==="back"){

finished=false;
running=false;

players=data.players;

document.getElementById(
"resultOverlay"
).classList.remove("show");

updateLobby();

screen("lobby");

return;

}

if(data.type==="hostLeft"){

alert("El anfitrión salió de la sala.");

goMenu();

}

}

function nextId(){

for(let i=2;i<=4;i++){

if(!players.some(p=>p.id===i))
return i;

}

return null;

}

function lobbyData(){

return players.map(p=>({
id:p.id,
name:p.name,
color:p.color
}));

}

function broadcastLobby(){

const data={
type:"lobby",
players:lobbyData()
};

connections.forEach(c=>{

if(c.open)
send(c,data);

});

updateLobby();

}

function updateLobby(){

const list=
document.getElementById("playerList");

list.innerHTML="";

players.forEach(p=>{

const div=document.createElement("div");

div.className="player";

const a=document.createElement("span");

a.textContent=
"⚡ "+p.name+
(p.id===1?" 👑":"");

const b=document.createElement("span");

b.textContent="Jugador "+p.id;

div.appendChild(a);
div.appendChild(b);

list.appendChild(div);

});

const button=
document.getElementById("startButton");

if(isHost){

if(players.length>=2){

button.disabled=false;
button.textContent=
"⚔️ INICIAR PARTIDA";

}else{

button.disabled=true;
button.textContent=
"ESPERANDO JUGADORES...";

}

}else{

button.disabled=true;
button.textContent=
"ESPERANDO AL ANFITRIÓN...";

}

}

function startOnline(){

if(!isHost||players.length<2)return;

placePlayers();

players.forEach(p=>{
p.cpu=false;
});

connections.forEach(c=>{

if(c.open){

const p=
players.find(x=>x.id===c.__playerId);

if(p){

send(c,{
type:"start",
players:copyPlayers(),
myId:p.id
});

}

}

});

beginGame();

}

function copyPlayers(){

return players.map(p=>({

id:p.id,
name:p.name,

x:p.x,
y:p.y,

vx:0,
vy:0,

hp:100,
maxHp:100,

color:p.color,

angle:p.angle,

attack:0,
cool:0,

alive:true,

cpu:false,

ix:0,
iy:0,
ia:false,

last:Date.now()

}));

}

function beginGame(){

running=true;
paused=false;
finished=false;

document.getElementById(
"pauseOverlay"
).classList.remove("show");

document.getElementById(
"resultOverlay"
).classList.remove("show");

screen("game");

resize();

lastFrame=performance.now();

requestAnimationFrame(loop);

}

function loop(now){

if(!running)return;

const dt=Math.min(
2,
Math.max(.2,(now-lastFrame)/16.67)
);

lastFrame=now;

if(!paused){

if(mode==="solo"||isHost){

updateGame(dt);

}else{

updateGuest();

}

}

draw();

requestAnimationFrame(loop);

}

function updateGame(dt){

if(mode==="online")
checkOffline();

players.forEach(p=>{

if(!p.alive)return;

if(p.cpu){

cpuMove(p,dt);

}else{

if(p.id===myId){

readKeyboard();

move(
p,
input.x,
input.y,
dt
);

p.ix=input.x;
p.iy=input.y;
p.ia=input.attack;

}else{

move(
p,
p.ix,
p.iy,
dt
);

}

if(p.ia&&p.cool<=0){

hit(p);

p.cool=35;

}

}

p.cool=Math.max(
0,
p.cool-dt
);

p.attack=Math.max(
0,
p.attack-dt*.1
);

p.angle+=.25*dt;

limit(p);

});

checkWinner();

if(mode==="online"){

if(performance.now()-lastState>55){

lastState=performance.now();

broadcastState();

}

}

}

function checkOffline(){

const now=Date.now();

players.forEach(p=>{

if(
p.id===1||
!p.alive||
p.cpu
)return;

if(now-p.last>5000){

p.cpu=true;

p.ix=0;
p.iy=0;
p.ia=false;

}

});

}

function updateGuest(){

readKeyboard();

if(performance.now()-lastInput>40){

lastInput=performance.now();

if(hostConn&&hostConn.open){

send(hostConn,{
type:"input",
x:input.x,
y:input.y,
attack:input.attack
});

}

}

}

function broadcastState(){

const data={
type:"state",
players:players.map(p=>({

id:p.id,
name:p.name,

x:p.x,
y:p.y,

vx:p.vx,
vy:p.vy,

hp:p.hp,
maxHp:p.maxHp,

color:p.color,

angle:p.angle,

attack:p.attack,

alive:p.alive,

cpu:p.cpu

}))
};

connections.forEach(c=>{

if(c.open)
send(c,data);

});

}

function send(c,data){

try{

if(c&&c.open)
c.send(data);

}catch(e){}

}

function move(p,x,y,dt){

p.vx+=x*.75*dt;
p.vy+=y*.75*dt;

p.vx*=Math.pow(.91,dt);
p.vy*=Math.pow(.91,dt);

const s=Math.hypot(
p.vx,
p.vy
);

if(s>5.5){

p.vx=p.vx/s*5.5;
p.vy=p.vy/s*5.5;

}

p.x+=p.vx*dt;
p.y+=p.vy*dt;

}

function cpuMove(p,dt){

let target=null;
let best=99999;

players.forEach(o=>{

if(o===p||!o.alive)return;

const d=Math.hypot(
o.x-p.x,
o.y-p.y
);

if(d<best){

best=d;
target=o;

}

});

if(!target)return;

const dx=target.x-p.x;
const dy=target.y-p.y;

const d=Math.hypot(dx,dy)||1;

let x=dx/d;
let y=dy/d;

if(d<115){

const temp=x;

x=-y;
y=temp;

}

move(p,x,y,dt);

if(
d<105&&
Math.random()<.08
){

hit(p);

}

}

function hit(p){

if(!p.alive)return;

p.attack=1;

players.forEach(o=>{

if(o===p||!o.alive)return;

const d=Math.hypot(
o.x-p.x,
o.y-p.y
);

if(d<105){

o.hp-=p.cpu?7:10;

const dx=o.x-p.x;
const dy=o.y-p.y;

const l=Math.hypot(dx,dy)||1;

o.vx+=dx/l*3;
o.vy+=dy/l*3;

if(o.hp<=0){

o.hp=0;
o.alive=false;

}

}

});

}

function limit(p){

const r=36;

if(p.x<r){

p.x=r;
p.vx=Math.abs(p.vx)*.5;

}

if(p.x>W-r){

p.x=W-r;
p.vx=-Math.abs(p.vx)*.5;

}

if(p.y<r){

p.y=r;
p.vy=Math.abs(p.vy)*.5;

}

if(p.y>H-r){

p.y=H-r;
p.vy=-Math.abs(p.vy)*.5;

}

}

function checkWinner(){

if(finished)return;

const alive=
players.filter(p=>p.alive);

if(alive.length<=1){

finished=true;
running=false;

const winner=
alive[0]||null;

if(mode==="online"){

const data={
type:"result",
winner:winner?
{
id:winner.id,
name:winner.name
}:null
};

connections.forEach(c=>{

if(c.open)
send(c,data);

});

}

showResult(winner);

}

}

function showResult(winner){

document.getElementById(
"againHost"
).style.display=
isHost?"inline-block":"none";

document.getElementById(
"againGuest"
).style.display=
isHost?"none":"inline-block";

if(winner){

if(winner.id===myId){

document.getElementById(
"resultTitle"
).textContent=
"🏆 ¡GANASTE!";

}else{

document.getElementById(
"resultTitle"
).textContent=
"🏆 "+winner.name;

}

}else{

document.getElementById(
"resultTitle"
).textContent=
"⚔️ EMPATE";

}

document.getElementById(
"resultInfo"
).textContent=
"¡La batalla terminó!";

document.getElementById(
"resultOverlay"
).classList.add("show");

}

function pauseGame(){

if(!running&&!paused)return;

paused=!paused;

document.getElementById(
"pauseOverlay"
).classList.toggle(
"show",
paused
);

}

function leaveGame(){

if(mode==="online")
leaveRoom();
else
goMenu();

}

function again(){

if(mode==="solo"){

solo();

return;

}

if(isHost){

finished=false;
running=false;

players.forEach(p=>{

p.cpu=false;
p.alive=true;
p.hp=100;

p.vx=0;
p.vy=0;

p.ix=0;
p.iy=0;
p.ia=false;

p.last=Date.now();

});

document.getElementById(
"resultOverlay"
).classList.remove("show");

updateLobby();

broadcastLobby();

screen("lobby");

}else{

document.getElementById(
"resultOverlay"
).classList.remove("show");

screen("lobby");

if(hostConn&&hostConn.open){

send(hostConn,{
type:"ready"
});

}

}

}

function guestDisconnected(conn){

const i=
connections.indexOf(conn);

if(i>=0)
connections.splice(i,1);

const p=
players.find(
x=>x.id===conn.__playerId
);

if(
p&&
mode==="online"&&
!finished
){

p.cpu=true;
p.last=Date.now();

p.ix=0;
p.iy=0;
p.ia=false;

if(!running)
broadcastLobby();

}

}

function leaveRoom(){

if(isHost){

connections.forEach(c=>{

if(c.open)
send(c,{
type:"hostLeft"
});

});

}

cleanup();

document.getElementById(
"resultOverlay"
).classList.remove("show");

screen("menu");

}

function cleanup(){

if(peer){

try{
peer.destroy();
}catch(e){}

}

peer=null;
hostConn=null;
connections=[];

players=[];

room="";
myId=0;

isHost=false;
mode="";

running=false;
paused=false;
finished=false;

}

function readKeyboard(){

let x=0;
let y=0;

if(
keys["ArrowLeft"]||
keys["a"]||
keys["A"]
)x--;

if(
keys["ArrowRight"]||
keys["d"]||
keys["D"]
)x++;

if(
keys["ArrowUp"]||
keys["w"]||
keys["W"]
)y--;

if(
keys["ArrowDown"]||
keys["s"]||
keys["S"]
)y++;

const l=Math.hypot(x,y);

if(l){

x/=l;
y/=l;

}

if(!touchActive){

input.x=x;
input.y=y;

}

input.attack=
!!(
keys[" "]||
keys["Spacebar"]
);

}

addEventListener("keydown",e=>{

keys[e.key]=true;

if(
e.key===" "||
e.key.startsWith("Arrow")
)e.preventDefault();

if(
e.key==="Escape"&&
running
)
pauseGame();

});

addEventListener("keyup",e=>{

keys[e.key]=false;

});

let touchActive=false;

const joy=
document.getElementById("joy");

const stick=
document.getElementById("stick");

const attack=
document.getElementById("attack");

let joyDown=false;

function moveJoy(x,y){

const r=
joy.getBoundingClientRect();

const cx=
r.left+r.width/2;

const cy=
r.top+r.height/2;

let dx=x-cx;
let dy=y-cy;

const max=43;

const l=
Math.hypot(dx,dy);

if(l>max){

dx=dx/l*max;
dy=dy/l*max;

}

stick.style.transform=
"translate("+dx+"px,"+dy+"px)";

input.x=dx/max;
input.y=dy/max;

}

joy.addEventListener(
"pointerdown",
e=>{

joyDown=true;
touchActive=true;

joy.setPointerCapture(
e.pointerId
);

moveJoy(
e.clientX,
e.clientY
);

});

joy.addEventListener(
"pointermove",
e=>{

if(joyDown)
moveJoy(
e.clientX,
e.clientY
);

});

function joyEnd(){

joyDown=false;
touchActive=false;

input.x=0;
input.y=0;

stick.style.transform=
"translate(0,0)";

}

joy.addEventListener(
"pointerup",
joyEnd
);

joy.addEventListener(
"pointercancel",
joyEnd
);

attack.addEventListener(
"pointerdown",
e=>{

e.preventDefault();

input.attack=true;

});

attack.addEventListener(
"pointerup",
e=>{

e.preventDefault();

input.attack=false;

});

attack.addEventListener(
"pointercancel",
()=>{

input.attack=false;

});

function draw(){

ctx.clearRect(
0,
0,
W,
H
);

drawArena();

players.forEach(
drawPlayer
);

const me=
players.find(
p=>p.id===myId
);

if(me){

document.getElementById(
"life"
).textContent=
"❤️ "+Math.max(
0,
Math.round(me.hp)
);

}

document.getElementById(
"alive"
).textContent=
"⚔️ "+
players.filter(
p=>p.alive
).length+
" vivos";

}

function drawArena(){

const g=
ctx.createRadialGradient(
W/2,
H/2,
20,
W/2,
H/2,
Math.max(W,H)
);

g.addColorStop(
0,
"#263b96"
);

g.addColorStop(
.35,
"#111c59"
);

g.addColorStop(
.7,
"#070c2b"
);

g.addColorStop(
1,
"#010208"
);

ctx.fillStyle=g;

ctx.fillRect(
0,
0,
W,
H
);

/* ESTRELLAS */

for(let i=0;i<90;i++){

const x=
(i*97)%W;

const y=
(i*53)%H;

const a=
.25+
Math.sin(performance.now()*.001+i)*.15;

ctx.fillStyle=
"rgba(120,220,255,"+
a+
")";

ctx.beginPath();

ctx.arc(
x,
y,
(i%3===0?1.8:1),
0,
Math.PI*2
);

ctx.fill();

}

/* CUADRÍCULA */

ctx.strokeStyle="#91a3ff18";
ctx.lineWidth=1;

for(
let x=0;
x<W;
x+=65
){

ctx.beginPath();
ctx.moveTo(x,0);
ctx.lineTo(x,H);
ctx.stroke();

}

for(
let y=0;
y<H;
y+=65
){

ctx.beginPath();
ctx.moveTo(0,y);
ctx.lineTo(W,y);
ctx.stroke();

}

/* ARENA */

const radius=
Math.min(W,H)*.39;

ctx.beginPath();

ctx.arc(
W/2,
H/2,
radius,
0,
Math.PI*2
);

ctx.fillStyle="#121b55aa";
ctx.fill();

ctx.strokeStyle="#6179ff";
ctx.lineWidth=7;

ctx.shadowBlur=25;
ctx.shadowColor="#405eff";

ctx.stroke();

ctx.shadowBlur=0;

/* ANILLOS */

ctx.beginPath();

ctx.arc(
W/2,
H/2,
radius*.72,
0,
Math.PI*2
);

ctx.strokeStyle="#55dfff44";
ctx.lineWidth=3;

ctx.stroke();

ctx.beginPath();

ctx.arc(
W/2,
H/2,
radius*.42,
0,
Math.PI*2
);

ctx.strokeStyle="#ff55d944";
ctx.lineWidth=3;

ctx.stroke();

/* CENTRO */

const cg=
ctx.createRadialGradient(
W/2,
H/2,
3,
W/2,
H/2,
55
);

cg.addColorStop(
0,
"#ffffff"
);

cg.addColorStop(
.15,
"#5ff6ff"
);

cg.addColorStop(
.5,
"#596aff"
);

cg.addColorStop(
1,
"#16205e00"
);

ctx.fillStyle=cg;

ctx.beginPath();

ctx.arc(
W/2,
H/2,
55,
0,
Math.PI*2
);

ctx.fill();

}

function drawPlayer(p){

if(!p.alive)return;

const r=34;

ctx.save();

ctx.translate(
p.x,
p.y
);

ctx.rotate(
p.angle
);

ctx.shadowBlur=28;
ctx.shadowColor=p.color;

/* ALETAS */

ctx.beginPath();

for(let i=0;i<20;i++){

const a=
i*Math.PI/10;

const rr=
i%2===0?
r:
r*.76;

const x=
Math.cos(a)*rr;

const y=
Math.sin(a)*rr;

if(i===0)
ctx.moveTo(x,y);
else
ctx.lineTo(x,y);

}

ctx.closePath();

const blade=
ctx.createRadialGradient(
-8,
-8,
2,
0,
0,
r
);

blade.addColorStop(
0,
"#ffffff"
);

blade.addColorStop(
.16,
p.color
);

blade.addColorStop(
.65,
p.color
);

blade.addColorStop(
1,
"#10152f"
);

ctx.fillStyle=blade;

ctx.fill();

ctx.strokeStyle="#ffffffaa";
ctx.lineWidth=2;

ctx.stroke();

ctx.shadowBlur=0;

/* NÚCLEO */

ctx.beginPath();

ctx.arc(
0,
0,
r*.52,
0,
Math.PI*2
);

ctx.fillStyle="#0a1030";

ctx.fill();

ctx.strokeStyle="#b8c8ff";
ctx.lineWidth=2;

ctx.stroke();

/* CENTRO */

ctx.beginPath();

ctx.arc(
0,
0,
r*.19,
0,
Math.PI*2
);

ctx.fillStyle="#ffffff";

ctx.fill();

ctx.beginPath();

ctx.arc(
0,
0,
r*.1,
0,
Math.PI*2
);

ctx.fillStyle=p.color;

ctx.fill();

ctx.restore();

/* ATAQUE */

if(p.attack>0){

ctx.beginPath();

ctx.arc(
p.x,
p.y,
r+15,
0,
Math.PI*2
);

ctx.strokeStyle=p.color;
ctx.lineWidth=5;

ctx.shadowBlur=20;
ctx.shadowColor=p.color;

ctx.stroke();

ctx.shadowBlur=0;

}

/* VIDA */

const bw=76;

const hp=
Math.max(
0,
p.hp/p.maxHp
);

ctx.fillStyle="#080c1b";

ctx.fillRect(
p.x-bw/2,
p.y-57,
bw,
8
);

ctx.fillStyle=
p.hp>50?
"#42ee78":
"#ff3e60";

ctx.fillRect(
p.x-bw/2,
p.y-57,
bw*hp,
8
);

/* NOMBRE */

ctx.font="900 13px Arial";

ctx.textAlign="center";

ctx.fillStyle="#fff";

ctx.shadowBlur=5;
ctx.shadowColor="#000";

ctx.fillText(
p.name,
p.x,
p.y-64
);

ctx.shadowBlur=0;

}

document.addEventListener(
"visibilitychange",
()=>{

if(
document.hidden&&
running
){

paused=true;

document.getElementById(
"pauseOverlay"
).classList.add("show");

}

});

window.addEventListener(
"beforeunload",
()=>{

if(isHost){

connections.forEach(c=>{

try{

send(
c,
{
type:"hostLeft"
}
);

}catch(e){}

});

}

});

</script>
