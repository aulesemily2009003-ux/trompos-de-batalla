<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>GUERRA BEYBLADE</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>

*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#ff8dcc,#8fdcff);
}

/* ================= PANTALLAS ================= */

.screen{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    z-index:50;
}

.screen.active{
    display:flex;
}

/* ================= MENÚ ================= */

.card{
    width:min(92%,480px);
    background:rgba(255,255,255,.95);
    padding:28px;
    border-radius:30px;
    text-align:center;
    box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.logo{
    font-size:40px;
    font-weight:900;
    color:#ff3c9d;
    text-shadow:3px 3px #ffd5eb;
    margin-bottom:8px;
}

.sub{
    color:#666;
    margin-bottom:22px;
}

input{
    width:100%;
    padding:15px;
    border:3px solid #ff9ed0;
    border-radius:15px;
    font-size:18px;
    text-align:center;
    outline:none;
    margin-bottom:12px;
}

button{
    width:100%;
    border:0;
    border-radius:18px;
    padding:15px;
    margin:6px 0;
    font-size:18px;
    font-weight:bold;
    color:white;
    background:linear-gradient(135deg,#ff55a8,#9478ff);
    box-shadow:0 5px 12px rgba(0,0,0,.18);
}

button:active{
    transform:scale(.97);
}

.blue{
    background:linear-gradient(135deg,#55cfff,#667fff);
}

.gray{
    background:#777;
}

/* ================= ONLINE ================= */

#onlineScreen .card{
    max-width:500px;
}

.code{
    font-size:48px;
    letter-spacing:10px;
    font-weight:900;
    color:#ff369e;
    background:#ffe2f1;
    padding:15px;
    border-radius:20px;
    margin:15px 0;
}

.status{
    min-height:25px;
    margin:8px 0;
    color:#555;
}

.waiting{
    background:#fff2f8;
    border-radius:18px;
    padding:15px;
    margin:15px 0;
    text-align:left;
}

.player{
    padding:10px;
    background:white;
    border-radius:12px;
    margin:5px 0;
    font-weight:bold;
}

/* ================= JUEGO ================= */

#gameScreen{
    background:#61bd50;
}

#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* ================= UI ================= */

#gameUI{
    position:absolute;
    top:8px;
    left:8px;
    right:8px;
    z-index:10;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    pointer-events:none;
}

#scoreBoard{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    max-width:75%;
}

.score{
    background:rgba(255,255,255,.9);
    padding:7px 10px;
    border-radius:12px;
    min-width:100px;
}

.scoreName{
    font-size:13px;
    font-weight:bold;
}

.hpBar{
    width:90px;
    height:8px;
    margin-top:3px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
}

.hpFill{
    height:100%;
    background:#ff4f83;
}

#pause{
    pointer-events:auto;
    width:auto;
    margin:0;
    padding:9px 13px;
    font-size:14px;
}

/* ================= CONTROLES ================= */

#mobileControls{
    position:absolute;
    bottom:15px;
    left:15px;
    right:15px;
    z-index:20;
    display:none;
    justify-content:space-between;
    align-items:center;
}

.joy{
    width:125px;
    height:125px;
    border-radius:50%;
    background:rgba(255,255,255,.28);
    border:3px solid rgba(255,255,255,.65);
    position:relative;
}

.knob{
    position:absolute;
    width:55px;
    height:55px;
    left:32px;
    top:32px;
    border-radius:50%;
    background:#ff4fa9;
    border:3px solid white;
}

.attack{
    width:100px;
    height:100px;
    border-radius:50%;
    border:4px solid white;
    background:linear-gradient(135deg,#ff4c9d,#ff8bc6);
    color:white;
    font-weight:bold;
    font-size:15px;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

/* ================= PAUSA ================= */

#pauseScreen{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:100;
    display:none;
    justify-content:center;
    align-items:center;
}

#pauseScreen .card{
    max-width:350px;
}

/* ================= GANADOR ================= */

#winnerScreen{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:110;
    display:none;
    justify-content:center;
    align-items:center;
}

#winnerScreen .card{
    max-width:360px;
}

#winnerText{
    font-size:30px;
    color:#ff3e9f;
    font-weight:bold;
}

/* ================= CELULAR ================= */

@media(max-width:700px){

    .logo{
        font-size:31px;
    }

    .card{
        padding:22px;
    }

    .code{
        font-size:40px;
    }

    #scoreBoard{
        max-width:70%;
    }

    .score{
        min-width:82px;
        padding:5px;
    }

    .hpBar{
        width:70px;
    }
}

</style>
</head>

<body>

<!-- =====================================================
     MENÚ PRINCIPAL
===================================================== -->

<div id="menuScreen" class="screen active">

    <div class="card">

        <div class="logo">
            ⚡ GUERRA BEYBLADE ⚡
        </div>

        <div class="sub">
            ¡Haz girar tu trompo y gana!
        </div>

        <input
            id="nameInput"
            maxlength="12"
            placeholder="Escribe tu nombre"
        >

        <button onclick="soloGame()">
            🎮 JUGAR SOLO
        </button>

        <button class="blue" onclick="openOnline()">
            🌐 JUGAR ONLINE
        </button>

    </div>

</div>

<!-- =====================================================
     ONLINE
===================================================== -->

<div id="onlineScreen" class="screen">

    <div class="card">

        <div class="logo">
            🌐 ONLINE
        </div>

        <input
            id="onlineName"
            maxlength="12"
            placeholder="Tu nombre"
        >

        <button onclick="createRoom()">
            🏠 CREAR SALA
        </button>

        <div style="margin:12px;color:#777;">
            O entrar a una sala
        </div>

        <input
            id="roomCodeInput"
            maxlength="4"
            inputmode="numeric"
            placeholder="CÓDIGO DE 4 NÚMEROS"
            oninput="onlyNumbers(this)"
        >

        <button class="blue" onclick="joinRoom()">
            🚀 ENTRAR A SALA
        </button>

        <div id="onlineMessage" class="status"></div>

        <button class="gray" onclick="backMenu()">
            ⬅ VOLVER
        </button>

    </div>

</div>

<!-- =====================================================
     SALA DE ESPERA
===================================================== -->

<div id="lobbyScreen" class="screen">

    <div class="card">

        <div class="logo">
            ⚔️ SALA
        </div>

        <div>
            Código de reunión:
        </div>

        <div id="roomCodeShow" class="code">
            0000
        </div>

        <div id="lobbyStatus" class="status">
            Esperando jugadores...
        </div>

        <div class="waiting">

            <b>👥 Jugadores en la sala:</b>

            <div id="playersWaiting"></div>

        </div>

        <button
            id="startButton"
            onclick="hostStartGame()"
            style="display:none;"
        >
            ⚔️ COMENZAR BATALLA
        </button>

        <button class="gray" onclick="leaveRoom()">
            🚪 SALIR DE LA SALA
        </button>

    </div>

</div>

<!-- =====================================================
     JUEGO
===================================================== -->

<div id="gameScreen" class="screen">

    <canvas id="canvas"></canvas>

    <div id="gameUI">

        <div id="scoreBoard"></div>

        <button id="pause" onclick="togglePause()">
            ⏸
        </button>

    </div>

    <div id="mobileControls">

        <div
            id="joystick"
            class="joy"
        >
            <div
                id="knob"
                class="knob"
            ></div>
        </div>

        <div
            id="attackButton"
            class="attack"
        >
            ⚡<br>
            ATACAR
        </div>

    </div>

</div>

<!-- =====================================================
     PAUSA
===================================================== -->

<div id="pauseScreen">

    <div class="card">

        <div class="logo">
            ⏸ PAUSA
        </div>

        <button onclick="togglePause()">
            ▶ CONTINUAR
        </button>

        <button onclick="returnMenu()">
            🏠 MENÚ
        </button>

    </div>

</div>

<!-- =====================================================
     GANADOR
===================================================== -->

<div id="winnerScreen">

    <div class="card">

        <div class="logo">
            🏆 GANADOR
        </div>

        <div id="winnerText"></div>

        <button onclick="returnMenu()">
            🏠 VOLVER AL MENÚ
        </button>

    </div>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){

    W=innerWidth;
    H=innerHeight;

    canvas.width=W;
    canvas.height=H;
}

resize();

addEventListener("resize",resize);


/* =====================================================
   VARIABLES
===================================================== */

let peer=null;

let hostConnection=null;

let connections=[];

let roomCode="";

let isHost=false;

let myId=0;

let myName="Jugador";

let players=[];

let gameRunning=false;

let paused=false;

let gameMode="";

let keys={};

let moveX=0;
let moveY=0;

let attackPressed=false;

let lastTime=performance.now();

let attackTimer=0;


/* =====================================================
   COLORES
===================================================== */

const COLORS=[
    "#ff4fa3",
    "#657dff",
    "#55d85b",
    "#ffad3d"
];


/* =====================================================
   PANTALLAS
===================================================== */

function show(id){

    document.querySelectorAll(".screen")
        .forEach(x=>x.classList.remove("active"));

    document.getElementById(id)
        .classList.add("active");
}


/* =====================================================
   NOMBRE
===================================================== */

function getName(){

    let n=document.getElementById("nameInput")
        .value.trim();

    if(!n)n="Jugador";

    return n.substring(0,12);
}


/* =====================================================
   ONLINE
===================================================== */

function openOnline(){

    const n=getName();

    document.getElementById("onlineName")
        .value=n;

    show("onlineScreen");
}


function onlyNumbers(input){

    input.value=input.value
        .replace(/[^0-9]/g,"")
        .slice(0,4);
}


/* =====================================================
   CREAR CÓDIGO
===================================================== */

function randomCode(){

    return String(
        Math.floor(
            1000+
            Math.random()*9000
        )
    );
}


/* =====================================================
   CREAR SALA
===================================================== */

function createRoom(){

    myName=document.getElementById("onlineName")
        .value.trim();

    if(!myName){
        myName="Jugador";
    }

    myName=myName.substring(0,12);

    isHost=true;

    gameMode="online";

    connections=[];

    document.getElementById("onlineMessage")
        .textContent="Creando sala...";

    createPeerRoom(0);
}


/* =====================================================
   PEER DEL HOST
===================================================== */

function createPeerRoom(attempt){

    if(attempt>20){

        document.getElementById("onlineMessage")
            .textContent=
            "No se pudo crear la sala. Intenta otra vez.";

        return;
    }

    roomCode=randomCode();

    const internalId=
        "beyblade"+roomCode;

    if(peer){

        try{
            peer.destroy();
        }catch(e){}

        peer=null;
    }

    peer=new Peer(
        internalId,
        {
            debug:1
        }
    );


    /* SALA CREADA */

    peer.on("open",()=>{

        console.log(
            "Sala:",
            roomCode,
            "ID interno:",
            internalId
        );

        players=[];

        addHost();

        document.getElementById(
            "roomCodeShow"
        ).textContent=roomCode;

        document.getElementById(
            "lobbyStatus"
        ).textContent=
            "Comparte el código. Esperando jugadores...";

        updateLobby();

        show("lobbyScreen");

    });


    /* ALGUIEN ENTRA */

    peer.on("connection",connection=>{

        console.log("Nueva conexión");

        if(connections.length>=3){

            connection.on("open",()=>{

                connection.send({
                    type:"roomFull"
                });

                setTimeout(()=>{
                    connection.close();
                },500);

            });

            return;
        }

        setupGuest(connection);

    });


    peer.on("error",error=>{

        console.log("Peer error:",error);

        if(
            error.type==="unavailable-id"
        ){

            try{
                peer.destroy();
            }catch(e){}

            setTimeout(()=>{
                createPeerRoom(
                    attempt+1
                );
            },200);

        }else{

            document.getElementById(
                "onlineMessage"
            ).textContent=
                "Error de conexión.";

        }

    });

}


/* =====================================================
   HOST
===================================================== */

function addHost(){

    players.push({

        id:0,

        name:myName,

        x:W/2,

        y:H/2,

        vx:0,

        vy:0,

        hp:100,

        alive:true,

        color:COLORS[0],

        attack:false,

        input:{
            x:0,
            y:0,
            attack:false
        },

        cpu:false

    });

    myId=0;
}


/* =====================================================
   INVITADO
===================================================== */

function setupGuest(connection){

    connections.push(connection);

    connection.on("open",()=>{

        const id=
            connections.length;

        connection.playerId=id;

        players.push({

            id:id,

            name:"Jugador "+id,

            x:W/2,

            y:H/2,

            vx:0,

            vy:0,

            hp:100,

            alive:true,

            color:COLORS[id],

            attack:false,

            input:{
                x:0,
                y:0,
                attack:false
            },

            cpu:false

        });


        /*
          Le decimos al nuevo jugador
          quién es y quién está en la sala.
        */

        connection.send({

            type:"welcome",

            id:id,

            players:getLobbyPlayers()

        });


        /*
          Le decimos a TODOS que alguien entró.
        */

        broadcastLobby();

        updateLobby();

    });


    connection.on("data",data=>{

        /* NOMBRE */

        if(data.type==="name"){

            const p=players.find(
                x=>x.id===connection.playerId
            );

            if(p){

                p.name=
                    String(data.name||"Jugador")
                    .substring(0,12);

                broadcastLobby();

                updateLobby();
            }
        }


        /* CONTROL */

        if(data.type==="input"){

            const p=players.find(
                x=>x.id===connection.playerId
            );

            if(p){

                p.input.x=
                    Number(data.x)||0;

                p.input.y=
                    Number(data.y)||0;

                p.input.attack=
                    Boolean(data.attack);
            }
        }


        /* INVITADO PIDE COMENZAR */

        if(data.type==="requestStart"){

            if(isHost){

                hostStartGame();
            }
        }

    });


    connection.on("close",()=>{

        const id=
            connection.playerId;

        connections=
            connections.filter(
                c=>c!==connection
            );

        players=
            players.filter(
                p=>p.id!==id
            );

        broadcastLobby();

        updateLobby();

    });

}


/* =====================================================
   INFORMACIÓN DEL LOBBY
===================================================== */

function getLobbyPlayers(){

    return players.map(p=>({

        id:p.id,

        name:p.name,

        color:p.color

    }));

}


/* =====================================================
   AVISAR A TODOS
===================================================== */

function broadcastLobby(){

    if(!isHost)return;

    const message={

        type:"lobby",

        players:getLobbyPlayers()

    };

    connections.forEach(c=>{

        if(c.open){

            try{
                c.send(message);
            }catch(e){}

        }

    });

}


/* =====================================================
   UNIRSE A SALA
===================================================== */

function joinRoom(){

    const code=document
        .getElementById("roomCodeInput")
        .value
        .replace(/[^0-9]/g,"");

    if(code.length!==4){

        document.getElementById(
            "onlineMessage"
        ).textContent=
            "Debes escribir 4 números.";

        return;
    }

    myName=document
        .getElementById("onlineName")
        .value.trim();

    if(!myName){
        myName="Jugador";
    }

    myName=myName.substring(0,12);

    roomCode=code;

    isHost=false;

    gameMode="online";

    document.getElementById(
        "onlineMessage"
    ).textContent=
        "Conectando a la sala...";


    if(peer){

        try{
            peer.destroy();
        }catch(e){}

    }


    /*
      El invitado crea su propio Peer.
    */

    peer=new Peer({
        debug:1
    });


    peer.on("open",()=>{

        const internalId=
            "beyblade"+roomCode;

        hostConnection=
            peer.connect(
                internalId,
                {
                    reliable:true
                }
            );


        hostConnection.on("open",()=>{

            console.log(
                "Conectado al anfitrión"
            );

            hostConnection.send({

                type:"name",

                name:myName

            });

            document.getElementById(
                "roomCodeShow"
            ).textContent=roomCode;

            document.getElementById(
                "lobbyStatus"
            ).textContent=
                "Conectado. Esperando al anfitrión...";

            show("lobbyScreen");

        });


        hostConnection.on("data",data=>{

            /* SALA LLENA */

            if(data.type==="roomFull"){

                document.getElementById(
                    "lobbyStatus"
                ).textContent=
                    "❌ La sala está llena.";

                return;
            }


            /* BIENVENIDA */

            if(data.type==="welcome"){

                myId=data.id;

                players=
                    convertLobbyPlayers(
                        data.players
                    );

                updateLobby();

            }


            /* CAMBIO DE JUGADORES */

            if(data.type==="lobby"){

                players=
                    convertLobbyPlayers(
                        data.players
                    );

                updateLobby();

            }


            /* COMENZÓ LA BATALLA */

            if(data.type==="start"){

                myId=data.myId;

                players=
                    data.players;

                startOnlineGame();

            }


            /* ESTADO DEL JUEGO */

            if(data.type==="state"){

                players=
                    data.players;

            }


            /* FINAL */

            if(data.type==="finish"){

                players=
                    data.players;

                gameRunning=false;

                showWinner(
                    data.winner
                );

            }

        });


        hostConnection.on("close",()=>{

            gameRunning=false;

            document.getElementById(
                "lobbyStatus"
            ).textContent=
                "❌ El anfitrión salió de la sala.";

        });

    });


    peer.on("error",error=>{

        console.log(error);

        document.getElementById(
            "onlineMessage"
        ).textContent=
            "❌ No se pudo encontrar esa sala.";

    });

}


/* =====================================================
   CONVERTIR JUGADORES
===================================================== */

function convertLobbyPlayers(list){

    return list.map(p=>({

        id:p.id,

        name:p.name,

        x:W/2,

        y:H/2,

        vx:0,

        vy:0,

        hp:100,

        alive:true,

        color:p.color,

        attack:false,

        input:{
            x:0,
            y:0,
            attack:false
        },

        cpu:false

    }));

}


/* =====================================================
   ACTUALIZAR LOBBY
===================================================== */

function updateLobby(){

    const box=
        document.getElementById(
            "playersWaiting"
        );

    box.innerHTML="";


    players.forEach((p,i)=>{

        const div=
            document.createElement("div");

        div.className="player";

        if(p.id===0){

            div.innerHTML=
                "👑 "+p.name+
                " <small>(Anfitrión)</small>";

        }else{

            div.innerHTML=
                "⚡ "+p.name+
                " <small>(Jugador "+(i+1)+")</small>";

        }

        box.appendChild(div);

    });


    if(isHost){

        document.getElementById(
            "lobbyStatus"
        ).textContent=
            players.length+
            "/4 jugadores en la sala";

        /*
          El botón solamente aparece
          al anfitrión.
        */

        document.getElementById(
            "startButton"
        ).style.display=
            players.length>=2
            ? "block"
            : "none";

    }else{

        document.getElementById(
            "startButton"
        ).style.display="none";

        document.getElementById(
            "lobbyStatus"
        ).textContent=
            "👑 Esperando que el anfitrión comience...";
    }

}


/* =====================================================
   ANFITRIÓN COMIENZA
===================================================== */

function hostStartGame(){

    if(!isHost)return;

    if(players.length<2){

        alert(
            "Debe haber al menos 2 jugadores."
        );

        return;
    }


    preparePlayers();


    /*
      Enviamos a cada jugador:

      - sus datos
      - todos los jugadores
      - su ID
      - orden de comenzar
    */

    connections.forEach(c=>{

        if(c.open){

            c.send({

                type:"start",

                myId:c.playerId,

                players:players

            });

        }

    });


    startOnlineGame();

}


/* =====================================================
   INICIAR ONLINE
===================================================== */

function startOnlineGame(){

    gameRunning=true;

    paused=false;

    document.getElementById(
        "pauseScreen"
    ).style.display="none";

    document.getElementById(
        "winnerScreen"
    ).style.display="none";

    document.getElementById(
        "mobileControls"
    ).style.display="flex";

    show("gameScreen");

    lastTime=performance.now();

    requestAnimationFrame(gameLoop);

}


/* =====================================================
   PREPARAR JUGADORES
===================================================== */

function preparePlayers(){

    players.forEach((p,i)=>{

        const angle=
            (Math.PI*2/players.length)*i;

        const radius=
            Math.min(W,H)*.28;

        p.x=
            W/2+
            Math.cos(angle)*radius;

        p.y=
            H/2+
            Math.sin(angle)*radius;

        p.vx=0;
        p.vy=0;

        p.hp=100;

        p.alive=true;

        p.attack=false;

        p.input={
            x:0,
            y:0,
            attack:false
        };

    });

}


/* =====================================================
   SOLO
===================================================== */

function soloGame(){

    myName=getName();

    isHost=true;

    gameMode="solo";

    players=[];

    addHost();


    for(let i=1;i<4;i++){

        players.push({

            id:i,

            name:"CPU "+i,

            x:W/2,

            y:H/2,

            vx:0,

            vy:0,

            hp:100,

            alive:true,

            color:COLORS[i],

            attack:false,

            input:{
                x:0,
                y:0,
                attack:false
            },

            cpu:true

        });

    }


    preparePlayers();

    gameRunning=true;

    paused=false;

    document.getElementById(
        "mobileControls"
    ).style.display="flex";

    show("gameScreen");

    lastTime=performance.now();

    requestAnimationFrame(gameLoop);

}


/* =====================================================
   LOOP
===================================================== */

function gameLoop(time){

    if(!gameRunning)return;

    const dt=
        Math.min(
            (time-lastTime)/16.67,
            2
        );

    lastTime=time;

    if(!paused){

        if(gameMode==="solo"){

            updateSolo(dt);

        }else{

            if(isHost){

                updateOnlineHost(dt);

            }else{

                updateLocalInput();

            }

        }

        draw();

        updateScore();

    }

    requestAnimationFrame(gameLoop);

}


/* =====================================================
   SOLO UPDATE
===================================================== */

function updateSolo(dt){

    updateLocalInput();

    players.forEach(p=>{

        if(!p.alive)return;

        if(p.cpu){

            cpuControl(p);

        }

        move(p,dt);

    });

    combat();

    checkWinner();

}


/* =====================================================
   ONLINE HOST UPDATE
===================================================== */

function updateOnlineHost(dt){

    players.forEach(p=>{

        if(!p.alive)return;

        move(p,dt);

    });


    combat();


    const alive=
        players.filter(
            p=>p.alive
        );


    if(alive.length<=1){

        const winner=
            alive.length
            ? alive[0].name
            : "Nadie";


        gameRunning=false;


        connections.forEach(c=>{

            if(c.open){

                c.send({

                    type:"finish",

                    players:players,

                    winner:winner

                });

            }

        });


        showWinner(winner);

        return;
    }


    /*
      Mandamos la posición
      de todos a los celulares.
    */

    broadcastState();

}


/* =====================================================
   MOVIMIENTO LOCAL
===================================================== */

function updateLocalInput(){

    let x=moveX;
    let y=moveY;


    if(keys["arrowleft"]||keys["a"])
        x-=1;

    if(keys["arrowright"]||keys["d"])
        x+=1;

    if(keys["arrowup"]||keys["w"])
        y-=1;

    if(keys["arrowdown"]||keys["s"])
        y+=1;


    const length=
        Math.hypot(x,y);


    if(length>1){

        x/=length;
        y/=length;

    }


    const p=
        players.find(
            x=>x.id===myId
        );


    if(p){

        p.input.x=x;
        p.input.y=y;

        if(attackPressed){

            p.input.attack=true;

            attackPressed=false;

        }

    }


    /*
      Si soy invitado,
      envío mis controles al host.
    */

    if(
        !isHost &&
        hostConnection &&
        hostConnection.open
    ){

        hostConnection.send({

            type:"input",

            x:x,

            y:y,

            attack:p ? p.input.attack:false

        });


        if(p){
            p.input.attack=false;
        }

    }

}


/* =====================================================
   MOVIMIENTO
===================================================== */

function move(p,dt){

    let x=p.input.x||0;
    let y=p.input.y||0;


    const len=
        Math.hypot(x,y);


    if(len>1){

        x/=len;
        y/=len;

    }


    p.vx+=x*.75;
    p.vy+=y*.75;


    p.vx*=.91;
    p.vy*=.91;


    const speed=
        Math.hypot(
            p.vx,
            p.vy
        );


    if(speed>6){

        p.vx=
            p.vx/speed*6;

        p.vy=
            p.vy/speed*6;

    }


    p.x+=p.vx*dt;
    p.y+=p.vy*dt;


    const r=32;


    if(p.x<r){

        p.x=r;
        p.vx*=-.5;

    }

    if(p.x>W-r){

        p.x=W-r;
        p.vx*=-.5;

    }

    if(p.y<r){

        p.y=r;
        p.vy*=-.5;

    }

    if(p.y>H-r){

        p.y=H-r;
        p.vy*=-.5;

    }

}


/* =====================================================
   CPU
===================================================== */

function cpuControl(p){

    const enemies=
        players.filter(
            x=>x.id!==p.id&&x.alive
        );


    if(!enemies.length)return;


    let target=enemies[0];

    let best=Infinity;


    enemies.forEach(e=>{

        const d=
            Math.hypot(
                e.x-p.x,
                e.y-p.y
            );

        if(d<best){

            best=d;
            target=e;

        }

    });


    const dx=
        target.x-p.x;

    const dy=
        target.y-p.y;

    const d=
        Math.hypot(dx,dy)||1;


    if(d>75){

        p.input.x=dx/d;
        p.input.y=dy/d;

    }else{

        p.input.x=-dy/d;
        p.input.y=dx/d;

        if(Math.random()<.08){

            p.input.attack=true;

        }

    }

}


/* =====================================================
   COMBATE
===================================================== */

function combat(){

    if(attackTimer>0){

        attackTimer--;

    }


    players.forEach(p=>{

        if(!p.alive)return;


        if(p.input.attack){

            attack(p);

            p.input.attack=false;

        }

    });


    /*
      Empujones entre trompos
    */

    for(
        let i=0;
        i<players.length;
        i++
    ){

        for(
            let j=i+1;
            j<players.length;
            j++
        ){

            const a=players[i];
            const b=players[j];


            if(
                !a.alive||
                !b.alive
            )continue;


            const dx=b.x-a.x;
            const dy=b.y-a.y;


            const d=
                Math.hypot(dx,dy);


            if(d<55){

                const nx=
                    dx/(d||1);

                const ny=
                    dy/(d||1);


                a.vx-=nx*.5;
                a.vy-=ny*.5;

                b.vx+=nx*.5;
                b.vy+=ny*.5;

            }

        }

    }

}


/* =====================================================
   ATAQUE
===================================================== */

function attack(p){

    if(attackTimer>0)return;

    attackTimer=12;

    p.attack=true;


    setTimeout(()=>{

        p.attack=false;

    },150);


    players.forEach(enemy=>{

        if(
            enemy===p||
            !enemy.alive
        )return;


        const dx=
            enemy.x-p.x;

        const dy=
            enemy.y-p.y;


        const d=
            Math.hypot(dx,dy);


        if(d<72){

            enemy.hp-=15;


            const nx=
                dx/(d||1);

            const ny=
                dy/(d||1);


            enemy.vx+=nx*5;
            enemy.vy+=ny*5;


            if(enemy.hp<=0){

                enemy.hp=0;

                enemy.alive=false;

            }

        }

    });

}


/* =====================================================
   GANADOR
===================================================== */

function checkWinner(){

    const alive=
        players.filter(
            p=>p.alive
        );


    if(alive.length<=1){

        gameRunning=false;

        const winner=
            alive.length
            ? alive[0].name
            : "Nadie";

        showWinner(winner);

    }

}


/* =====================================================
   ESTADO ONLINE
===================================================== */

function broadcastState(){

    const message={

        type:"state",

        players:players

    };


    connections.forEach(c=>{

        if(c.open){

            try{

                c.send(message);

            }catch(e){}

        }

    });

}


/* =====================================================
   DIBUJAR
===================================================== */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /* PISO */

    ctx.fillStyle="#69c856";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* CUADRÍCULA */

    ctx.strokeStyle=
        "rgba(255,255,255,.10)";

    ctx.lineWidth=2;


    for(
        let x=0;
        x<W;
        x+=50
    ){

        ctx.beginPath();

        ctx.moveTo(x,0);
        ctx.lineTo(x,H);

        ctx.stroke();

    }


    for(
        let y=0;
        y<H;
        y+=50
    ){

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

        ctx.stroke();

    }


    /* ARENA */

    const radius=
        Math.min(W,H)*.42;


    ctx.beginPath();

    ctx.arc(
        W/2,
        H/2,
        radius,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#8ddd6b";

    ctx.fill();

    ctx.strokeStyle="white";

    ctx.lineWidth=7;

    ctx.stroke();


    /* TROMPOS */

    players.forEach(p=>{

        if(p.alive){

            drawTrompo(p);

        }

    });

}


/* =====================================================
   TROMPO
===================================================== */

function drawTrompo(p){

    ctx.save();

    ctx.translate(
        p.x,
        p.y
    );


    const rotation=
        performance.now()/75+
        p.id;


    ctx.rotate(rotation);


    /* SOMBRA */

    ctx.beginPath();

    ctx.ellipse(
        0,
        8,
        31,
        13,
        0,
        0,
        Math.PI*2
    );

    ctx.fillStyle=
        "rgba(0,0,0,.18)";

    ctx.fill();


    /* TROMPO */

    ctx.beginPath();

    ctx.moveTo(0,-34);

    ctx.lineTo(25,-11);

    ctx.lineTo(30,10);

    ctx.lineTo(15,29);

    ctx.lineTo(0,34);

    ctx.lineTo(-15,29);

    ctx.lineTo(-30,10);

    ctx.lineTo(-25,-11);

    ctx.closePath();


    ctx.fillStyle=p.color;

    ctx.fill();


    ctx.strokeStyle="white";

    ctx.lineWidth=3;

    ctx.stroke();


    /* CENTRO */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        10,
        0,
        Math.PI*2
    );

    ctx.fillStyle="white";

    ctx.fill();


    ctx.restore();


    /* ATAQUE */

    if(p.attack){

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            47,
            0,
            Math.PI*2
        );

        ctx.strokeStyle="#fff";

        ctx.lineWidth=5;

        ctx.stroke();

    }


    /* NOMBRE */

    ctx.fillStyle="white";

    ctx.font="bold 13px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        p.name,
        p.x,
        p.y-45
    );

}


/* =====================================================
   MARCADORES
===================================================== */

function updateScore(){

    const board=
        document.getElementById(
            "scoreBoard"
        );


    board.innerHTML="";


    players.forEach(p=>{

        if(!p.alive)return;


        const div=
            document.createElement("div");

        div.className="score";


        div.innerHTML=`

            <div class="scoreName">
                ${p.name}
            </div>

            <div class="hpBar">

                <div
                    class="hpFill"
                    style="width:${p.hp}%"
                ></div>

            </div>

        `;


        board.appendChild(div);

    });

}


/* =====================================================
   TECLADO
===================================================== */

addEventListener(
    "keydown",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=true;


        if(e.key===" "){

            e.preventDefault();

            attackPressed=true;

        }

    }
);


addEventListener(
    "keyup",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=false;

    }
);


/* =====================================================
   JOYSTICK CELULAR
===================================================== */

const joystick=
    document.getElementById(
        "joystick"
    );

const knob=
    document.getElementById(
        "knob"
    );


let joystickActive=false;


function joystickMove(e){

    if(!joystickActive)return;

    const touch=
        e.touches[0];


    const rect=
        joystick.getBoundingClientRect();


    const centerX=
        rect.left+
        rect.width/2;

    const centerY=
        rect.top+
        rect.height/2;


    let dx=
        touch.clientX-
        centerX;

    let dy=
        touch.clientY-
        centerY;


    const max=42;


    const length=
        Math.hypot(dx,dy);


    if(length>max){

        dx=
            dx/length*max;

        dy=
            dy/length*max;

    }


    knob.style.left=
        (32+dx)+"px";

    knob.style.top=
        (32+dy)+"px";


    moveX=dx/max;
    moveY=dy/max;

}


joystick.addEventListener(
    "touchstart",
    e=>{

        e.preventDefault();

        joystickActive=true;

        joystickMove(e);

    },
    {passive:false}
);


joystick.addEventListener(
    "touchmove",
    e=>{

        e.preventDefault();

        joystickMove(e);

    },
    {passive:false}
);


joystick.addEventListener(
    "touchend",
    e=>{

        e.preventDefault();

        joystickActive=false;

        moveX=0;
        moveY=0;

        knob.style.left="32px";
        knob.style.top="32px";

    },
    {passive:false}
);


/* =====================================================
   BOTÓN ATAQUE CELULAR
===================================================== */

document.getElementById(
    "attackButton"
).addEventListener(
    "touchstart",
    e=>{

        e.preventDefault();

        attackPressed=true;

    },
    {passive:false}
);


/* =====================================================
   PAUSA
===================================================== */

function togglePause(){

    if(
        gameMode==="online" &&
        !isHost
    ){
        return;
    }


    if(!gameRunning)return;


    paused=!paused;


    document.getElementById(
        "pauseScreen"
    ).style.display=
        paused
        ? "flex"
        : "none";

}


/* =====================================================
   GANADOR
===================================================== */

function showWinner(name){

    gameRunning=false;

    document.getElementById(
        "mobileControls"
    ).style.display="none";


    document.getElementById(
        "winnerText"
    ).textContent=
        "🎉 "+name+" ganó la batalla";


    document.getElementById(
        "winnerScreen"
    ).style.display="flex";

}


/* =====================================================
   SALIR
===================================================== */

function leaveRoom(){

    cleanupNetwork();

    show("onlineScreen");

}


function backMenu(){

    cleanupNetwork();

    show("menuScreen");

}


function returnMenu(){

    gameRunning=false;

    paused=false;

    document.getElementById(
        "pauseScreen"
    ).style.display="none";

    document.getElementById(
        "winnerScreen"
    ).style.display="none";

    cleanupNetwork();

    show("menuScreen");

}


/* =====================================================
   LIMPIAR CONEXIONES
===================================================== */

function cleanupNetwork(){

    gameRunning=false;


    if(hostConnection){

        try{
            hostConnection.close();
        }catch(e){}

        hostConnection=null;

    }


    connections.forEach(c=>{

        try{
            c.close();
        }catch(e){}

    });


    connections=[];


    if(peer){

        try{
            peer.destroy();
        }catch(e){}

        peer=null;

    }


    players=[];

    isHost=false;

}


/* =====================================================
   INICIO
===================================================== */

show("menuScreen");

</script>
