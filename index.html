<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>GUERRA BEYBLADE</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top,#3d9cff,#061b45 55%,#020817);
    color:white;
}

.screen{
    display:none;
    width:100%;
    height:100%;
}

.screen.active{
    display:flex;
}

button{
    border:none;
    cursor:pointer;
    font-weight:bold;
    color:white;
}

#menuScreen{
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.menuBox{
    width:min(500px,94vw);
    padding:35px 25px;
    border-radius:30px;
    background:linear-gradient(145deg,rgba(20,74,160,.95),rgba(3,20,58,.98));
    border:2px solid #61c7ff;
    box-shadow:
        0 0 25px #168cff,
        inset 0 0 30px rgba(50,160,255,.2);
}

.logo{
    font-size:clamp(38px,10vw,70px);
    font-weight:1000;
    color:#fff;
    text-shadow:
        0 0 8px #36bfff,
        0 0 25px #0077ff,
        4px 4px 0 #06245f;
    margin-bottom:8px;
}

.subtitle{
    color:#aee5ff;
    font-size:18px;
    margin-bottom:28px;
}

.menuButton{
    width:100%;
    padding:17px;
    margin:8px 0;
    border-radius:18px;
    font-size:20px;
    background:linear-gradient(90deg,#087cff,#22c9ff);
    box-shadow:0 5px 15px rgba(0,0,0,.4);
    transition:.2s;
}

.menuButton:hover{
    transform:scale(1.03);
    box-shadow:0 0 20px #19aaff;
}

.menuButton.secondary{
    background:linear-gradient(90deg,#164b9b,#3978d9);
}

#onlineScreen,
#lobbyScreen{
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:15px;
}

.panel{
    width:min(550px,95vw);
    max-height:95vh;
    overflow:auto;
    padding:28px 22px;
    border-radius:28px;
    background:linear-gradient(145deg,rgba(8,42,100,.97),rgba(2,14,43,.98));
    border:2px solid #46c7ff;
    box-shadow:0 0 30px rgba(0,153,255,.6);
}

.panel h2{
    font-size:34px;
    margin-bottom:18px;
    text-shadow:0 0 12px #22bfff;
}

input{
    width:100%;
    padding:16px;
    margin:7px 0;
    border-radius:15px;
    border:2px solid #349dff;
    background:#031637;
    color:white;
    font-size:18px;
    outline:none;
    text-align:center;
}

input:focus{
    border-color:#6ed8ff;
    box-shadow:0 0 15px #168cff;
}

.roomCode{
    font-size:48px;
    letter-spacing:10px;
    font-weight:1000;
    color:#7cddff;
    text-shadow:0 0 20px #008cff;
    padding:15px;
}

.info{
    color:#bceaff;
    margin:10px 0 18px;
}

.playersList{
    margin:15px 0;
}

.playerItem{
    padding:13px;
    margin:7px 0;
    border-radius:14px;
    background:linear-gradient(90deg,#0c3984,#075cae);
    border:1px solid #3bc5ff;
    text-align:left;
}

.status{
    padding:10px;
    border-radius:12px;
    background:#03183b;
    color:#7ddcff;
    margin:10px 0;
}

#gameScreen{
    position:relative;
    background:#020b20;
}

#gameCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    background:#061634;
}

#topBar{
    position:absolute;
    left:10px;
    right:10px;
    top:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    pointer-events:none;
    z-index:5;
}

.gameTitle{
    padding:9px 15px;
    border-radius:14px;
    background:rgba(3,27,68,.85);
    border:1px solid #35bfff;
    color:#9ce8ff;
    font-weight:bold;
}

.pauseButton{
    pointer-events:auto;
    padding:10px 16px;
    border-radius:14px;
    background:#0b65cf;
    border:1px solid #75dfff;
    font-size:16px;
}

#touchControls{
    position:absolute;
    left:0;
    right:0;
    bottom:20px;
    height:190px;
    pointer-events:none;
    z-index:10;
}

#joystick{
    position:absolute;
    left:25px;
    bottom:15px;
    width:145px;
    height:145px;
    border-radius:50%;
    background:rgba(25,124,210,.3);
    border:3px solid rgba(99,218,255,.75);
    box-shadow:0 0 25px rgba(0,155,255,.5);
    pointer-events:auto;
    touch-action:none;
}

#stick{
    position:absolute;
    width:62px;
    height:62px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:linear-gradient(145deg,#65ddff,#0879ff);
    border:2px solid white;
    box-shadow:0 0 18px #009dff;
}

#attackButton{
    position:absolute;
    right:25px;
    bottom:25px;
    width:125px;
    height:125px;
    border-radius:50%;
    background:linear-gradient(145deg,#2ed8ff,#075dff);
    border:4px solid #a8efff;
    box-shadow:0 0 25px #008cff;
    font-size:18px;
    pointer-events:auto;
    touch-action:none;
}

#pauseOverlay,
#resultOverlay{
    position:absolute;
    inset:0;
    z-index:20;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,8,25,.78);
    backdrop-filter:blur(7px);
}

.overlayBox{
    width:min(450px,90vw);
    padding:30px;
    border-radius:28px;
    text-align:center;
    background:linear-gradient(145deg,#0a438d,#031838);
    border:2px solid #4ed5ff;
    box-shadow:0 0 35px #008cff;
}

.overlayBox h2{
    font-size:38px;
    color:#9beaff;
    margin-bottom:15px;
}

.winner{
    font-size:27px;
    margin:20px 0;
    color:#fff;
}

#mobileOnlyInfo{
    display:none;
}

@media(max-width:700px){
    #mobileOnlyInfo{
        display:block;
        color:#8edfff;
        font-size:13px;
        margin-top:12px;
    }

    .logo{
        font-size:45px;
    }

    .roomCode{
        font-size:40px;
    }

    .panel{
        padding:23px 17px;
    }
}

@media(min-width:701px){
    #touchControls{
        display:none;
    }
}
</style>
</head>

<body>

<!-- ================= MENU ================= -->

<div id="menuScreen" class="screen active">

    <div class="menuBox">

        <div class="logo">⚡ BEYBLADE ⚡</div>
        <div class="subtitle">GUERRA DE TROMPOS</div>

        <button class="menuButton" onclick="startSolo()">
            🎮 JUGAR SOLO
        </button>

        <button class="menuButton" onclick="openOnline()">
            🌐 JUGAR ONLINE
        </button>

        <button class="menuButton secondary" onclick="showInstructions()">
            📖 CÓMO JUGAR
        </button>

        <div id="mobileOnlyInfo">
            📱 En celular usa el joystick azul para moverte.
        </div>

    </div>

</div>


<!-- ================= ONLINE ================= -->

<div id="onlineScreen" class="screen">

    <div class="panel">

        <h2>🌐 BATALLA ONLINE</h2>

        <input
            id="playerName"
            maxlength="12"
            placeholder="Tu nombre"
        >

        <button class="menuButton" onclick="createRoom()">
            🏠 CREAR SALA
        </button>

        <div style="margin:12px;color:#7ecfff;">O</div>

        <input
            id="roomInput"
            maxlength="4"
            inputmode="numeric"
            placeholder="Código de 4 números"
            oninput="onlyNumbers(this)"
        >

        <button class="menuButton" onclick="joinRoom()">
            🚪 ENTRAR A SALA
        </button>

        <button class="menuButton secondary" onclick="backToMenu()">
            ⬅ VOLVER
        </button>

        <div id="connectionStatus" class="status">
            Listo para jugar.
        </div>

    </div>

</div>


<!-- ================= LOBBY ================= -->

<div id="lobbyScreen" class="screen">

    <div class="panel">

        <h2>🏆 SALA DE BATALLA</h2>

        <div>CODIGO DE SALA</div>

        <div id="roomDisplay" class="roomCode">
            ----
        </div>

        <div id="hostText" class="info"></div>

        <h3>👥 JUGADORES</h3>

        <div id="playersList" class="playersList"></div>

        <div id="lobbyStatus" class="status">
            Esperando jugadores...
        </div>

        <button
            id="startMatchButton"
            class="menuButton"
            onclick="hostStartGame()"
            style="display:none"
        >
            ▶ INICIAR PARTIDA
        </button>

        <button
            class="menuButton secondary"
            onclick="leaveRoom()"
        >
            🚪 SALIR DE LA SALA
        </button>

    </div>

</div>


<!-- ================= GAME ================= -->

<div id="gameScreen" class="screen">

    <canvas id="gameCanvas"></canvas>

    <div id="topBar">

        <div class="gameTitle">
            ⚡ GUERRA BEYBLADE
        </div>

        <button class="pauseButton" onclick="togglePause()">
            ⏸ PAUSA
        </button>

    </div>

    <div id="touchControls">

        <div id="joystick">
            <div id="stick"></div>
        </div>

        <button id="attackButton">
            ⚡ ATAQUE
        </button>

    </div>


    <div id="pauseOverlay">

        <div class="overlayBox">

            <h2>⏸ PAUSA</h2>

            <button
                class="menuButton"
                onclick="togglePause()"
            >
                ▶ CONTINUAR
            </button>

            <button
                class="menuButton secondary"
                onclick="returnToMenuFromGame()"
            >
                🚪 SALIR
            </button>

        </div>

    </div>


    <div id="resultOverlay">

        <div class="overlayBox">

            <h2>🏆 FIN DE BATALLA</h2>

            <div id="winnerText" class="winner">
                Ganador
            </div>

            <button
                id="playAgainButton"
                class="menuButton"
                onclick="playAgain()"
            >
                🔄 VOLVER A JUGAR
            </button>

            <button
                class="menuButton secondary"
                onclick="leaveRoom()"
            >
                🚪 SALIR DE LA SALA
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

let peer = null;
let hostConnection = null;

let isHost = false;
let onlineMode = false;

let roomCode = "";
let myId = 0;
let myName = "";

let players = [];
let guestConnections = [];

let gameRunning = false;
let gamePaused = false;

let lastStateSend = 0;
let lastInputSend = 0;


/* =========================================================
   PANTALLAS
========================================================= */

function showScreen(id){

    document.querySelectorAll(".screen").forEach(s=>{
        s.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");

    if(id === "gameScreen"){
        setTimeout(resizeCanvas,50);
    }
}


function backToMenu(){

    cleanupNetwork();

    showScreen("menuScreen");
}


function openOnline(){

    showScreen("onlineScreen");

    document.getElementById("connectionStatus").textContent =
        "Escribe tu nombre para comenzar.";
}


function showInstructions(){

    alert(
`🎮 GUERRA BEYBLADE

JUGAR SOLO:
• Mueves tu trompo.
• Los otros trompos son CPU.
• Derriba a todos.

JUGAR ONLINE:
• Crea una sala.
• Comparte el código de 4 números.
• Pueden entrar hasta 4 jugadores.
• Cada jugador controla SU PROPIO trompo.

PC:
WASD o flechas = mover
ESPACIO = atacar

CELULAR:
Joystick = mover
Botón ATAQUE = atacar`
    );
}


/* =========================================================
   CANVAS
========================================================= */

function resizeCanvas(){

    const dpr = Math.min(window.devicePixelRatio || 1,2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.floor(W*dpr);
    canvas.height = Math.floor(H*dpr);

    canvas.style.width = W+"px";
    canvas.style.height = H+"px";

    ctx.setTransform(dpr,0,0,dpr,0,0);
}


window.addEventListener("resize",resizeCanvas);

if(window.visualViewport){
    window.visualViewport.addEventListener("resize",resizeCanvas);
}

resizeCanvas();


/* =========================================================
   UTILIDADES
========================================================= */

function onlyNumbers(input){

    input.value = input.value
        .replace(/\D/g,"")
        .slice(0,4);
}


function makeRoomCode(){

    return String(
        Math.floor(1000 + Math.random()*9000)
    );
}


function randomColor(i){

    const colors = [
        "#28bfff",
        "#1677ff",
        "#55e8ff",
        "#704cff"
    ];

    return colors[i % colors.length];
}


function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );
}


/* =========================================================
   JUGADORES
========================================================= */

function createPlayer(id,name,x,y,isCPU=false){

    return {
        id:id,
        name:name || "Jugador",
        x:x,
        y:y,

        vx:0,
        vy:0,

        radius:25,

        hp:100,
        maxHp:100,

        color:randomColor(id),

        angle:Math.random()*Math.PI*2,

        input:{
            x:0,
            y:0,
            attack:false
        },

        attackTimer:0,
        hitCooldown:0,

        cpu:isCPU,
        alive:true
    };
}


function getFreePlayerId(){

    for(let i=1;i<=3;i++){

        if(!players.some(p=>p.id===i)){
            return i;
        }
    }

    return null;
}


/* =========================================================
   SOLO
========================================================= */

function startSolo(){

    onlineMode = false;
    isHost = true;

    players = [];

    const positions = [
        [W/2, H-150],
        [W/2, 150],
        [150, H/2],
        [W-150, H/2]
    ];

    players.push(
        createPlayer(
            0,
            "TÚ",
            positions[0][0],
            positions[0][1],
            false
        )
    );

    players.push(
        createPlayer(
            1,
            "CPU 1",
            positions[1][0],
            positions[1][1],
            true
        )
    );

    players.push(
        createPlayer(
            2,
            "CPU 2",
            positions[2][0],
            positions[2][1],
            true
        )
    );

    players.push(
        createPlayer(
            3,
            "CPU 3",
            positions[3][0],
            positions[3][1],
            true
        )
    );

    myId = 0;

    startGame();
}


/* =========================================================
   ONLINE - CREAR SALA
========================================================= */

function createRoom(){

    myName =
        document.getElementById("playerName")
        .value.trim()
        .slice(0,12);

    if(!myName){
        myName = "Jugador 1";
    }

    onlineMode = true;
    isHost = true;

    roomCode = makeRoomCode();

    document.getElementById("connectionStatus").textContent =
        "Creando sala...";

    createHostPeer();
}


function createHostPeer(){

    if(peer){

        try{
            peer.destroy();
        }catch(e){}

        peer = null;
    }

    const internalId = "beyblade" + roomCode;

    peer = new Peer(
        internalId,
        {
            debug:0
        }
    );


    peer.on("open",()=>{

        myId = 0;

        players = [
            createPlayer(
                0,
                myName,
                W/2,
                H-150,
                false
            )
        ];

        guestConnections = [];

        document.getElementById("roomDisplay")
            .textContent = roomCode;

        document.getElementById("hostText")
            .textContent =
            "👑 Tú eres el anfitrión. Comparte este código.";

        document.getElementById("lobbyStatus")
            .textContent =
            "Esperando jugadores...";

        updateLobby();

        showScreen("lobbyScreen");

    });


    peer.on("connection",(conn)=>{

        setupHostConnection(conn);

    });


    peer.on("error",(err)=>{

        console.log("Peer error:",err);

        if(err.type === "unavailable-id"){

            roomCode = makeRoomCode();

            createHostPeer();

        }else{

            document.getElementById("connectionStatus")
                .textContent =
                "Error de conexión. Intenta nuevamente.";
        }

    });

}


/* =========================================================
   HOST - CONEXIÓN DE JUGADOR
========================================================= */

function setupHostConnection(conn){

    const id = getFreePlayerId();

    if(id === null){

        conn.on("open",()=>{
            conn.send({
                type:"full",
                message:"Sala llena"
            });

            setTimeout(()=>{
                try{conn.close();}catch(e){}
            },500);
        });

        return;
    }


    conn.playerId = id;

    guestConnections.push(conn);


    conn.on("open",()=>{

        conn.send({
            type:"welcome",
            playerId:id,
            roomCode:roomCode,
            players:getLobbyData()
        });

    });


    conn.on("data",(data)=>{

        if(!data) return;


        /* ----------- UNIRSE ----------- */

        if(data.type === "join"){

            const existing =
                players.find(p=>p.id===id);

            if(!existing){

                players.push(
                    createPlayer(
                        id,
                        data.name || ("Jugador "+(id+1)),
                        120 + id*130,
                        H/2,
                        false
                    )
                );

            }else{

                existing.name =
                    data.name || existing.name;

            }

            broadcastLobby();

            return;
        }


        /* ----------- CONTROL ----------- */

        if(data.type === "input"){

            const p =
                players.find(p=>p.id===id);

            if(!p || !p.alive) return;

            let x = Number(data.x) || 0;
            let y = Number(data.y) || 0;

            const len = Math.hypot(x,y);

            if(len > 1){

                x /= len;
                y /= len;
            }

            p.input.x = x;
            p.input.y = y;

            if(data.attack){
                p.input.attack = true;
            }

            return;
        }


        /* ----------- VOLVER A JUGAR ----------- */

        if(data.type === "guestReady"){

            if(gameRunning){
                return;
            }

            resetOnlineLobby();

            return;
        }

    });


    conn.on("close",()=>{

        const index =
            guestConnections.indexOf(conn);

        if(index !== -1){
            guestConnections.splice(index,1);
        }

        players =
            players.filter(p=>p.id!==id);

        if(!gameRunning){
            broadcastLobby();
        }

    });


    conn.on("error",()=>{});

}


/* =========================================================
   ENTRAR A SALA
========================================================= */

function joinRoom(){

    myName =
        document.getElementById("playerName")
        .value.trim()
        .slice(0,12);

    roomCode =
        document.getElementById("roomInput")
        .value.trim();


    if(!myName){
        myName = "Jugador";
    }


    if(!/^\d{4}$/.test(roomCode)){

        alert("El código debe tener exactamente 4 números.");

        return;
    }


    onlineMode = true;
    isHost = false;


    document.getElementById("connectionStatus")
        .textContent =
        "Conectando a la sala "+roomCode+"...";


    peer = new Peer();


    peer.on("open",()=>{

        hostConnection =
            peer.connect(
                "beyblade"+roomCode,
                {
                    reliable:true
                }
            );


        setupGuestConnection();

    });


    peer.on("error",(err)=>{

        console.log(err);

        document.getElementById("connectionStatus")
            .textContent =
            "No se pudo conectar a la sala.";

    });

}


/* =========================================================
   GUEST CONNECTION
========================================================= */

function setupGuestConnection(){

    hostConnection.on("open",()=>{

        document.getElementById("connectionStatus")
            .textContent =
            "¡Conectado! Entrando a la sala...";

    });


    hostConnection.on("data",(data)=>{

        if(!data) return;


        /* ----------- BIENVENIDA ----------- */

        if(data.type === "welcome"){

            myId = data.playerId;

            players = data.players || [];

            hostConnection.send({
                type:"join",
                name:myName
            });

            document.getElementById("roomDisplay")
                .textContent = roomCode;

            document.getElementById("hostText")
                .textContent =
                "Estás dentro de la sala.";

            updateLobby();

            showScreen("lobbyScreen");

            return;
        }


        /* ----------- LOBBY ----------- */

        if(data.type === "lobby"){

            players = data.players || [];

            updateLobby();

            return;
        }


        /* ----------- COMENZAR ----------- */

        if(data.type === "startGame"){

            myId = data.myId;

            players = clonePlayers(data.players);

            startGame();

            return;
        }


        /* ----------- ESTADO ----------- */

        if(data.type === "state"){

            if(!gameRunning) return;

            applyNetworkState(data.players);

            return;
        }


        /* ----------- PAUSA ----------- */

        if(data.type === "pause"){

            gamePaused = data.value;

            document.getElementById("pauseOverlay")
                .style.display =
                gamePaused ? "flex" : "none";

            return;
        }


        /* ----------- GANADOR ----------- */

        if(data.type === "winner"){

            gameRunning = false;

            players = clonePlayers(data.players);

            showResult(data.name);

            return;
        }


        /* ----------- VOLVER AL LOBBY ----------- */

        if(data.type === "backLobby"){

            gameRunning = false;
            gamePaused = false;

            players = data.players || [];

            updateLobby();

            showScreen("lobbyScreen");

            return;
        }


        /* ----------- SALA CERRADA ----------- */

        if(data.type === "roomClosed"){

            alert("El anfitrión cerró la sala.");

            cleanupNetwork();

            showScreen("onlineScreen");

        }

    });


    hostConnection.on("close",()=>{

        if(onlineMode && !isHost){

            gameRunning = false;

            alert("El anfitrión salió de la sala.");

            cleanupNetwork();

            showScreen("onlineScreen");
        }

    });


    hostConnection.on("error",(err)=>{

        console.log(err);

        document.getElementById("connectionStatus")
            .textContent =
            "Error al conectarse.";

    });

}


/* =========================================================
   CLONAR JUGADORES
========================================================= */

function clonePlayers(list){

    return (list || []).map(p=>({

        id:p.id,
        name:p.name,
        x:p.x,
        y:p.y,

        vx:p.vx || 0,
        vy:p.vy || 0,

        radius:p.radius || 25,

        hp:p.hp ?? 100,
        maxHp:p.maxHp || 100,

        color:p.color || randomColor(p.id),

        angle:p.angle || 0,

        input:{
            x:0,
            y:0,
            attack:false
        },

        attackTimer:p.attackTimer || 0,
        hitCooldown:p.hitCooldown || 0,

        cpu:!!p.cpu,
        alive:p.alive !== false

    }));

}


/* =========================================================
   LOBBY
========================================================= */

function getLobbyData(){

    return players.map(p=>({
        id:p.id,
        name:p.name
    }));


}


function broadcastLobby(){

    const data = {
        type:"lobby",
        players:getLobbyData()
    };


    guestConnections.forEach(conn=>{

        if(conn.open){

            try{
                conn.send(data);
            }catch(e){}

        }

    });

}


function updateLobby(){

        document.getElementById("playersList");

            document.createElement("div");

    }

}

/* =========================================================
   INICIAR JUEGO
========================================================= */

function startGame(){

    gamePaused = false;

    document.getElementById("pauseOverlay")
        .style.display = "none";

    document.getElementById("resultOverlay")
        .style.display = "none";

}


/* =========================================================
   TECLADO
========================================================= */

const keys = {};


window.addEventListener("keydown",(e)=>{

    keys[e.key.toLowerCase()] = true;

    if(
        e.key === "ArrowUp" ||
        e.key === "ArrowDown" ||
        e.key === "ArrowLeft" ||
        e.key === "ArrowRight" ||
        e.code === "Space"
    ){

        e.preventDefault();

    }

});


window.addEventListener("keyup",(e)=>{

    keys[e.key.toLowerCase()] = false;

});


function getKeyboardInput(){

    let x = 0;
    let y = 0;


    if(
        keys["a"] ||
        keys["arrowleft"]
    ){
        x--;
    }


    if(
        keys["d"] ||
        keys["arrowright"]
    ){
        x++;
    }


    if(
        keys["w"] ||
        keys["arrowup"]
    ){
        y--;
    }


    if(
        keys["s"] ||
        keys["arrowdown"]
    ){
        y++;
    }


    const len = Math.hypot(x,y);

    if(len>0){

        x/=len;
        y/=len;

    }


    return {
        x:x,
        y:y,
        attack:!!keys[" "]
    };

}


/* =========================================================
   JOYSTICK
========================================================= */

const joystick =
    document.getElementById("joystick");

const stick =
    document.getElementById("stick");

const attackButton =
    document.getElementById("attackButton");


let joyX = 0;
let joyY = 0;
let joystickActive = false;


function updateJoystick(clientX,clientY){

    const rect =
        joystick.getBoundingClientRect();

    const centerX =
        rect.left + rect.width/2;

    const centerY =
        rect.top + rect.height/2;

    let dx =
        clientX-centerX;

    let dy =
        clientY-centerY;

    const max =
        rect.width/2-31;

    const len =
        Math.hypot(dx,dy);

    if(len > max){

        dx =
            dx/len*max;

        dy =
            dy/len*max;

    }


    joyX = dx/max;
    joyY = dy/max;


    stick.style.left =
        "calc(50% + "+dx+"px)";

    stick.style.top =
        "calc(50% + "+dy+"px)";

}


function resetJoystick(){

    joystickActive = false;

    joyX = 0;
    joyY = 0;

    stick.style.left = "50%";
    stick.style.top = "50%";

}


joystick.addEventListener("pointerdown",(e)=>{

    joystickActive = true;

    joystick.setPointerCapture(e.pointerId);

    updateJoystick(e.clientX,e.clientY);

});


joystick.addEventListener("pointermove",(e)=>{

    if(!joystickActive) return;

    updateJoystick(e.clientX,e.clientY);

});


joystick.addEventListener("pointerup",resetJoystick);
joystick.addEventListener("pointercancel",resetJoystick);


let touchAttack = false;


attackButton.addEventListener("pointerdown",(e)=>{

    e.preventDefault();

    touchAttack = true;

});


attackButton.addEventListener("pointerup",(e)=>{

    e.preventDefault();

    touchAttack = false;

});


attackButton.addEventListener("pointercancel",()=>{

    touchAttack = false;

});


/* =========================================================
   CONTROL DEL JUGADOR
========================================================= */

function getLocalInput(){

    const keyboard =
        getKeyboardInput();

    let x = keyboard.x;
    let y = keyboard.y;


    if(
        Math.abs(joyX)>0.05 ||
        Math.abs(joyY)>0.05
    ){

        x = joyX;
        y = joyY;

    }


    return {
        x:x,
        y:y,
        attack:
            keyboard.attack ||
            touchAttack
    };

}


/* =========================================================
   UPDATE PRINCIPAL
========================================================= */

let lastTime = performance.now();


function gameLoop(now){

    const dt =
        Math.min((now-lastTime)/16.67,2);

    lastTime = now;


    if(gameRunning && !gamePaused){

        if(isHost){

            updateHostGame(dt);

        }else{

            updateGuestGame();

        }

    }


    draw();

    requestAnimationFrame(gameLoop);

}


requestAnimationFrame(gameLoop);


/* =========================================================
   UPDATE HOST
========================================================= */

function updateHostGame(dt){

    const human =
        players.find(p=>p.id===myId);


    /* -------------------------
       CONTROL HUMANO
    ------------------------- */

    if(human && !human.cpu && human.alive){

        const input =
            getLocalInput();

        human.input.x = input.x;
        human.input.y = input.y;

        if(input.attack){

            human.input.attack = true;

        }

    }


    /* -------------------------
       CPU
    ------------------------- */

    players.forEach(p=>{

        if(!p.cpu || !p.alive) return;

        updateCPU(p,dt);

    });


    /* -------------------------
       MOVIMIENTO
    ------------------------- */

    players.forEach(p=>{

        if(!p.alive) return;

        updatePlayerMovement(p,dt);

        updateCombat(p);

    });


    /* -------------------------
       ESTADO
    ------------------------- */

    const now =
        performance.now();


    if(
        onlineMode &&
        now-lastStateSend > 50
    ){

        broadcastState();

        lastStateSend = now;

    }


    checkWinner();

}


/* =========================================================
   UPDATE GUEST
========================================================= */

function updateGuestGame(){

    const p =
        players.find(p=>p.id===myId);


    if(!p || !p.alive) return;


    const input =
        getLocalInput();


    const now =
        performance.now();


    if(
        hostConnection &&
        hostConnection.open &&
        now-lastInputSend > 35
    ){

        hostConnection.send({

            type:"input",

            x:input.x,
            y:input.y,

            attack:input.attack

        });


        lastInputSend = now;

    }


    /* No movemos localmente.
       El host manda la posición real.
       Así los 4 jugadores permanecen sincronizados. */

}


/* =========================================================
   MOVIMIENTO
========================================================= */

function updatePlayerMovement(p,dt){

    let dx =
        Number(p.input.x)||0;

    let dy =
        Number(p.input.y)||0;


    const len =
        Math.hypot(dx,dy);


    if(len>1){

        dx/=len;
        dy/=len;

    }


    p.vx += dx*0.85*dt;
    p.vy += dy*0.85*dt;


    p.vx *= Math.pow(.91,dt);
    p.vy *= Math.pow(.91,dt);


    const speed =
        Math.hypot(p.vx,p.vy);


    if(speed>6){

        p.vx =
            p.vx/speed*6;

        p.vy =
            p.vy/speed*6;

    }


    p.x += p.vx*dt;
    p.y += p.vy*dt;


    const margin = 50;


    if(p.x<margin){

        p.x=margin;
        p.vx*=-.5;

    }


    if(p.x>W-margin){

        p.x=W-margin;
        p.vx*=-.5;

    }


    if(p.y<margin){

        p.y=margin;
        p.vy*=-.5;

    }


    if(p.y>H-margin){

        p.y=H-margin;
        p.vy*=-.5;

    }


    p.angle +=
        Math.hypot(p.vx,p.vy)*.08*dt;


    if(p.attackTimer>0){

        p.attackTimer -= dt;

    }


    if(p.hitCooldown>0){

        p.hitCooldown -= dt;

    }

}


/* =========================================================
   CPU
========================================================= */

function updateCPU(p,dt){

    const targets =
        players.filter(
            x=>x.alive && x.id!==p.id
        );


    if(!targets.length) return;


    let target =
        targets[0];

    let best =
        Infinity;


    targets.forEach(t=>{

        const d =
            distance(p,t);

        if(d<best){

            best=d;
            target=t;

        }

    });


    const dx =
        target.x-p.x;

    const dy =
        target.y-p.y;

    const d =
        Math.hypot(dx,dy)||1;


    const nx =
        dx/d;

    const ny =
        dy/d;


    if(d>85){

        p.input.x=nx;
        p.input.y=ny;

    }else{

        p.input.x=-ny;
        p.input.y=nx;

        if(Math.random()<.08){

            p.input.attack=true;

        }

    }

}


/* =========================================================
   COMBATE
========================================================= */

function updateCombat(p){

    if(!p.alive) return;


    if(p.input.attack && p.attackTimer<=0){

        p.attackTimer=25;

        p.input.attack=false;


        players.forEach(enemy=>{

            if(
                enemy.id===p.id ||
                !enemy.alive
            ) return;


            const d =
                distance(p,enemy);


            if(d<75){

                const damage =
                    8 + Math.random()*7;


                enemy.hp -= damage;


                const dx =
                    enemy.x-p.x;

                const dy =
                    enemy.y-p.y;

                const len =
                    Math.hypot(dx,dy)||1;


                enemy.vx +=
                    dx/len*3.5;

                enemy.vy +=
                    dy/len*3.5;

            }

        });

    }


    if(p.hp<=0){

        p.hp=0;
        p.alive=false;
        p.vx=0;
        p.vy=0;

    }

}


/* =========================================================
   GANADOR
========================================================= */

function checkWinner(){

    const alive =
        players.filter(p=>p.alive);


    if(alive.length<=1){

        const winner =
            alive[0] || null;


        gameRunning=false;


        if(onlineMode){

            const name =
                winner ? winner.name : "Nadie";


            guestConnections.forEach(conn=>{

                if(conn.open){

                    conn.send({

                        type:"winner",

                        name:name,

                        players:players

                    });

                }

            });


            showResult(name);

        }else{

            showResult(
                winner ? winner.name : "Nadie"
            );

        }

    }

}


/* =========================================================
   ESTADO ONLINE
========================================================= */

function broadcastState(){

    const state = {

        type:"state",

        players:players.map(p=>({

            id:p.id,

            name:p.name,

            x:p.x,
            y:p.y,

            vx:p.vx,
            vy:p.vy,

            radius:p.radius,

            hp:p.hp,
            maxHp:p.maxHp,

            color:p.color,

            angle:p.angle,

            attackTimer:p.attackTimer,

            alive:p.alive

        }))

    };


    guestConnections.forEach(conn=>{

        if(conn.open){

            try{

                conn.send(state);

            }catch(e){}

        }

    });

}


/* =========================================================
   RECIBIR ESTADO
========================================================= */

function applyNetworkState(list){

    if(!Array.isArray(list)) return;


    list.forEach(net=>{

        let p =
            players.find(x=>x.id===net.id);


        if(!p){

            p =
                createPlayer(
                    net.id,
                    net.name,
                    net.x,
                    net.y,
                    false
                );

            players.push(p);

        }


        p.name=net.name;

        p.x=net.x;
        p.y=net.y;

        p.vx=net.vx;
        p.vy=net.vy;

        p.hp=net.hp;
        p.maxHp=net.maxHp;

        p.color=net.color;

        p.angle=net.angle;

        p.attackTimer=net.attackTimer;

        p.alive=net.alive;

    });


    players =
        players.filter(
            p=>list.some(n=>n.id===p.id)
        );

}


/* =========================================================
   DIBUJAR
========================================================= */

function draw(){

    ctx.clearRect(0,0,W,H);


    if(
        !document.getElementById("gameScreen")
        .classList.contains("active")
    ){

        return;

    }


    drawArena();


    players.forEach(p=>{

        if(p.alive){

            drawPlayer(p);

        }

    });

}


/* =========================================================
   ARENA
========================================================= */

function drawArena(){

    const gradient =
        ctx.createRadialGradient(
            W/2,H/2,50,
            W/2,H/2,
            Math.max(W,H)
        );


    gradient.addColorStop(
        0,
        "#103e87"
    );

    gradient.addColorStop(
        .55,
        "#061c4d"
    );

    gradient.addColorStop(
        1,
        "#020918"
    );


    ctx.fillStyle=gradient;

    ctx.fillRect(0,0,W,H);


    /* círculos de la arena */

    ctx.save();

    ctx.translate(W/2,H/2);

    const radius =
        Math.min(W,H)*.42;


    for(let i=5;i>=1;i--){

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            radius*i/5,
            0,
            Math.PI*2
        );

        ctx.strokeStyle =
            `rgba(80,190,255,${.08+i*.015})`;

        ctx.lineWidth=2;

        ctx.stroke();

    }


    ctx.restore();


    /* estrellas */

    for(let i=0;i<45;i++){

        const x =
            (i*137)%W;

        const y =
            (i*71)%H;

        ctx.fillStyle =
            "rgba(100,210,255,.25)";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            1.5,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


/* =========================================================
   DIBUJAR TROMPO
========================================================= */

function drawPlayer(p){

    ctx.save();

    ctx.translate(p.x,p.y);


    /* sombra */

    ctx.beginPath();

    ctx.ellipse(
        4,
        8,
        p.radius*1.1,
        p.radius*.45,
        0,
        0,
        Math.PI*2
    );

    ctx.fillStyle="rgba(0,0,0,.4)";
    ctx.fill();


    /* ataque */

    if(p.attackTimer>0){

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            70,
            p.angle,
            p.angle+Math.PI*1.4
        );

        ctx.strokeStyle="#9aeaff";
        ctx.lineWidth=8;
        ctx.shadowBlur=20;
        ctx.shadowColor="#00aaff";
        ctx.stroke();

    }


    /* trompo exterior */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        p.radius,
        0,
        Math.PI*2
    );

    ctx.fillStyle=p.color;

    ctx.shadowBlur=18;
    ctx.shadowColor=p.color;

    ctx.fill();


    /* borde */

    ctx.strokeStyle="#c8f6ff";
    ctx.lineWidth=3;

    ctx.stroke();


    /* diseño giratorio */

    ctx.rotate(p.angle);


    for(let i=0;i<6;i++){

        ctx.rotate(Math.PI/3);

        ctx.beginPath();

        ctx.moveTo(0,-4);
        ctx.lineTo(17,-10);
        ctx.lineTo(9,0);
        ctx.lineTo(17,10);
        ctx.closePath();

        ctx.fillStyle=
            i%2===0
            ? "#e9fbff"
            : "#062d79";

        ctx.fill();

    }


    /* centro */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        8,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#fff";
    ctx.fill();

    ctx.restore();


    /* nombre */

    ctx.font="bold 14px Arial";

    ctx.textAlign="center";

    ctx.fillStyle="#fff";

    ctx.shadowBlur=4;
    ctx.shadowColor="#000";

    ctx.fillText(
        p.name,
        p.x,
        p.y-p.radius-28
    );


    /* barra de vida */

    const barW=60;
    const barH=7;

    const hpPercent =
        Math.max(0,p.hp/p.maxHp);


    ctx.fillStyle="rgba(0,0,0,.7)";

    ctx.fillRect(
        p.x-barW/2,
        p.y-p.radius-18,
        barW,
        barH
    );


    ctx.fillStyle =
        hpPercent>.5
        ? "#37e8ff"
        : hpPercent>.25
        ? "#ffc43d"
        : "#ff4f75";


    ctx.fillRect(
        p.x-barW/2,
        p.y-p.radius-18,
        barW*hpPercent,
        barH
    );

}


/* =========================================================
   PAUSA
========================================================= */

function togglePause(){

    if(!gameRunning) return;


    if(onlineMode){

        if(!isHost) return;

        gamePaused=!gamePaused;

        document.getElementById("pauseOverlay")
            .style.display =
            gamePaused ? "flex" : "none";


        guestConnections.forEach(conn=>{

            if(conn.open){

                });

            }

        });

    }else{

        gamePaused=!gamePaused;

        document.getElementById("pauseOverlay")
            .style.display =
            gamePaused ? "flex" : "none";

    }

}

   RESULTADO

/* =========================================================
   VOLVER A JUGAR
========================================================= */

function playAgain(){

    document.getElementById("resultOverlay")
        .style.display="none";


    if(!onlineMode){

        startSolo();

        return;

    }


    if(isHost){

        resetOnlineLobby();

    }else{

        if(
            hostConnection &&
            hostConnection.open
        ){

            hostConnection.send({
                type:"guestReady"
            });

        }

        showScreen("lobbyScreen");

        document.getElementById("lobbyStatus")
            .textContent =
            "Esperando al anfitrión...";

    }

}


/* =========================================================
   REINICIAR SALA ONLINE
========================================================= */

function resetOnlineLobby(){

    gameRunning=false;
    gamePaused=false;


    players =
        players.map(p=>{

            return createPlayer(
                p.id,
                p.name,
                W/2,
                H/2,
                false
            );

        });


    /* posiciones */

    const positions = [

        [W/2,H-150],

        [W/2,150],

        [150,H/2],

        [W-150,H/2]

    ];


    players.forEach((p,i)=>{

        p.x =
            positions[i][0];

        p.y =
            positions[i][1];

    });


    broadcastLobby();

    showScreen("lobbyScreen");

}


/* =========================================================
   SALIR DE SALA
========================================================= */

function leaveRoom(){

    if(isHost){

        guestConnections.forEach(conn=>{

            if(conn.open){

                try{

                    conn.send({
                        type:"roomClosed"
                    });

                }catch(e){}

            }

        });

    }


    cleanupNetwork();

    showScreen("onlineScreen");

}


/* =========================================================
   SALIR DESDE PARTIDA
========================================================= */

function returnToMenuFromGame(){

    if(onlineMode){

        leaveRoom();

    }else{

        gameRunning=false;

        showScreen("menuScreen");

    }

}


/* =========================================================
   LIMPIAR CONEXIONES
========================================================= */

function cleanupNetwork(){

    gameRunning=false;
    gamePaused=false;

    try{

        if(hostConnection){

            hostConnection.close();

        }

    }catch(e){}


    try{

        guestConnections.forEach(conn=>{

            try{
                conn.close();
            }catch(e){}

        });

    }catch(e){}


    try{

        if(peer){

            peer.destroy();

        }

    }catch(e){}


    peer=null;
    hostConnection=null;
    guestConnections=[];

    players=[];

    roomCode="";

    onlineMode=false;
    isHost=false;
    myId=0;

}


/* =========================================================
   EVITAR SALIR CON RECARGA
========================================================= */

window.addEventListener("beforeunload",()=>{

    if(isHost){

        guestConnections.forEach(conn=>{

            if(conn.open){

                try{
                    conn.send({
                        type:"roomClosed"
                    });
                }catch(e){}

            }

        });

    }

});


/* =========================================================
   INICIAR
========================================================= */

resizeCanvas();
