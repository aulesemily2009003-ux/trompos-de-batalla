<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GUERRA BEYBLADE</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#050817;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
}

/* =========================
   PANTALLAS
========================= */

.screen{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(55,100,255,.20),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #030510,
            #10152d,
            #04050b
        );

    z-index:20;
}

.panel{
    width:min(92%,520px);
    padding:32px;
    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(25,32,65,.96),
            rgba(5,8,22,.97)
        );

    border:2px solid rgba(120,180,255,.55);

    box-shadow:
        0 0 25px rgba(45,120,255,.3),
        0 0 70px rgba(0,0,0,.9),
        inset 0 0 25px rgba(100,150,255,.08);

    text-align:center;
}

h1{
    font-size:clamp(32px,7vw,52px);
    margin-bottom:8px;

    background:
        linear-gradient(
            90deg,
            #4de8ff,
            #ffffff,
            #ffdc45,
            #ff5b68
        );

    -webkit-background-clip:text;
    color:transparent;

    text-shadow:
        0 0 18px rgba(50,200,255,.4);
}

h2{
    color:#fff;
    margin-bottom:20px;
}

.subtitle{
    color:#b8c8ec;
    margin-bottom:18px;
    font-size:16px;
}

/* =========================
   INPUT NOMBRE
========================= */

.nameInput{
    width:100%;
    padding:15px;

    margin:5px 0 15px;

    border-radius:14px;

    border:2px solid #39598d;

    background:
        linear-gradient(
            135deg,
            #080d20,
            #111a35
        );

    color:white;

    font-size:18px;
    text-align:center;

    outline:none;

    box-shadow:
        inset 0 0 12px rgba(0,0,0,.5),
        0 0 10px rgba(60,150,255,.08);
}

.nameInput:focus{
    border-color:#55dfff;

    box-shadow:
        0 0 15px rgba(50,200,255,.3),
        inset 0 0 10px rgba(0,0,0,.5);
}

button{
    width:100%;
    padding:15px;
    margin:8px 0;

    border:none;
    border-radius:15px;

    color:white;
    font-size:18px;
    font-weight:bold;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #202a4d,
            #10162d
        );

    border:1px solid rgba(130,180,255,.35);

    box-shadow:
        0 5px 15px rgba(0,0,0,.4),
        inset 0 0 10px rgba(255,255,255,.04);

    transition:.18s;
}

button:hover{
    transform:translateY(-2px) scale(1.015);
    filter:brightness(1.2);
}

.red{
    background:
        linear-gradient(
            135deg,
            #ff394c,
            #8e1024
        );
}

.blue{
    background:
        linear-gradient(
            135deg,
            #208cff,
            #1740a5
        );
}

.green{
    background:
        linear-gradient(
            135deg,
            #16d978,
            #087a52
        );
}

.small{
    color:#8090b5;
    font-size:13px;
    margin-top:15px;
}

input{
    width:100%;
    padding:14px;
    margin:8px 0;

    border-radius:13px;

    border:1px solid #3c4d76;

    background:#070b1b;

    color:white;

    font-size:18px;
    text-align:center;
}

.code{
    font-size:28px;
    font-weight:bold;

    letter-spacing:5px;

    color:#63e8ff;

    margin:15px 0;

    text-shadow:
        0 0 15px #00cfff;
}

/* =========================
   HUD
========================= */

#hud{
    display:none;

    position:fixed;

    top:10px;
    left:10px;
    right:10px;

    z-index:10;

    pointer-events:none;
}

.hudBox{
    display:inline-block;

    padding:9px 14px;

    margin-right:5px;

    border-radius:13px;

    background:
        rgba(3,8,25,.78);

    border:
        1px solid
        rgba(120,200,255,.4);

    box-shadow:
        0 0 15px
        rgba(30,130,255,.15);

    color:white;
}

#pauseBtn{
    pointer-events:auto;

    float:right;

    width:auto;

    margin:0;

    padding:9px 16px;

    font-size:14px;
}

#playersHUD{
    margin-top:7px;
}

.playerLine{
    font-size:12px;
    margin:2px;

    text-shadow:
        0 1px 3px #000;
}

.dead{
    opacity:.35;
    text-decoration:line-through;
}

#pauseScreen,
#gameOver{
    display:none;
}
</style>
</head>

<body>

<canvas id="game"></canvas>


<!-- =====================================================
     HUD
===================================================== -->

<div id="hud">

    <div class="hudBox">
        ❤️ <span id="myLife">100</span>
    </div>

    <div class="hudBox">
        ⚔️ <span id="aliveCount">0</span>/4
    </div>

    <button
        id="pauseBtn"
        onclick="togglePause()">

        ⏸ PAUSA

    </button>

    <div id="playersHUD"></div>

</div>


<!-- =====================================================
     MENÚ PRINCIPAL
===================================================== -->

<div class="screen" id="menu">

    <div class="panel">

        <h1>
            ⚡ GUERRA BEYBLADE ⚡
        </h1>

        <div class="subtitle">
            🔥 ¡LA ARENA DE LOS TROMPOS! 🔥
        </div>


        <!-- NOMBRE -->

        <input
            class="nameInput"
            id="playerNameInput"
            type="text"
            maxlength="15"
            placeholder="✏️ Escribe tu nombre"
        >


        <button
            class="red"
            onclick="startSolo()">

            🎮 JUGAR SOLO

        </button>


        <button
            class="blue"
            onclick="openOnline(false)">

            🌐 ONLINE

        </button>


        <div class="small">
            ⚔️ Hasta 4 trompos por batalla
        </div>

    </div>

</div>


<!-- =====================================================
     ONLINE
===================================================== -->

<div
    class="screen"
    id="onlineScreen"
    style="display:none;">

    <div class="panel">

        <h2 id="onlineTitle">
            🌐 ONLINE
        </h2>


        <button
            class="green"
            onclick="createRoom()">

            ➕ CREAR SALA

        </button>


        <div
            style="
            margin:12px;
            color:#8190b8;">

            ───── O ─────

        </div>


        <input
            id="roomInput"
            placeholder="Código de sala"
        >


        <button
            class="blue"
            onclick="joinRoom()">

            🚪 UNIRSE

        </button>


        <div id="roomInfo"></div>

        <div id="message"></div>


        <button
            onclick="backToMenu()">

            ↩ VOLVER

        </button>

    </div>

</div>


<!-- =====================================================
     LOBBY
===================================================== -->

<div
    class="screen"
    id="lobbyScreen"
    style="display:none;">

    <div class="panel">

        <h2>
            ⚔️ SALA DE BATALLA
        </h2>


        <div>
            Comparte este código:
        </div>


        <div
            class="code"
            id="myRoomCode">

            ---

        </div>


        <div
            id="lobbyPlayers"
            style="margin:20px 0;">

        </div>


        <button
            class="red"
            id="startOnlineBtn"
            onclick="startOnlineBattle()">

            ▶ JUGAR

        </button>


        <button
            onclick="backToMenu()">

            ↩ SALIR

        </button>


        <div class="small">
            👥 Máximo 4 jugadores
        </div>

    </div>

</div>


<!-- =====================================================
     PAUSA
===================================================== -->

<div
    class="screen"
    id="pauseScreen">

    <div class="panel">

        <h2>
            ⏸ JUEGO PAUSADO
        </h2>


        <button
            class="green"
            onclick="togglePause()">

            ▶ CONTINUAR

        </button>


        <button
            onclick="backToMenu()">

            🏠 MENÚ PRINCIPAL

        </button>

    </div>

</div>


<!-- =====================================================
     GAME OVER
===================================================== -->

<div
    class="screen"
    id="gameOver">

    <div class="panel">

        <h1>
            🏆
        </h1>


        <h2 id="winnerText">
            GANADOR
        </h2>


        <button
            class="red"
            onclick="restartCurrentMode()">

            🔄 VOLVER A JUGAR

        </button>


        <button
            onclick="backToMenu()">

            🏠 MENÚ

        </button>

    </div>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W=0;
let H=0;


function resize(){

    W =
        canvas.width =
        window.innerWidth;

    H =
        canvas.height =
        window.innerHeight;
}


window.addEventListener(
    "resize",
    resize
);

resize();


/* =====================================================
   VARIABLES
===================================================== */

const MAX_PLAYERS=4;

let gameMode="solo";

let gameRunning=false;

let paused=false;

let localPlayerIndex=0;


let state={

    players:[],

    running:false,

    winner:null,

    tick:0

};


let peer=null;

let isHost=false;

let hostConnection=null;

let connections=[];

let roomCode="";


const keys={};

let particles=[];


/* =====================================================
   PARTÍCULAS
===================================================== */

function createParticle(
    x,
    y,
    type="spark"
){

    particles.push({

        x:x,

        y:y,

        vx:
            (Math.random()-.5)*5,

        vy:
            (Math.random()-.5)*5,

        life:
            25+
            Math.random()*25,

        maxLife:50,

        size:
            2+
            Math.random()*4,

        type:type

    });
}


function updateParticles(){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p=particles[i];

        p.x+=p.vx;

        p.y+=p.vy;

        p.vx*=.96;

        p.vy*=.96;

        p.life--;

        if(p.life<=0){

            particles.splice(i,1);

        }
    }
}


function drawParticles(){

    particles.forEach(p=>{

        const alpha=
            p.life/p.maxLife;

        ctx.globalAlpha=alpha;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fillStyle=
            p.type==="hit"
            ? "#ffdf3d"
            : "#68eaff";

        ctx.fill();

    });

    ctx.globalAlpha=1;
}


/* =====================================================
   UTILIDADES
===================================================== */

function random(min,max){

    return Math.random()*
        (max-min)+min;
}


function distance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );
}


function clamp(
    v,
    min,
    max
){

    return Math.max(
        min,
        Math.min(max,v)
    );
}


/* =====================================================
   NOMBRES
===================================================== */

const names=[

    "DRAGÓN",
    "FÉNIX",
    "TITÁN",
    "SOMBRA"

];


const symbols=[

    "🐉",
    "🔥",
    "⚡",
    "🌑"

];


/* =====================================================
   CREAR JUGADOR
===================================================== */

function createPlayer(
    index,
    cpu=false
){

    return{

        id:index,

        name:
            names[index],

        symbol:
            symbols[index],

        x:
            random(
                100,
                W-100
            ),

        y:
            random(
                100,
                H-100
            ),

        vx:0,

        vy:0,

        radius:29,

        life:100,

        maxLife:100,

        cpu:cpu,

        alive:true,

        attack:false,

        attackTimer:0,

        cooldown:0,

        hitCooldown:0,

        target:null,

        angle:
            random(
                0,
                Math.PI*2
            ),

        input:{

            up:false,
            down:false,
            left:false,
            right:false,
            attack:false

        }

    };
}


/* =====================================================
   PANTALLAS
===================================================== */

function hideAllScreens(){

    document
        .querySelectorAll(".screen")
        .forEach(
            s=>{
                s.style.display="none";
            }
        );
}


function backToMenu(){

    gameRunning=false;

    paused=false;


    if(peer){

        try{

            peer.destroy();

        }catch(e){}

    }


    peer=null;

    connections=[];

    hostConnection=null;

    isHost=false;


    hideAllScreens();


    document.getElementById(
        "menu"
    ).style.display="flex";


    document.getElementById(
        "hud"
    ).style.display="none";
}


/* =====================================================
   JUGAR SOLO
===================================================== */

function startSolo(){

    gameMode="solo";


    /*
       OBTENER NOMBRE
    */

    const input=
        document.getElementById(
            "playerNameInput"
        );


    let playerName=
        input.value.trim();


    if(playerName===""){

        playerName="Jugador";

    }


    hideAllScreens();


    document.getElementById(
        "hud"
    ).style.display="block";


    state={

        players:[],

        running:true,

        winner:null,

        tick:0

    };


    /*
       1 JUGADOR
       +
       3 CPU
    */

    for(
        let i=0;
        i<MAX_PLAYERS;
        i++
    ){

        state.players.push(
            createPlayer(
                i,
                i!==0
            )
        );

    }


    /*
       NOMBRE PERSONALIZADO
    */

    state.players[0].name=
        playerName;


    /*
       SÍMBOLO DEL JUGADOR
    */

    state.players[0].symbol=
        "👑";


    localPlayerIndex=0;


    gameRunning=true;

    paused=false;

    particles=[];


    updateHUD();
}


/* =====================================================
   ONLINE
===================================================== */

function openOnline(){

    gameMode="online";


    hideAllScreens();


    document.getElementById(
        "onlineScreen"
    ).style.display="flex";


    document.getElementById(
        "onlineTitle"
    ).textContent=
        "🌐 ONLINE";


    document.getElementById(
        "message"
    ).textContent="";
}


/* =====================================================
   CREAR SALA
===================================================== */

function createRoom(){

    isHost=true;


    peer=new Peer();


    peer.on(
        "open",
        id=>{

            roomCode=id;


            document.getElementById(
                "myRoomCode"
            ).textContent=id;


            showLobby();

        }
    );


    peer.on(
        "connection",
        conn=>{

            if(
                connections.length>=3
            ){

                conn.close();

                return;
            }


            connections.push(conn);


            conn.on(
                "open",
                ()=>{

                    conn.on(
                        "data",
                        data=>{

                            handleHostData(
                                conn,
                                data
                            );

                        }
                    );


                    sendLobby();

                }
            );


            conn.on(
                "close",
                ()=>{

                    connections=
                        connections.filter(
                            c=>c!==conn
                        );


                    sendLobby();

                }
            );

        }
    );


    peer.on(
        "error",
        err=>{

            document.getElementById(
                "message"
            ).textContent=
                "Error de conexión.";

            console.error(err);

        }
    );
}


/* =====================================================
   UNIRSE
===================================================== */

function joinRoom(){

    const code=
        document.getElementById(
            "roomInput"
        ).value.trim();


    if(!code){

        document.getElementById(
            "message"
        ).textContent=
            "Escribe el código.";

        return;
    }


    isHost=false;


    peer=new Peer();


    peer.on(
        "open",
        ()=>{

            hostConnection=
                peer.connect(code);


            hostConnection.on(
                "open",
                ()=>{

                    hostConnection.send({
                        type:"join"
                    });


                    showLobby();

                }
            );


            hostConnection.on(
                "data",
                data=>{

                    handleGuestData(
                        data
                    );

                }
            );


            hostConnection.on(
                "close",
                ()=>{

                    alert(
                        "La conexión con el anfitrión terminó."
                    );


                    backToMenu();

                }
            );

        }
    );


    peer.on(
        "error",
        err=>{

            document.getElementById(
                "message"
            ).textContent=
                "No se pudo conectar.";

        }
    );
}


/* =====================================================
   LOBBY
===================================================== */

function showLobby(){

    hideAllScreens();


    document.getElementById(
        "lobbyScreen"
    ).style.display="flex";


    document.getElementById(
        "myRoomCode"
    ).textContent=
        roomCode||"SALA";


    updateLobbyUI();


    document.getElementById(
        "startOnlineBtn"
    ).style.display=
        isHost
        ? "block"
        : "none";
}


function updateLobbyUI(){

    let count=
        isHost
        ? 1+connections.length
        : 1;


    let html="";


    for(
        let i=0;
        i<count;
        i++
    ){

        html+=`

        <div style="
            padding:9px;
            margin:5px;
            border-radius:10px;

            background:
            linear-gradient(
                90deg,
                #16213d,
                #101528
            );

            border:
            1px solid #304a79;
        ">

            🎮 JUGADOR ${i+1}

        </div>

        `;

    }


    document.getElementById(
        "lobbyPlayers"
    ).innerHTML=html;
}


/* =====================================================
   LOBBY ONLINE
===================================================== */

function sendLobby(){

    if(!isHost)return;


    const count=
        Math.min(
            MAX_PLAYERS,
            1+connections.length
        );


    connections.forEach(
        conn=>{

            try{

                conn.send({

                    type:"lobby",

                    count:count

                });

            }catch(e){}

        }
    );


    updateLobbyUI();
}


/* =====================================================
   DATOS DEL HOST
===================================================== */

function handleHostData(
    conn,
    data
){

    if(
        data.type==="join"
    ){

        sendLobby();

        return;
    }


    if(
        data.type==="input"
    ){

        const index=
            connections.indexOf(
                conn
            )+1;


        if(
            index>=1 &&
            index<
            state.players.length
        ){

            state.players[index].input={

                up:
                    !!data.up,

                down:
                    !!data.down,

                left:
                    !!data.left,

                right:
                    !!data.right,

                attack:
                    !!data.attack

            };

        }
    }
}


/* =====================================================
   DATOS INVITADO
===================================================== */

function handleGuestData(data){

    if(
        data.type==="lobby"
    ){

        updateLobbyUI();

    }


    if(
        data.type==="start"
    ){

        state=data.state;

        localPlayerIndex=
            data.index;


        gameMode="online";

        gameRunning=true;

        paused=false;


        hideAllScreens();


        document.getElementById(
            "hud"
        ).style.display="block";

    }


    if(
        data.type==="state"
    ){

        state=data.state;

        updateHUD();

    }


    if(
        data.type==="gameover"
    ){

        showGameOver(
            data.winner
        );

    }
}


/* =====================================================
   COMENZAR ONLINE
===================================================== */

function startOnlineBattle(){

    if(!isHost)return;


    const humans=
        Math.min(
            MAX_PLAYERS,
            1+connections.length
        );


    state={

        players:[],

        running:true,

        winner:null,

        tick:0

    };


    /*
       JUGADORES HUMANOS
    */

    for(
        let i=0;
        i<humans;
        i++
    ){

        state.players.push(
            createPlayer(
                i,
                false
            )
        );

    }


    gameRunning=true;

    paused=false;


    hideAllScreens();


    document.getElementById(
        "hud"
    ).style.display="block";


    connections.forEach(
        (conn,index)=>{

            try{

                conn.send({

                    type:"start",

                    state:state,

                    index:index+1

                });

            }catch(e){}

        }
    );


    updateHUD();
}


/* =====================================================
   TECLADO
===================================================== */

window.addEventListener(
    "keydown",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=true;


        if(
            e.key==="Escape"
        ){

            togglePause();

        }

    }
);


window.addEventListener(
    "keyup",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=false;

    }
);


/* =====================================================
   INPUT
===================================================== */

function getInput(){

    return{

        up:
            keys["w"]||
            keys["arrowup"],

        down:
            keys["s"]||
            keys["arrowdown"],

        left:
            keys["a"]||
            keys["arrowleft"],

        right:
            keys["d"]||
            keys["arrowright"],

        attack:
            keys[" "]||
            keys["enter"]

    };
}


/* =====================================================
   HUMANO
===================================================== */

function updateHuman(p){

    if(!p.alive)return;


    let input;


    if(
        gameMode==="solo"
    ){

        input=getInput();

    }

    else{

        if(!isHost){

            if(
                p.id===
                localPlayerIndex
            ){

                input=getInput();


                if(hostConnection){

                    try{

                        hostConnection.send({

                            type:"input",

                            ...input

                        });

                    }catch(e){}

                }

            }

            return;
        }


        if(
            p.id===0
        ){

            input=getInput();

        }

        else{

            input=p.input;

        }

    }


    let dx=0;
    let dy=0;


    if(input.up)dy--;

    if(input.down)dy++;

    if(input.left)dx--;

    if(input.right)dx++;


    const len=
        Math.hypot(
            dx,
            dy
        );


    if(len){

        dx/=len;

        dy/=len;


        p.vx+=
            dx*.65;

        p.vy+=
            dy*.65;

    }


    p.vx*=.88;

    p.vy*=.88;


    const speed=
        Math.hypot(
            p.vx,
            p.vy
        );


    if(speed>5){

        p.vx=
            p.vx/speed*5;

        p.vy=
            p.vy/speed*5;

    }


    p.x+=p.vx;

    p.y+=p.vy;


    p.x=clamp(
        p.x,
        55,
        W-55
    );


    p.y=clamp(
        p.y,
        55,
        H-55
    );


    if(
        input.attack &&
        p.cooldown<=0
    ){

        p.attack=true;

        p.attackTimer=10;

        p.cooldown=25;

    }
}


/* =====================================================
   CPU
===================================================== */

function updateCPU(
    p,
    index
){

    if(!p.alive)return;


    let target=null;

    let best=Infinity;


    /*
       EL CPU PUEDE ATACAR
       A OTRO CPU
    */

    state.players.forEach(
        (other,i)=>{

            if(i===index)return;

            if(!other.alive)return;


            const d=
                distance(
                    p,
                    other
                );


            if(d<best){

                best=d;

                target=other;

            }

        }
    );


    if(!target)return;


    p.target=
        target.id;


    const dx=
        target.x-p.x;

    const dy=
        target.y-p.y;


    const d=
        Math.hypot(
            dx,
            dy
        )||1;


    const nx=dx/d;

    const ny=dy/d;


    if(d>75){

        p.vx+=
            nx*.55;

        p.vy+=
            ny*.55;

    }

    else{

        const sx=-ny;

        const sy=nx;


        p.vx+=
            sx*.42;

        p.vy+=
            sy*.42;


        if(d>62){

            p.vx+=
                nx*.25;

            p.vy+=
                ny*.25;

        }

    }


    /*
       ATAQUE
    */

    if(
        d<95 &&
        p.cooldown<=0
    ){

        p.attack=true;

        p.attackTimer=10;

        p.cooldown=22;

    }


    p.vx*=.90;

    p.vy*=.90;


    const speed=
        Math.hypot(
            p.vx,
            p.vy
        );


    if(speed>4.5){

        p.vx=
            p.vx/speed*4.5;

        p.vy=
            p.vy/speed*4.5;

    }


    p.x+=p.vx;

    p.y+=p.vy;


    p.x=clamp(
        p.x,
        55,
        W-55
    );


    p.y=clamp(
        p.y,
        55,
        H-55
    );
}


/* =====================================================
   TIMERS
===================================================== */

function updateTimers(p){

    if(p.cooldown>0)
        p.cooldown--;


    if(p.hitCooldown>0)
        p.hitCooldown--;


    if(p.attackTimer>0){

        p.attackTimer--;

        p.attack=true;

    }

    else{

        p.attack=false;

    }
}


/* =====================================================
   COLISIONES
===================================================== */

function collisions(){

    const players=
        state.players;


    for(
        let i=0;
        i<players.length;
        i++
    ){

        const a=
            players[i];


        if(!a.alive)
            continue;


        for(
            let j=i+1;
            j<players.length;
            j++
        ){

            const b=
                players[j];


            if(!b.alive)
                continue;


            const dx=
                b.x-a.x;

            const dy=
                b.y-a.y;


            const d=
                Math.hypot(
                    dx,
                    dy
                )||1;


            const minDist=
                a.radius+
                b.radius;


            if(
                d<minDist
            ){

                const nx=
                    dx/d;

                const ny=
                    dy/d;


                const overlap=
                    minDist-d;


                a.x-=
                    nx*
                    overlap*.5;

                a.y-=
                    ny*
                    overlap*.5;


                b.x+=
                    nx*
                    overlap*.5;

                b.y+=
                    ny*
                    overlap*.5;


                a.vx-=
                    nx*1.2;

                a.vy-=
                    ny*1.2;


                b.vx+=
                    nx*1.2;

                b.vy+=
                    ny*1.2;

            }


            const range=
                a.radius+
                b.radius+
                35;


            if(
                a.attack &&
                d<=range
            ){

                damagePlayer(
                    b,
                    a
                );

            }


            if(
                b.attack &&
                d<=range
            ){

                damagePlayer(
                    a,
                    b
                );

            }

        }
    }
}


/* =====================================================
   DAÑO
===================================================== */

function damagePlayer(
    target,
    attacker
){

    if(!target.alive)
        return;


    if(
        target.hitCooldown>0
    )
        return;


    target.hitCooldown=10;


    target.life-=8;


    /*
       EFECTO DE IMPACTO
    */

    for(
        let i=0;
        i<8;
        i++
    ){

        createParticle(
            target.x,
            target.y,
            "hit"
        );

    }


    const dx=
        target.x-
        attacker.x;


    const dy=
        target.y-
        attacker.y;


    const d=
        Math.hypot(
            dx,
            dy
        )||1;


    target.vx+=
        dx/d*2.5;


    target.vy+=
        dy/d*2.5;


    if(
        target.life<=0
    ){

        target.life=0;

        target.alive=false;

        target.vx=0;

        target.vy=0;

        target.attack=false;

    }
}


/* =====================================================
   ACTUALIZAR
===================================================== */

function updateGame(){

    if(!gameRunning)
        return;


    if(paused)
        return;


    /*
       ONLINE:
       solo el HOST calcula
    */

    if(
        gameMode==="online"
    ){

        if(!isHost)
            return;

    }


    state.tick++;


    state.players.forEach(
        (p,i)=>{

            updateTimers(p);


            if(!p.alive)
                return;


            if(p.cpu){

                updateCPU(
                    p,
                    i
                );

            }

            else{

                updateHuman(p);

            }

        }
    );


    collisions();


    updateParticles();


    checkWinner();


    if(
        gameMode==="online"
    ){

        broadcastState();

    }
}


/* =====================================================
   GANADOR
===================================================== */

function checkWinner(){

    const alive=
        state.players.filter(
            p=>p.alive
        );


    if(
        alive.length<=1
    ){

        state.running=false;

        gameRunning=false;


        state.winner=
            alive.length
            ? alive[0].id
            : null;


        if(
            isHost &&
            gameMode==="online"
        ){

            connections.forEach(
                conn=>{

                    try{

                        conn.send({

                            type:"gameover",

                            winner:
                                state.winner

                        });

                    }catch(e){}

                }
            );

        }


        showGameOver(
            state.winner
        );

    }
}


/* =====================================================
   BROADCAST
===================================================== */

function broadcastState(){

    if(!isHost)return;


    connections.forEach(
        conn=>{

            try{

                conn.send({

                    type:"state",

                    state:state

                });

            }catch(e){}

        }
    );
}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

    if(
        !state.players.length
    )
        return;


    const me=
        state.players[
            localPlayerIndex
        ];


    if(me){

        document.getElementById(
            "myLife"
        ).textContent=
            Math.ceil(
                me.life
            );

    }


    const alive=
        state.players.filter(
            p=>p.alive
        ).length;


    document.getElementById(
        "aliveCount"
    ).textContent=
        alive;


    let html="";


    state.players.forEach(
        p=>{

            html+=`

            <div class="playerLine
                ${p.alive?"":"dead"}">

                ${p.symbol}
                ${p.name}

                ${p.cpu?"🤖":""}

                ❤️
                ${Math.ceil(p.life)}

            </div>

            `;

        }
    );


    document.getElementById(
        "playersHUD"
    ).innerHTML=html;
}


/* =====================================================
   GAME OVER
===================================================== */

function showGameOver(
    id
){

    hideAllScreens();


    document.getElementById(
        "gameOver"
    ).style.display="flex";


    const winner=
        state.players.find(
            p=>p.id===id
        );


    document.getElementById(
        "winnerText"
    ).textContent=

        winner

        ? `${winner.symbol}
           ${winner.name}
           GANÓ`

        : "NO HAY GANADOR";
}


function restartCurrentMode(){

    if(
        gameMode==="solo"
    ){

        startSolo();

    }

    else{

        backToMenu();

        setTimeout(
            ()=>{
                openOnline();
            },
            100
        );

    }
}


/* =====================================================
   PAUSA
===================================================== */

function togglePause(){

    if(!gameRunning)
        return;


    paused=!paused;


    document.getElementById(
        "pauseScreen"
    ).style.display=
        paused
        ? "flex"
        : "none";
}


/* =====================================================
   ARENA
===================================================== */

function drawArena(){

    /*
       FONDO
    */

    const bg=
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );


    bg.addColorStop(
        0,
        "#071b32"
    );


    bg.addColorStop(
        .5,
        "#0b3a29"
    );


    bg.addColorStop(
        1,
        "#04140e"
    );


    ctx.fillStyle=bg;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       TEXTURA
    */

    for(
        let x=0;
        x<W;
        x+=18
    ){

        for(
            let y=0;
            y<H;
            y+=18
        ){

            const n=
                Math.sin(
                    x*.13+
                    y*.07
                );


            ctx.fillStyle=
                n>0
                ? "rgba(80,180,75,.035)"
                : "rgba(0,0,0,.04)";


            ctx.fillRect(
                x,
                y,
                14,
                14
            );

        }
    }


    /*
       ARENA
    */

    const cx=W/2;

    const cy=H/2;


    const radius=
        Math.min(
            W,
            H
        )*.39;


    /*
       RESPLANDOR
    */

    const glow=
        ctx.createRadialGradient(
            cx,
            cy,
            radius*.2,
            cx,
            cy,
            radius*1.1
        );


    glow.addColorStop(
        0,
        "rgba(40,190,255,.13)"
    );


    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.fillStyle=glow;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       ARENA VERDE
    */

    const arena=
        ctx.createRadialGradient(
            cx-radius*.2,
            cy-radius*.2,
            radius*.05,
            cx,
            cy,
            radius
        );


    arena.addColorStop(
        0,
        "#477e3f"
    );


    arena.addColorStop(
        .5,
        "#285c35"
    );


    arena.addColorStop(
        1,
        "#102f24"
    );


    ctx.beginPath();


    ctx.arc(
        cx,
        cy,
        radius,
        0,
        Math.PI*2
    );


    ctx.fillStyle=arena;

    ctx.fill();


    /*
       CÍRCULOS
    */

    for(
        let r=70;
        r<radius;
        r+=38
    ){

        ctx.beginPath();

        ctx.arc(
            cx,
            cy,
            r,
            0,
            Math.PI*2
        );


        ctx.strokeStyle=
            "rgba(160,230,130,.07)";


        ctx.lineWidth=3;

        ctx.stroke();

    }


    /*
       BORDE
    */

    ctx.beginPath();


    ctx.arc(
        cx,
        cy,
        radius,
        0,
        Math.PI*2
    );


    ctx.strokeStyle="#77e65c";

    ctx.lineWidth=7;

    ctx.shadowColor="#39ff7c";

    ctx.shadowBlur=18;

    ctx.stroke();

    ctx.shadowBlur=0;


    /*
       ANILLO INTERIOR
    */

    ctx.beginPath();


    ctx.arc(
        cx,
        cy,
        radius*.72,
        0,
        Math.PI*2
    );


    ctx.strokeStyle=
        "rgba(120,220,255,.22)";


    ctx.lineWidth=4;

    ctx.stroke();


    /*
       CENTRO
    */

    const center=
        ctx.createRadialGradient(
            cx,
            cy,
            2,
            cx,
            cy,
            radius*.18
        );


    center.addColorStop(
        0,
        "#ffffff"
    );


    center.addColorStop(
        .25,
        "#66dfff"
    );


    center.addColorStop(
        1,
        "rgba(40,120,180,0)"
    );


    ctx.beginPath();


    ctx.arc(
        cx,
        cy,
        radius*.17,
        0,
        Math.PI*2
    );


    ctx.fillStyle=center;

    ctx.fill();


    /*
       MARCAS
    */

    ctx.strokeStyle=
        "rgba(255,255,255,.13)";


    ctx.lineWidth=2;


    for(
        let i=0;
        i<12;
        i++
    ){

        const a=
            i*Math.PI/6;


        const x1=
            cx+
            Math.cos(a)*
            radius*.75;


        const y1=
            cy+
            Math.sin(a)*
            radius*.75;


        const x2=
            cx+
            Math.cos(a)*
            radius*.88;


        const y2=
            cy+
            Math.sin(a)*
            radius*.88;


        ctx.beginPath();


        ctx.moveTo(
            x1,
            y1
        );


        ctx.lineTo(
            x2,
            y2
        );


        ctx.stroke();

    }
}


/* =====================================================
   DIBUJAR TROMPO
===================================================== */

function drawPlayer(p){

    /*
       SOMBRA
    */

    ctx.beginPath();


    ctx.ellipse(
        p.x+5,
        p.y+9,
        p.radius*1.05,
        p.radius*.48,
        0,
        0,
        Math.PI*2
    );


    ctx.fillStyle=
        "rgba(0,0,0,.42)";


    ctx.fill();


    /*
       AURA
    */

    if(p.attack){

        const glow=
            ctx.createRadialGradient(
                p.x,
                p.y,
                p.radius*.5,
                p.x,
                p.y,
                p.radius*2
            );


        glow.addColorStop(
            0,
            "rgba(255,240,70,.25)"
        );


        glow.addColorStop(
            1,
            "rgba(255,200,0,0)"
        );


        ctx.beginPath();


        ctx.arc(
            p.x,
            p.y,
            p.radius*2,
            0,
            Math.PI*2
        );


        ctx.fillStyle=glow;

        ctx.fill();

    }


    ctx.save();


    ctx.translate(
        p.x,
        p.y
    );


    p.angle+=
        p.attack
        ? .30
        : .15;


    ctx.rotate(
        p.angle
    );


    /*
       COLORES
    */

    const colors=[

        ["#ff5a62","#7d071c"],

        ["#55eaff","#0754a6"],

        ["#ffe44e","#b34d00"],

        ["#e477ff","#49107d"]

    ];


    const c=
        colors[
            p.id%4
        ];


    /*
       AURA DEL TROMPO
    */

    ctx.beginPath();


    ctx.arc(
        0,
        0,
        p.radius+4,
        0,
        Math.PI*2
    );


    ctx.fillStyle=
        p.attack
        ? "rgba(255,225,50,.18)"
        : "rgba(80,210,255,.06)";


    ctx.fill();


    /*
       TROMPO
    */

    const gradient=
        ctx.createRadialGradient(
            -9,
            -10,
            3,
            0,
            0,
            p.radius
        );


    gradient.addColorStop(
        0,
        "#ffffff"
    );


    gradient.addColorStop(
        .18,
        c[0]
    );


    gradient.addColorStop(
        1,
        c[1]
    );


    ctx.beginPath();


    ctx.arc(
        0,
        0,
        p.radius,
        0,
        Math.PI*2
    );


    ctx.fillStyle=gradient;

    ctx.fill();


    ctx.strokeStyle="#ffffff";

    ctx.lineWidth=2;

    ctx.stroke();


    /*
       ASPAS
    */

    for(
        let i=0;
        i<8;
        i++
    ){

        const a=
            i*Math.PI/4;


        ctx.save();


        ctx.rotate(a);


        ctx.beginPath();


        ctx.moveTo(
            0,
            -4
        );


        ctx.lineTo(
            p.radius*.82,
            -5
        );


        ctx.lineTo(
            p.radius*.52,
            5
        );


        ctx.lineTo(
            0,
            3
        );


        ctx.closePath();


        ctx.fillStyle=
            i%2===0
            ? "rgba(255,255,255,.28)"
            : "rgba(0,0,0,.18)";


        ctx.fill();


        ctx.restore();

    }


    /*
       ANILLO
    */

    ctx.beginPath();


    ctx.arc(
        0,
        0,
        p.radius*.56,
        0,
        Math.PI*2
    );


    ctx.strokeStyle=
        "rgba(255,255,255,.75)";


    ctx.lineWidth=3;

    ctx.stroke();


    /*
       CENTRO
    */

    const core=
        ctx.createRadialGradient(
            -3,
            -3,
            1,
            0,
            0,
            9
        );


    core.addColorStop(
        0,
        "#ffffff"
    );


    core.addColorStop(
        .35,
        "#bcefff"
    );


    core.addColorStop(
        1,
        "#183d65"
    );


    ctx.beginPath();


    ctx.arc(
        0,
        0,
        9,
        0,
        Math.PI*2
    );


    ctx.fillStyle=core;

    ctx.fill();


    ctx.strokeStyle="#fff";

    ctx.lineWidth=2;

    ctx.stroke();


    ctx.restore();


    /*
       BARRA DE VIDA
    */

    const barWidth=68;

    const barHeight=7;


    const percent=
        Math.max(
            0,
            p.life/p.maxLife
        );


    ctx.fillStyle=
        "rgba(0,0,0,.7)";


    ctx.fillRect(
        p.x-barWidth/2,
        p.y-p.radius-18,
        barWidth,
        barHeight
    );


    const lifeGradient=
        ctx.createLinearGradient(
            p.x-barWidth/2,
            0,
            p.x+barWidth/2,
            0
        );


    lifeGradient.addColorStop(
        0,
        "#ff304f"
    );


    lifeGradient.addColorStop(
        .5,
        "#ffe84c"
    );


    lifeGradient.addColorStop(
        1,
        "#43ff79"
    );


    ctx.fillStyle=
        lifeGradient;


    ctx.fillRect(
        p.x-barWidth/2,
        p.y-p.radius-18,
        barWidth*percent,
        barHeight
    );


    /*
       NOMBRE
    */

    ctx.font=
        "bold 12px Arial";


    ctx.textAlign="center";


    ctx.fillStyle="#ffffff";


    ctx.shadowColor="#000";

    ctx.shadowBlur=5;


    ctx.fillText(
        p.name,
        p.x,
        p.y+p.radius+20
    );


    ctx.shadowBlur=0;


    /*
       ATAQUE
    */

    if(p.attack){

        ctx.beginPath();


        ctx.arc(
            p.x,
            p.y,
            p.radius+
            11+
            Math.sin(
                state.tick*.3
            )*3,
            0,
            Math.PI*2
        );


        ctx.strokeStyle=
            "#ffe329";


        ctx.lineWidth=4;


        ctx.shadowColor=
            "#ffb300";


        ctx.shadowBlur=15;


        ctx.stroke();


        ctx.shadowBlur=0;

    }
}


/* =====================================================
   DIBUJAR
===================================================== */

function draw(){

    drawArena();


    state.players.forEach(
        p=>{

            if(p.alive){

                drawPlayer(p);

            }

        }
    );


    drawParticles();
}


/* =====================================================
   LOOP
===================================================== */

function loop(){

    updateGame();

    draw();

    updateHUD();

    requestAnimationFrame(
        loop
    );
}


loop();


/* =====================================================
   CELULAR
===================================================== */

let touchStartX=0;

let touchStartY=0;


canvas.addEventListener(
    "touchstart",
    e=>{

        const t=
            e.touches[0];


        touchStartX=
            t.clientX;


        touchStartY=
            t.clientY;


        keys[" "]=true;

    },
    {passive:true}
);


canvas.addEventListener(
    "touchmove",
    e=>{

        if(!gameRunning)
            return;


        const t=
            e.touches[0];


        const dx=
            t.clientX-
            touchStartX;


        const dy=
            t.clientY-
            touchStartY;


        keys["arrowup"]=
            dy<-25;


        keys["arrowdown"]=
            dy>25;


        keys["arrowleft"]=
            dx<-25;


        keys["arrowright"]=
            dx>25;

    },
    {passive:true}
);


canvas.addEventListener(
    "touchend",
    ()=>{

        keys["arrowup"]=false;

        keys["arrowdown"]=false;

        keys["arrowleft"]=false;

        keys["arrowright"]=false;

        keys[" "]=false;

    }
);


canvas.addEventListener(
    "contextmenu",
    e=>{
        e.preventDefault();
    }
);
