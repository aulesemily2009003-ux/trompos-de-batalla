<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUERRA BEYBLADE</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#050505;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
    background:#17251b;
}

.screen{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at center,#252525 0%,#090909 65%);
    z-index:10;
}

.panel{
    width:min(92%,500px);
    padding:30px;
    border-radius:25px;
    background:rgba(15,15,15,.95);
    border:2px solid #555;
    box-shadow:0 0 40px #000;
    text-align:center;
}

h1{
    font-size:42px;
    margin-bottom:10px;
    color:#fff;
    text-shadow:0 0 15px #ff3333;
}

h2{
    margin-bottom:20px;
}

.subtitle{
    color:#bbb;
    margin-bottom:25px;
}

button{
    width:100%;
    padding:15px;
    margin:8px 0;
    border:0;
    border-radius:13px;
    background:#292929;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.15s;
}

button:hover{
    transform:scale(1.02);
    background:#3c3c3c;
}

.red{
    background:#9b1717;
}

.blue{
    background:#1558a6;
}

.green{
    background:#16753a;
}

.orange{
    background:#a85c10;
}

.small{
    font-size:14px;
    color:#aaa;
    margin-top:15px;
}

input{
    width:100%;
    padding:14px;
    margin:8px 0;
    border-radius:12px;
    border:1px solid #555;
    background:#111;
    color:white;
    font-size:18px;
    text-align:center;
}

#hud{
    display:none;
    position:fixed;
    top:10px;
    left:10px;
    right:10px;
    z-index:5;
    pointer-events:none;
}

.hudBox{
    display:inline-block;
    padding:10px 14px;
    border-radius:12px;
    background:rgba(0,0,0,.65);
    border:1px solid #555;
    margin-right:5px;
}

#pauseBtn{
    pointer-events:auto;
    float:right;
    width:auto;
    padding:10px 16px;
    margin:0;
}

#playersHUD{
    margin-top:7px;
}

.playerLine{
    font-size:13px;
    margin:2px;
}

.dead{
    opacity:.4;
    text-decoration:line-through;
}

#pauseScreen,
#gameOver{
    display:none;
}

.code{
    font-size:28px;
    font-weight:bold;
    letter-spacing:5px;
    color:#6ee7ff;
    margin:15px 0;
    word-break:break-all;
}

#message{
    min-height:25px;
    margin-top:10px;
    color:#ffd34d;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div class="hudBox">
        ❤️ <span id="myLife">100</span>
    </div>

    <div class="hudBox">
        👥 <span id="aliveCount">0</span>/4
    </div>

    <button id="pauseBtn" onclick="togglePause()">⏸ PAUSA</button>

    <div id="playersHUD"></div>
</div>

<!-- MENÚ -->
<div class="screen" id="menu">
    <div class="panel">
        <h1>⚡ GUERRA BEYBLADE ⚡</h1>
        <div class="subtitle">¡La batalla de trompos comienza!</div>

        <button class="red" onclick="startSolo()">
            🎮 JUGAR SOLO
        </button>

        <button class="blue" onclick="openOnline(false)">
            🌐 ONLINE
        </button>

        <button class="green" onclick="openOnline(true)">
            🤖 ONLINE + CPU
        </button>

        <div class="small">
            Máximo 4 trompos por batalla
        </div>
    </div>
</div>

<!-- ONLINE -->
<div class="screen" id="onlineScreen" style="display:none;">
    <div class="panel">
        <h2 id="onlineTitle">🌐 ONLINE</h2>

        <button class="green" onclick="createRoom()">
            ➕ CREAR SALA
        </button>

        <div style="margin:12px 0;color:#aaa;">o</div>

        <input id="roomInput" placeholder="Código de sala">

        <button class="blue" onclick="joinRoom()">
            🚪 UNIRSE
        </button>

        <div id="roomInfo"></div>
        <div id="message"></div>

        <button onclick="backToMenu()">
            ↩ VOLVER
        </button>
    </div>
</div>

<!-- LOBBY -->
<div class="screen" id="lobbyScreen" style="display:none;">
    <div class="panel">
        <h2>⚔️ SALA DE BATALLA</h2>

        <div>Comparte este código:</div>
        <div class="code" id="myRoomCode">---</div>

        <div id="lobbyPlayers" style="margin:20px 0;"></div>

        <button class="red" id="startOnlineBtn" onclick="startOnlineBattle()">
            ▶ JUGAR
        </button>

        <button onclick="backToMenu()">
            ↩ SALIR
        </button>

        <div class="small">
            En ONLINE + CPU se completan automáticamente los espacios con CPU.
        </div>
    </div>
</div>

<!-- PAUSA -->
<div class="screen" id="pauseScreen">
    <div class="panel">
        <h2>⏸ JUEGO PAUSADO</h2>

        <button class="green" onclick="togglePause()">
            ▶ CONTINUAR
        </button>

        <button onclick="backToMenu()">
            🏠 MENÚ PRINCIPAL
        </button>
    </div>
</div>

<!-- GAME OVER -->
<div class="screen" id="gameOver">
    <div class="panel">
        <h1>🏆</h1>
        <h2 id="winnerText">GANADOR</h2>

        <button class="red" onclick="restartCurrentMode()">
            🔄 VOLVER A JUGAR
        </button>

        <button onclick="backToMenu()">
            🏠 MENÚ
        </button>
    </div>
</div>

<script>
/* =========================================================
   CONFIGURACIÓN
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const MAX_PLAYERS = 4;

let W = 0;
let H = 0;

function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

window.addEventListener("resize",resize);
resize();


/* =========================================================
   ESTADO DEL JUEGO
========================================================= */

let gameMode = "solo";
let paused = false;
let gameRunning = false;

let state = {
    players: [],
    running:false,
    winner:null,
    tick:0
};

let localPlayerIndex = 0;


/* =========================================================
   ONLINE
========================================================= */

let peer = null;
let isHost = false;
let hostConnection = null;
let connections = [];

let onlineModeCPU = false;
let roomCode = "";


/* =========================================================
   TECLADO
========================================================= */

const keys = {};

window.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()] = true;

    if(e.key === "Escape"){
        togglePause();
    }
});

window.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()] = false;
});


/* =========================================================
   UTILIDADES
========================================================= */

function random(min,max){
    return Math.random()*(max-min)+min;
}

function distance(a,b){
    return Math.hypot(a.x-b.x,a.y-b.y);
}

function clamp(v,min,max){
    return Math.max(min,Math.min(max,v));
}


/* =========================================================
   TROMPOS
========================================================= */

const names = [
    "DRAGÓN",
    "FÉNIX",
    "TITÁN",
    "SOMBRA"
];

const symbols = [
    "🐉",
    "🔥",
    "⚡",
    "🌑"
];

function createPlayer(index,cpu=false){

    const margin = 100;

    return {
        id:index,
        name:names[index],
        symbol:symbols[index],

        x:random(margin,W-margin),
        y:random(margin,H-margin),

        vx:0,
        vy:0,

        radius:28,

        life:100,
        maxLife:100,

        cpu:cpu,
        alive:true,

        attack:false,
        attackTimer:0,

        cooldown:0,

        target:null,

        angle:random(0,Math.PI*2),

        aiTimer:0
    };
}


/* =========================================================
   MENÚ
========================================================= */

function hideAllScreens(){
    document.querySelectorAll(".screen").forEach(s=>{
        s.style.display="none";
    });
}

function backToMenu(){

    gameRunning=false;
    paused=false;

    if(peer){
        try{
            peer.destroy();
        }catch(e){}
    }

    peer=null;
    connections=[];
    hostConnection=null;
    isHost=false;

    hideAllScreens();

    document.getElementById("menu").style.display="flex";
    document.getElementById("hud").style.display="none";
}

function startSolo(){

    gameMode="solo";
    onlineModeCPU=false;

    hideAllScreens();

    document.getElementById("hud").style.display="block";

    state = {
        players:[],
        running:true,
        winner:null,
        tick:0
    };

    /*
       1 jugador humano + 3 CPU
    */
    for(let i=0;i<MAX_PLAYERS;i++){
        state.players.push(createPlayer(i,i!==0));
    }

    localPlayerIndex=0;

    gameRunning=true;
    paused=false;

    updateHUD();
}


/* =========================================================
   ONLINE MENÚ
========================================================= */

function openOnline(withCPU){

    onlineModeCPU=withCPU;
    gameMode=withCPU ? "onlinecpu" : "online";

    hideAllScreens();

    document.getElementById("onlineScreen").style.display="flex";

    document.getElementById("onlineTitle").textContent =
        withCPU ? "🤖 ONLINE + CPU" : "🌐 ONLINE";

    document.getElementById("roomInfo").innerHTML="";
    document.getElementById("message").textContent="";
}

function createRoom(){

    if(peer){
        try{peer.destroy();}catch(e){}
    }

    isHost=true;

    peer=new Peer();

    peer.on("open",id=>{

        roomCode=id;

        document.getElementById("myRoomCode").textContent=id;

        showLobby();

    });

    peer.on("connection",conn=>{

        connections.push(conn);

        conn.on("open",()=>{

            conn.on("data",data=>{
                handleHostData(conn,data);
            });

            sendLobby();

        });

        conn.on("close",()=>{
            connections=connections.filter(c=>c!==conn);
            sendLobby();
        });

    });

    peer.on("error",err=>{
        document.getElementById("message").textContent =
            "Error de conexión.";
        console.error(err);
    });
}

function joinRoom(){

    const code=document.getElementById("roomInput").value.trim();

    if(!code){
        document.getElementById("message").textContent =
            "Escribe el código de la sala.";
        return;
    }

    isHost=false;

    if(peer){
        try{peer.destroy();}catch(e){}
    }

    peer=new Peer();

    peer.on("open",()=>{

        hostConnection=peer.connect(code);

        hostConnection.on("open",()=>{

            hostConnection.send({
                type:"join"
            });

            showLobby();

        });

        hostConnection.on("data",data=>{
            handleGuestData(data);
        });

        hostConnection.on("close",()=>{
            alert("La conexión con el anfitrión se cerró.");
            backToMenu();
        });

    });

    peer.on("error",err=>{
        document.getElementById("message").textContent =
            "No se pudo conectar a la sala.";
        console.error(err);
    });
}


/* =========================================================
   LOBBY
========================================================= */

function showLobby(){

    hideAllScreens();

    document.getElementById("lobbyScreen").style.display="flex";

    document.getElementById("myRoomCode").textContent =
        roomCode || "SALA";

    updateLobbyUI();

    if(isHost){
        document.getElementById("startOnlineBtn").style.display="block";
    }else{
        document.getElementById("startOnlineBtn").style.display="none";
    }
}

function updateLobbyUI(){

    let count=1;

    if(isHost){
        count=1+connections.length;
    }

    let html="";

    for(let i=0;i<count;i++){
        html += `
            <div style="
                padding:8px;
                margin:5px;
                border-radius:8px;
                background:#222;
            ">
                🎮 Jugador ${i+1}
            </div>
        `;
    }

    if(onlineModeCPU){
        for(let i=count;i<MAX_PLAYERS;i++){
            html += `
                <div style="
                    padding:8px;
                    margin:5px;
                    border-radius:8px;
                    background:#171717;
                    color:#aaa;
                ">
                    🤖 CPU ${i+1}
                </div>
            `;
        }
    }

    document.getElementById("lobbyPlayers").innerHTML=html;
}


/* =========================================================
   DATOS ONLINE
========================================================= */

function sendLobby(){

    if(!isHost)return;

    const playerCount=Math.min(
        MAX_PLAYERS,
        1+connections.length
    );

    connections.forEach(conn=>{
        try{
            conn.send({
                type:"lobby",
                count:playerCount,
                cpu:onlineModeCPU
            });
        }catch(e){}
    });

    updateLobbyUI();
}

function handleHostData(conn,data){

    if(data.type==="join"){
        sendLobby();
        return;
    }

    if(data.type==="input"){

        /*
           Encontrar al jugador de esta conexión.
           El jugador 0 es el host.
        */

        const index=connections.indexOf(conn)+1;

        if(index>=1 && index<state.players.length){

            const p=state.players[index];

            if(p){

                p.input={
                    up:!!data.up,
                    down:!!data.down,
                    left:!!data.left,
                    right:!!data.right,
                    attack:!!data.attack
                };
            }
        }
    }
}

function handleGuestData(data){

    if(data.type==="lobby"){

        onlineModeCPU=data.cpu;

        updateLobbyUI();
        return;
    }

    if(data.type==="start"){

        startGuestGame(data);
        return;
    }

    if(data.type==="state"){

        state=data.state;

        updateHUD();
        return;
    }

    if(data.type==="gameover"){

        showGameOver(data.winner);
    }
}


/* =========================================================
   COMENZAR ONLINE
========================================================= */

function startOnlineBattle(){

    if(!isHost)return;

    let humanCount=Math.min(
        MAX_PLAYERS,
        1+connections.length
    );

    /*
       Crear jugadores humanos.
    */

    state={
        players:[],
        running:true,
        winner:null,
        tick:0
    };

    for(let i=0;i<humanCount;i++){

        const p=createPlayer(i,false);

        p.input={
            up:false,
            down:false,
            left:false,
            right:false,
            attack:false
        };

        state.players.push(p);
    }

    /*
       ONLINE + CPU:
       llenar hasta 4 jugadores con CPU.
    */

    if(onlineModeCPU){

        while(state.players.length<MAX_PLAYERS){

            const i=state.players.length;

            const p=createPlayer(i,true);

            p.input={
                up:false,
                down:false,
                left:false,
                right:false,
                attack:false
            };

            state.players.push(p);
        }
    }

    /*
       ONLINE normal:
       solamente los jugadores conectados.
    */

    state.running=true;

    localPlayerIndex=0;

    gameRunning=true;
    paused=false;

    hideAllScreens();

    document.getElementById("hud").style.display="block";

    /*
       Avisar a los invitados.
    */

    connections.forEach((conn,index)=>{

        try{

            conn.send({
                type:"start",
                state:state,
                index:index+1
            });

        }catch(e){}

    });

    updateHUD();
}


/* =========================================================
   JUEGO INVITADO
========================================================= */

function startGuestGame(data){

    state=data.state;

    localPlayerIndex=data.index;

    gameMode=onlineModeCPU ?
        "onlinecpu" :
        "online";

    gameRunning=true;
    paused=false;

    hideAllScreens();

    document.getElementById("hud").style.display="block";

    updateHUD();
}


/* =========================================================
   INPUT
========================================================= */

function getInput(){

    return {
        up:
            keys["w"] ||
            keys["arrowup"],

        down:
            keys["s"] ||
            keys["arrowdown"],

        left:
            keys["a"] ||
            keys["arrowleft"],

        right:
            keys["d"] ||
            keys["arrowright"],

        attack:
            keys[" "] ||
            keys["enter"]
    };
}


/* =========================================================
   MOVIMIENTO HUMANO
========================================================= */

function updateHuman(p){

    if(!p.alive)return;

    let input;

    if(gameMode==="solo"){
        input=getInput();
    }
    else if(gameMode==="online" || gameMode==="onlinecpu"){

        if(isHost){

            /*
               Host:
               jugador 0 usa teclado.
               invitados usan p.input.
            */

            if(p.id===0){
                input=getInput();
            }else{
                input=p.input || {
                    up:false,
                    down:false,
                    left:false,
                    right:false,
                    attack:false
                };
            }

        }else{

            /*
               Los invitados mandan su input al host.
            */

            if(p.id===localPlayerIndex){
                input=getInput();

                if(hostConnection){

                    try{
                        hostConnection.send({
                            type:"input",
                            ...input
                        });
                    }catch(e){}
                }

                /*
                   No simulamos movimiento del invitado.
                */

                return;
            }

            return;
        }
    }

    let dx=0;
    let dy=0;

    if(input.up)dy-=1;
    if(input.down)dy+=1;
    if(input.left)dx-=1;
    if(input.right)dx+=1;

    const len=Math.hypot(dx,dy);

    if(len>0){

        dx/=len;
        dy/=len;

        p.vx+=dx*.65;
        p.vy+=dy*.65;
    }

    p.vx*=.88;
    p.vy*=.88;

    const maxSpeed=5;

    const speed=Math.hypot(p.vx,p.vy);

    if(speed>maxSpeed){

        p.vx=p.vx/speed*maxSpeed;
        p.vy=p.vy/speed*maxSpeed;
    }

    p.x+=p.vx;
    p.y+=p.vy;

    p.x=clamp(p.x,45,W-45);
    p.y=clamp(p.y,45,H-45);

    if(input.attack && p.cooldown<=0){

        p.attack=true;
        p.attackTimer=9;
        p.cooldown=25;
    }
}


/* =========================================================
   IA DE CPU
========================================================= */

function updateCPU(p,index){

    if(!p.alive)return;

    /*
       REDUCCIÓN IMPORTANTE DEL BUG:

       El CPU busca a CUALQUIER otro jugador vivo.

       No importa si es:
       - humano
       - CPU
       - jugador invitado

       Así los CPU también se atacan entre ellos.
    */

    let target=null;
    let bestDistance=Infinity;

    for(let i=0;i<state.players.length;i++){

        if(i===index)continue;

        const other=state.players[i];

        if(!other.alive)continue;

        const d=distance(p,other);

        if(d<bestDistance){

            bestDistance=d;
            target=other;
        }
    }

    p.target=target ? target.id : null;

    if(!target)return;

    const dx=target.x-p.x;
    const dy=target.y-p.y;

    const d=Math.hypot(dx,dy)||1;

    const nx=dx/d;
    const ny=dy/d;

    /*
       IA:
       - lejos: se acerca
       - cerca: se mueve alrededor
       - muy cerca: ataca
    */

    if(d>75){

        p.vx+=nx*.55;
        p.vy+=ny*.55;

    }else{

        /*
           Movimiento circular para que no se queden
           quietos delante del enemigo.
        */

        const sideX=-ny;
        const sideY=nx;

        p.vx+=sideX*.42;
        p.vy+=sideY*.42;

        /*
           Mantenerse cerca del objetivo.
        */

        if(d>65){

            p.vx+=nx*.25;
            p.vy+=ny*.25;
        }
    }

    /*
       ATAQUE CPU

       Ahora el ataque tiene un rango mayor que el
       simple choque físico. Esto evita que los CPU
       se queden girando sin hacerse daño.
    */

    if(d<=92 && p.cooldown<=0){

        p.attack=true;
        p.attackTimer=10;
        p.cooldown=22;
    }

    p.vx*=.90;
    p.vy*=.90;

    const maxSpeed=4.4;

    const speed=Math.hypot(p.vx,p.vy);

    if(speed>maxSpeed){

        p.vx=p.vx/speed*maxSpeed;
        p.vy=p.vy/speed*maxSpeed;
    }

    p.x+=p.vx;
    p.y+=p.vy;

    p.x=clamp(p.x,45,W-45);
    p.y=clamp(p.y,45,H-45);
}


/* =========================================================
   ACTUALIZAR ATAQUES
========================================================= */

function updateTimers(p){

    if(p.cooldown>0){
        p.cooldown--;
    }

    if(p.attackTimer>0){

        p.attackTimer--;

        p.attack=true;

    }else{

        p.attack=false;
    }
}


/* =========================================================
   ATAQUES Y COLISIONES
========================================================= */

function collisions(){

    const players=state.players;

    for(let i=0;i<players.length;i++){

        const a=players[i];

        if(!a.alive)continue;

        for(let j=i+1;j<players.length;j++){

            const b=players[j];

            if(!b.alive)continue;

            const dx=b.x-a.x;
            const dy=b.y-a.y;

            const d=Math.hypot(dx,dy)||1;

            /*
               Colisión física.
            */

            const minDist=a.radius+b.radius;

            if(d<minDist){

                const nx=dx/d;
                const ny=dy/d;

                const overlap=minDist-d;

                a.x-=nx*overlap*.5;
                a.y-=ny*overlap*.5;

                b.x+=nx*overlap*.5;
                b.y+=ny*overlap*.5;

                const push=1.2;

                a.vx-=nx*push;
                a.vy-=ny*push;

                b.vx+=nx*push;
                b.vy+=ny*push;
            }

            /*
               ATAQUE A

               Importante:
               no exige que estén exactamente chocando.
            */

            const attackRange =
                a.radius+b.radius+35;

            if(a.attack && d<=attackRange){

                damagePlayer(b,a);
            }

            /*
               ATAQUE B
            */

            if(b.attack && d<=attackRange){

                damagePlayer(a,b);
            }
        }
    }
}


/* =========================================================
   DAÑO
========================================================= */

function damagePlayer(target,attacker){

    if(!target.alive)return;

    /*
       Evitar daño exageradamente rápido.
       Cada trompo tiene un pequeño cooldown
       de contacto por ataque.
    */

    if(target.hitCooldown>0)return;

    target.hitCooldown=10;

    const damage=8;

    target.life-=damage;

    /*
       Empujón.
    */

    const dx=target.x-attacker.x;
    const dy=target.y-attacker.y;

    const d=Math.hypot(dx,dy)||1;

    target.vx+=(dx/d)*2.5;
    target.vy+=(dy/d)*2.5;

    if(target.life<=0){

        target.life=0;
        target.alive=false;

        target.vx=0;
        target.vy=0;

        target.attack=false;

        /*
           MUY IMPORTANTE:

           Aquí NO detenemos el juego.

           Si muere el humano:
           los CPU siguen peleando.

           Solo se comprueba si queda un único
           jugador vivo.
        */
    }
}


/* =========================================================
   ACTUALIZAR JUEGO
========================================================= */

function updateGame(){

    if(!gameRunning)return;
    if(paused)return;

    /*
       En ONLINE el HOST es quien ejecuta
       la simulación completa.
    */

    if(gameMode==="online" || gameMode==="onlinecpu"){

        if(!isHost){

            /*
               El invitado solamente envía controles.
            */

            return;
        }
    }

    state.tick++;

    for(let i=0;i<state.players.length;i++){

        const p=state.players[i];

        if(p.hitCooldown>0){
            p.hitCooldown--;
        }

        updateTimers(p);

        if(!p.alive)continue;

        if(p.cpu){

            updateCPU(p,i);

        }else{

            updateHuman(p);
        }
    }

    collisions();

    checkWinner();

    /*
       ONLINE:
       mandar estado a todos los invitados.
    */

    if(
        gameMode==="online" ||
        gameMode==="onlinecpu"
    ){

        broadcastState();
    }
}


/* =========================================================
   GANADOR
========================================================= */

function checkWinner(){

    if(!state.running)return;

    const alive=state.players.filter(p=>p.alive);

    /*
       La partida solamente termina cuando
       queda UN trompo.
    */

    if(alive.length<=1){

        state.running=false;
        gameRunning=false;

        const winner=alive.length===1 ?
            alive[0] :
            null;

        state.winner=winner ? winner.id : null;

        if(
            gameMode==="online" ||
            gameMode==="onlinecpu"
        ){

            if(isHost){

                connections.forEach(conn=>{

                    try{

                        conn.send({
                            type:"gameover",
                            winner:state.winner
                        });

                    }catch(e){}
                });

            }

        }

        showGameOver(state.winner);
    }
}


/* =========================================================
   ONLINE STATE
========================================================= */

function broadcastState(){

    if(!isHost)return;

    connections.forEach(conn=>{

        try{

            conn.send({
                type:"state",
                state:state
            });

        }catch(e){}
    });
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    if(!state.players.length)return;

    const me=state.players[localPlayerIndex];

    if(me){

        document.getElementById("myLife").textContent =
            Math.ceil(me.life);
    }

    const alive=state.players.filter(p=>p.alive).length;

    document.getElementById("aliveCount").textContent =
        alive;

    let html="";

    state.players.forEach((p,i)=>{

        html+=`
            <div class="playerLine ${p.alive?"":"dead"}">
                ${p.symbol} ${p.name}
                ${p.cpu?"🤖":""}
                ❤️ ${Math.ceil(p.life)}
            </div>
        `;
    });

    document.getElementById("playersHUD").innerHTML=html;
}


/* =========================================================
   GAME OVER
========================================================= */

function showGameOver(winnerId){

    hideAllScreens();

    document.getElementById("gameOver").style.display="flex";

    let winner=state.players.find(p=>p.id===winnerId);

    if(winner){

        document.getElementById("winnerText").textContent =
            `${winner.symbol} ${winner.name} GANÓ`;
    }else{

        document.getElementById("winnerText").textContent =
            "NO HAY GANADOR";
    }
}

function restartCurrentMode(){

    if(gameMode==="solo"){

        startSolo();

    }else{

        backToMenu();

        setTimeout(()=>{
            openOnline(onlineModeCPU);
        },50);
    }
}


/* =========================================================
   PAUSA
========================================================= */

function togglePause(){

    if(!gameRunning)return;

    paused=!paused;

    if(paused){

        document.getElementById("pauseScreen").style.display="flex";

    }else{

        document.getElementById("pauseScreen").style.display="none";
    }
}


/* =========================================================
   DIBUJO DEL MAPA
========================================================= */

function drawArena(){

    ctx.fillStyle="#162219";
    ctx.fillRect(0,0,W,H);

    /*
       Césped.
    */

    ctx.fillStyle="#1b3020";
    ctx.fillRect(25,25,W-50,H-50);

    /*
       Líneas decorativas.
    */

    ctx.strokeStyle="rgba(255,255,255,.05)";
    ctx.lineWidth=2;

    for(let x=40;x<W;x+=50){

        ctx.beginPath();
        ctx.moveTo(x,30);
        ctx.lineTo(x,H-30);
        ctx.stroke();
    }

    for(let y=40;y<H;y+=50){

        ctx.beginPath();
        ctx.moveTo(30,y);
        ctx.lineTo(W-30,y);
        ctx.stroke();
    }

    /*
       Arena central.
    */

    const cx=W/2;
    const cy=H/2;

    const radius=Math.min(W,H)*.38;

    ctx.beginPath();
    ctx.arc(cx,cy,radius,0,Math.PI*2);

    ctx.fillStyle="#263a29";
    ctx.fill();

    ctx.strokeStyle="#687d5d";
    ctx.lineWidth=6;
    ctx.stroke();

    /*
       Círculo interior.
    */

    ctx.beginPath();
    ctx.arc(cx,cy,radius*.72,0,Math.PI*2);

    ctx.strokeStyle="rgba(255,255,255,.10)";
    ctx.lineWidth=3;
    ctx.stroke();
}


/* =========================================================
   DIBUJAR TROMPO
========================================================= */

function drawPlayer(p){

    /*
       Sombra.
    */

    ctx.beginPath();
    ctx.ellipse(
        p.x+4,
        p.y+7,
        p.radius*.9,
        p.radius*.45,
        0,
        0,
        Math.PI*2
    );

    ctx.fillStyle="rgba(0,0,0,.35)";
    ctx.fill();

    /*
       Trompo.
    */

    ctx.save();

    ctx.translate(p.x,p.y);

    p.angle+=.15;

    ctx.rotate(p.angle);

    const gradient=ctx.createRadialGradient(
        -8,-8,3,
        0,0,p.radius
    );

    gradient.addColorStop(0,"#ffffff");
    gradient.addColorStop(.2,
        p.id===0 ? "#e63946" :
        p.id===1 ? "#2196f3" :
        p.id===2 ? "#ffc107" :
        "#9c27b0"
    );
    gradient.addColorStop(1,"#111");

    ctx.beginPath();
    ctx.arc(0,0,p.radius,0,Math.PI*2);

    ctx.fillStyle=gradient;
    ctx.fill();

    ctx.strokeStyle="#ddd";
    ctx.lineWidth=2;
    ctx.stroke();

    /*
       Diseño del trompo.
    */

    ctx.beginPath();

    for(let i=0;i<8;i++){

        const a=i*Math.PI/4;

        ctx.lineTo(
            Math.cos(a)*p.radius,
            Math.sin(a)*p.radius
        );

        ctx.lineTo(
            Math.cos(a+.18)*p.radius*.4,
            Math.sin(a+.18)*p.radius*.4
        );
    }

    ctx.closePath();

    ctx.strokeStyle="rgba(255,255,255,.6)";
    ctx.lineWidth=2;
    ctx.stroke();

    /*
       Centro.
    */

    ctx.beginPath();
    ctx.arc(0,0,7,0,Math.PI*2);

    ctx.fillStyle="#eee";
    ctx.fill();

    ctx.restore();

    /*
       Barra de vida.
    */

    const barWidth=60;
    const barHeight=7;

    const lifePercent=
        Math.max(0,p.life/p.maxLife);

    ctx.fillStyle="#111";

    ctx.fillRect(
        p.x-barWidth/2,
        p.y-p.radius-16,
        barWidth,
        barHeight
    );

    ctx.fillStyle=
        lifePercent>.5 ? "#37d65b" :
        lifePercent>.25 ? "#ffc107" :
        "#e53935";

    ctx.fillRect(
        p.x-barWidth/2,
        p.y-p.radius-16,
        barWidth*lifePercent,
        barHeight
    );

    /*
       Nombre.
    */

    ctx.font="bold 12px Arial";
    ctx.textAlign="center";

    ctx.fillStyle="white";

    ctx.fillText(
        p.name,
        p.x,
        p.y+p.radius+18
    );

    /*
       Indicador de ataque.
    */

    if(p.attack){

        ctx.beginPath();
        ctx.arc(
            p.x,
            p.y,
            p.radius+10,
            0,
            Math.PI*2
        );

        ctx.strokeStyle="#ffdf00";
        ctx.lineWidth=4;
        ctx.stroke();
    }
}


/* =========================================================
   DIBUJAR
========================================================= */

function draw(){

    drawArena();

    if(state.players){

        state.players.forEach(p=>{

            if(p.alive){
                drawPlayer(p);
            }
        });
    }
}


/* =========================================================
   LOOP PRINCIPAL
========================================================= */

function loop(){

    updateGame();

    draw();

    updateHUD();

    requestAnimationFrame(loop);
}

loop();


/* =========================================================
   BOTÓN ATAQUE PARA CELULAR
========================================================= */

let touchAttack=false;

canvas.addEventListener("touchstart",e=>{

    e.preventDefault();

    if(gameRunning){

        touchAttack=true;

        if(gameMode==="solo"){

            keys[" "]=true;

        }else{

            keys[" "]=true;
        }
    }

},{passive:false});

canvas.addEventListener("touchend",e=>{

    e.preventDefault();

    touchAttack=false;
    keys[" "]=false;

},{passive:false});


/* =========================================================
   CONTROLES TÁCTILES BÁSICOS
========================================================= */

let touchStartX=0;
let touchStartY=0;

canvas.addEventListener("touchstart",e=>{

    const t=e.touches[0];

    touchStartX=t.clientX;
    touchStartY=t.clientY;

},{passive:true});

canvas.addEventListener("touchmove",e=>{

    if(!gameRunning)return;

    const t=e.touches[0];

    const dx=t.clientX-touchStartX;
    const dy=t.clientY-touchStartY;

    keys["arrowup"]=dy<-25;
    keys["arrowdown"]=dy>25;
    keys["arrowleft"]=dx<-25;
    keys["arrowright"]=dx>25;

},{passive:true});

canvas.addEventListener("touchend",()=>{

    keys["arrowup"]=false;
    keys["arrowdown"]=false;
    keys["arrowleft"]=false;
    keys["arrowright"]=false;

});


/* =========================================================
   EVITAR MENÚ CONTEXTUAL
========================================================= */

canvas.addEventListener("contextmenu",e=>{
    e.preventDefault();
});

</script>
