<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>GUERRA BEYBLADE</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#070817;color:white}
body{touch-action:none}

.screen{
 position:absolute;inset:0;display:none;align-items:center;justify-content:center;
 background:
 radial-gradient(circle at 50% 35%,#25276c 0,#10133b 35%,#060713 75%);
}
.screen.active{display:flex}

.screen:before{
 content:"";position:absolute;inset:0;pointer-events:none;
 background-image:
 radial-gradient(circle,rgba(255,255,255,.9) 1px,transparent 1px),
 radial-gradient(circle,rgba(90,200,255,.6) 1px,transparent 1px);
 background-size:90px 90px,150px 150px;
 animation:stars 18s linear infinite;
 opacity:.35;
}
@keyframes stars{to{background-position:90px 90px,-150px 150px}}

.menuBox,.lobbyBox{
 position:relative;z-index:2;width:min(92%,520px);padding:30px;
 border:2px solid #6570ff;border-radius:30px;
 background:rgba(8,10,35,.88);
 box-shadow:0 0 35px #4654ff66, inset 0 0 30px #ffffff08;
 text-align:center;
}

.title{
 font-size:clamp(42px,9vw,75px);
 font-weight:1000;
 letter-spacing:3px;
 color:#fff;
 text-shadow:0 0 8px #fff,0 0 25px #6c63ff,0 0 50px #ff3de8;
}
.sub{color:#b9c7ff;margin:10px 0 25px;font-size:16px}

input{
 width:100%;padding:16px;margin:7px 0;border:2px solid #5663ff;
 border-radius:15px;background:#090c2c;color:white;font-size:20px;
 text-align:center;outline:none;
}
input:focus{box-shadow:0 0 18px #6570ff}

button{
 width:100%;padding:16px;margin:7px 0;border:0;border-radius:16px;
 font-size:18px;font-weight:900;color:white;cursor:pointer;
 background:linear-gradient(135deg,#7357ff,#e83cff);
 box-shadow:0 7px 20px #5d3cff55;
 transition:.15s;
}
button:active{transform:scale(.97)}
button:hover{filter:brightness(1.15)}

.btnBlue{background:linear-gradient(135deg,#287bff,#20d9ff)}
.btnGreen{background:linear-gradient(135deg,#00bd77,#00e6a1)}
.btnRed{background:linear-gradient(135deg,#ff315d,#ff6b36)}

.small{font-size:14px;color:#aeb7dc;margin-top:10px}
.error{color:#ff738d;min-height:24px;margin-top:8px;font-weight:bold}
.success{color:#54ffc1;min-height:24px;margin-top:8px;font-weight:bold}

#lobbyCode{
 font-size:42px;font-weight:1000;letter-spacing:10px;
 color:#62eaff;text-shadow:0 0 20px #00d9ff;
 margin:12px 0;
}

.players{
 display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0;
}
.playerSlot{
 padding:13px;border-radius:14px;background:#151942;
 border:1px solid #414b91;color:#dbe2ff;font-weight:bold;
}
.playerSlot.ready{border-color:#20e6a1;box-shadow:0 0 12px #20e6a144}

#game{
 background:#050611;
}

canvas{
 position:absolute;inset:0;width:100%;height:100%;
}

.hud{
 position:absolute;z-index:5;top:10px;left:50%;
 transform:translateX(-50%);
 display:flex;gap:8px;pointer-events:none;
}
.hudBox{
 min-width:105px;padding:8px 12px;border-radius:13px;
 background:#090c25dd;border:1px solid #5964c9;
 text-align:center;font-size:12px;
 box-shadow:0 0 15px #3344aa55;
}
.hudBox b{font-size:18px;color:#fff}

#message{
 position:absolute;z-index:8;top:50%;left:50%;
 transform:translate(-50%,-50%);
 font-size:clamp(45px,12vw,110px);
 font-weight:1000;color:white;
 text-shadow:0 0 15px #fff,0 0 40px #8d55ff;
 pointer-events:none;
 opacity:0;
}
#message.show{animation:msg 1s ease}
@keyframes msg{
 0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
 25%,75%{opacity:1;transform:translate(-50%,-50%) scale(1)}
 100%{opacity:0;transform:translate(-50%,-50%) scale(1.2)}
}

#touch{
 position:absolute;z-index:10;inset:0;pointer-events:none;
}
#joy{
 position:absolute;left:25px;bottom:25px;width:135px;height:135px;
 border-radius:50%;background:#ffffff12;border:2px solid #ffffff44;
 box-shadow:0 0 25px #5264ff66;pointer-events:auto;
}
#stick{
 position:absolute;width:58px;height:58px;left:37px;top:37px;
 border-radius:50%;background:linear-gradient(135deg,#6d65ff,#e33dff);
 box-shadow:0 0 20px #9a5cff;
}
#attack{
 position:absolute;right:28px;bottom:42px;width:105px;height:105px;
 border-radius:50%;border:3px solid #fff;background:linear-gradient(135deg,#ff3068,#ff8b38);
 box-shadow:0 0 30px #ff416c;
 font-size:15px;pointer-events:auto;
}

#gameButtons{
 position:absolute;z-index:10;right:15px;top:15px;display:flex;gap:7px;
}
#gameButtons button{
 width:auto;padding:9px 13px;margin:0;font-size:13px;
}

#resultBox{
 position:absolute;z-index:20;display:none;
 width:min(90%,440px);padding:28px;border-radius:25px;
 background:#080a25ee;border:2px solid #6874ff;
 box-shadow:0 0 40px #5464ff77;text-align:center;
}
#resultBox h2{font-size:38px;margin-bottom:12px}
#resultText{color:#cbd3ff;margin-bottom:15px}

#connecting{
 position:fixed;z-index:100;inset:0;display:none;
 align-items:center;justify-content:center;
 background:#050614eF;text-align:center;
}
.loader{
 width:65px;height:65px;border-radius:50%;
 border:6px solid #31375f;border-top-color:#65e8ff;
 animation:spin .8s linear infinite;margin:auto auto 18px;
}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:600px){
 .menuBox,.lobbyBox{padding:22px}
 .players{grid-template-columns:1fr}
 .title{font-size:43px}
}
</style>
</head>

<body>

<div id="menu" class="screen active">
 <div class="menuBox">
  <div class="title">GUERRA<br>BEYBLADE</div>
  <div class="sub">⚡ Batallas de trompos • Hasta 4 jugadores ⚡</div>

  <input id="nameInput" maxlength="12" placeholder="PON TU NOMBRE">

  <button class="btnGreen" onclick="solo()">⚔️ JUGAR SOLO</button>
  <button class="btnBlue" onclick="showOnline()">🌐 JUGAR ONLINE</button>

  <div class="small">PC 💻 y celular 📱</div>
 </div>
</div>

<div id="online" class="screen">
 <div class="menuBox">
  <h1>🌐 MODO ONLINE</h1>
  <div class="sub">Crea una sala o entra usando un código de 4 números.</div>

  <input id="hostName" maxlength="12" placeholder="TU NOMBRE">

  <button class="btnGreen" onclick="createRoom()">➕ CREAR SALA</button>

  <input id="roomCodeInput" maxlength="4" inputmode="numeric"
         placeholder="CÓDIGO DE 4 NÚMEROS"
         oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,4)">

  <input id="guestName" maxlength="12" placeholder="TU NOMBRE">

  <button class="btnBlue" onclick="joinRoom()">🚀 ENTRAR A SALA</button>
  <button class="btnRed" onclick="backMenu()">⬅ VOLVER</button>

  <div id="onlineError" class="error"></div>
 </div>
</div>

<div id="lobby" class="screen">
 <div class="lobbyBox">
  <h1>⚡ SALA DE BATALLA ⚡</h1>
  <div class="small">CÓDIGO DE LA SALA</div>
  <div id="lobbyCode">----</div>

  <div id="lobbyStatus" class="success">Esperando jugadores...</div>

  <div class="players" id="playersList"></div>

  <button id="startBtn" class="btnGreen" onclick="startOnline()" style="display:none">
   🚀 INICIAR PARTIDA
  </button>

  <button class="btnRed" onclick="leaveLobby()">⬅ SALIR DE LA SALA</button>
 </div>
</div>

<div id="game" class="screen">
 <canvas id="canvas"></canvas>

 <div class="hud">
  <div class="hudBox">JUGADORES<br><b id="countHud">1</b></div>
  <div class="hudBox">VIDA<br><b id="lifeHud">100</b></div>
  <div class="hudBox">SALA<br><b id="roomHud">SOLO</b></div>
 </div>

 <div id="gameButtons">
  <button class="btnRed" onclick="exitGame()">☰ MENÚ</button>
 </div>

 <div id="message"></div>

 <div id="touch">
  <div id="joy"><div id="stick"></div></div>
  <button id="attack">⚡<br>ATAQUE</button>
 </div>

 <div id="resultBox">
  <h2 id="resultTitle">🏆 FIN</h2>
  <div id="resultText"></div>
  <button class="btnGreen" onclick="playAgain()">🔄 VOLVER A JUGAR</button>
  <button class="btnRed" onclick="leaveAfterGame()">🚪 SALIR DE LA SALA</button>
 </div>
</div>

<div id="connecting">
 <div>
  <div class="loader"></div>
  <h2 id="connectingText">CONECTANDO...</h2>
  <p class="small">Espera unos segundos</p>
 </div>
</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=innerWidth,H=innerHeight,DPR=1;
let peer=null,conn=null;
let isHost=false,running=false;
let roomCode="";
let myId="";
let myName="";
let players={};
let lastFrame=performance.now();
let attackPressed=false;
let onlineMode=false;
let roomReady=false;
let connectionTimeout=null;

const colors=["#ff3d81","#42e8ff","#b15cff","#ffd83d"];

function resize(){
 DPR=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 canvas.width=W*DPR;
 canvas.height=H*DPR;
 canvas.style.width=W+"px";
 canvas.style.height=H+"px";
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);
resize();

function show(id){
 document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
}

function backMenu(){
 closeConnection();
 show("menu");
}

function showOnline(){
 show("online");
 document.getElementById("onlineError").textContent="";
 document.getElementById("hostName").value=document.getElementById("nameInput").value;
}

function setConnecting(v,text="CONECTANDO..."){
 document.getElementById("connecting").style.display=v?"flex":"none";
 document.getElementById("connectingText").textContent=text;
}

function error(msg){
 document.getElementById("onlineError").textContent=msg;
 setConnecting(false);
}

function closeConnection(){
 clearTimeout(connectionTimeout);
 if(conn){
  try{conn.close()}catch(e){}
  conn=null;
 }
 if(peer){
  try{peer.destroy()}catch(e){}
  peer=null;
 }
}

function cleanName(n){
 n=(n||"Jugador").trim().slice(0,12);
 return n||"Jugador";
}

function makeRoomCode(){
 return String(Math.floor(1000+Math.random()*9000));
}

function solo(){
 myName=cleanName(document.getElementById("nameInput").value);
 onlineMode=false;
 isHost=false;
 roomCode="SOLO";
 createSoloPlayers();
 show("game");
 startGame();
}

function createSoloPlayers(){
 players={};

 players.p1={
  id:"p1",name:myName,x:W*.5,y:H*.5,
  vx:0,vy:0,hp:100,color:colors[0],
  human:true,cpu:false,last:Date.now(),angle:0
 };

 const names=["RIVAL","TORNADO","FURIA"];

 for(let i=0;i<3;i++){
  players["cpu"+i]={
   id:"cpu"+i,
   name:names[i],
   x:W*.2+i*W*.3,
   y:H*.28+(i%2)*H*.45,
   vx:0,vy:0,hp:100,
   color:colors[i+1],
   human:false,cpu:true,
   last:Date.now(),angle:Math.random()*6
  };
 }

 myId="p1";
}

function createRoom(){
 myName=cleanName(document.getElementById("hostName").value);
 document.getElementById("onlineError").textContent="";
 setConnecting(true,"CREANDO SALA...");

 closeConnection();

 isHost=true;
 onlineMode=true;
 roomReady=false;

 const code=makeRoomCode();
 roomCode=code;
 const peerId="gb"+code;

 peer=new Peer(peerId,{
  debug:0,
  config:{
   iceServers:[
    {urls:"stun:stun.l.google.com:19302"},
    {urls:"stun:global.stun.twilio.com:3478"}
   ]
  }
 });

 peer.on("open",id=>{
  clearTimeout(connectionTimeout);
  myId="host";
  players={
   host:{
    id:"host",name:myName,x:W*.5,y:H*.5,
    vx:0,vy:0,hp:100,color:colors[0],
    human:true,cpu:false,last:Date.now(),angle:0
   }
  };

  setConnecting(false);
  showLobby();
 });

 peer.on("connection",c=>{
  c.on("open",()=>{
   if(Object.keys(players).length>=4){
    c.send({type:"full"});
    setTimeout(()=>c.close(),500);
    return;
   }

   const id="p"+Date.now()+Math.random().toString(16).slice(2);

   const p={
    id,
    name:cleanName(c.metadata?.name||"Jugador"),
    x:W*.5+(Math.random()-.5)*180,
    y:H*.5+(Math.random()-.5)*180,
    vx:0,vy:0,hp:100,
    color:colors[Object.keys(players).length%colors.length],
    human:true,cpu:false,last:Date.now(),angle:Math.random()*6
   };

   c.playerId=id;
   c.playerName=p.name;
   players[id]=p;

   connections.push(c);

   c.send({
    type:"welcome",
    id,
    code:roomCode,
    players:copyPlayers()
   });

   broadcastLobby();

   c.on("data",data=>hostReceive(c,data));
   c.on("close",()=>guestDisconnected(c));
   c.on("error",()=>guestDisconnected(c));
  });
 });

 peer.on("error",e=>{
  clearTimeout(connectionTimeout);
  setConnecting(false);

  if(e.type==="unavailable-id"){
   setTimeout(createRoom,100);
   return;
  }

  error("NO SE PUDO CREAR LA SALA. INTENTA OTRA VEZ.");
 });

 connectionTimeout=setTimeout(()=>{
  if(!peer||!peer.open){
   closeConnection();
   error("EL SERVIDOR TARDÓ DEMASIADO. INTENTA DE NUEVO.");
  }
 },15000);
}

let connections=[];

function joinRoom(){
 const code=document.getElementById("roomCodeInput").value.trim();
 myName=cleanName(document.getElementById("guestName").value||document.getElementById("nameInput").value);

 document.getElementById("onlineError").textContent="";

 if(code.length!==4){
  error("ESCRIBE EXACTAMENTE 4 NÚMEROS.");
  return;
 }

 setConnecting(true,"ENTRANDO A LA SALA...");

 closeConnection();

 isHost=false;
 onlineMode=true;
 roomCode=code;
 roomReady=false;

 peer=new Peer(undefined,{
  debug:0,
  config:{
   iceServers:[
    {urls:"stun:stun.l.google.com:19302"},
    {urls:"stun:global.stun.twilio.com:3478"}
   ]
  }
 });

 peer.on("open",()=>{
  const target="gb"+code;

  conn=peer.connect(target,{
   reliable:true,
   serialization:"json",
   metadata:{name:myName}
  });

  conn.on("open",()=>{
   clearTimeout(connectionTimeout);

   conn.send({
    type:"join",
    name:myName
   });

   setConnecting(true,"SALA ENCONTRADA...");
  });

  conn.on("data",guestReceive);

  conn.on("close",()=>{
   setConnecting(false);
   if(running){
    showResult("CONEXIÓN TERMINADA","La conexión con la sala se cerró.");
   }else{
    error("LA CONEXIÓN CON LA SALA SE CERRÓ.");
   }
  });

  conn.on("error",()=>{
   setConnecting(false);
   error("NO SE PUDO CONECTAR A ESA SALA.");
  });
 });

 peer.on("error",e=>{
  clearTimeout(connectionTimeout);
  setConnecting(false);

  if(e.type==="peer-unavailable"){
   error("NO EXISTE ESA SALA. REVISA EL CÓDIGO.");
  }else{
   error("NO SE PUDO ENTRAR. INTENTA DE NUEVO.");
  }
 });

 connectionTimeout=setTimeout(()=>{
  if(!conn||!conn.open){
   closeConnection();
   error("NO SE PUDO ENTRAR A LA SALA. REVISA EL CÓDIGO.");
  }
 },15000);
}

function showLobby(){
 show("lobby");
 document.getElementById("lobbyCode").textContent=roomCode;
 renderLobby();
}

function renderLobby(){
 const list=document.getElementById("playersList");
 list.innerHTML="";

 Object.values(players).forEach((p,i)=>{
  const div=document.createElement("div");
  div.className="playerSlot ready";
  div.textContent=(i===0?"👑 ":"🎮 ")+p.name;
  list.appendChild(div);
 });

 for(let i=Object.keys(players).length;i<4;i++){
  const div=document.createElement("div");
  div.className="playerSlot";
  div.textContent="⌛ ESPERANDO...";
  list.appendChild(div);
 }

 document.getElementById("lobbyStatus").textContent=
  Object.keys(players).length>=4?
  "¡SALA COMPLETA!":
  "Esperando jugadores... "+Object.keys(players).length+"/4";

 document.getElementById("startBtn").style.display=isHost?"block":"none";
}

function hostReceive(c,data){
 if(!data)return;

 if(data.type==="join"){
  if(Object.keys(players).length>=4){
   c.send({type:"full"});
   c.close();
   return;
  }

  if(c.playerId&&players[c.playerId])return;

  const id="p"+Date.now()+Math.random().toString(16).slice(2);

  c.playerId=id;
  c.playerName=cleanName(data.name);

  players[id]={
   id,
   name:c.playerName,
   x:W*.5+(Math.random()-.5)*180,
   y:H*.5+(Math.random()-.5)*180,
   vx:0,vy:0,hp:100,
   color:colors[Object.keys(players).length%colors.length],
   human:true,cpu:false,last:Date.now(),angle:Math.random()*6
  };

  if(!connections.includes(c))connections.push(c);

  c.send({
   type:"welcome",
   id,
   code:roomCode,
   players:copyPlayers()
  });

  broadcastLobby();
 }

 if(data.type==="input"&&c.playerId&&players[c.playerId]){
  const p=players[c.playerId];

  p.last=Date.now();

  p.inputX=Math.max(-1,Math.min(1,Number(data.x)||0));
  p.inputY=Math.max(-1,Math.min(1,Number(data.y)||0));

  if(data.attack){
   p.attack=true;
  }
 }

 if(data.type==="again"){
  resetToLobby();
 }
}

function guestReceive(data){
 if(!data)return;

 if(data.type==="full"){
  setConnecting(false);
  error("LA SALA YA TIENE 4 JUGADORES.");
  closeConnection();
  return;
 }

 if(data.type==="welcome"){
  myId=data.id;
  roomCode=data.code;
  players=data.players||{};
  setConnecting(false);
  showLobby();
  return;
 }

 if(data.type==="lobby"){
  if(running)return;

  players=data.players||{};
  setConnecting(false);
  showLobby();
  return;
 }

 if(data.type==="start"){
  players=data.players||{};
  myId=data.id||myId;
  setConnecting(false);
  show("game");
  startGame();
  return;
 }

 if(data.type==="state"){
  players=data.players||players;

  if(data.finished){
   showResult(data.winner,data.message);
  }

  updateHud();
  return;
 }

 if(data.type==="result"){
  showResult(data.title,data.message);
 }
}

function broadcast(data){
 connections=connections.filter(c=>c&&c.open);

 connections.forEach(c=>{
  try{c.send(data)}catch(e){}
 });
}

function broadcastLobby(){
 if(!isHost)return;

 broadcast({
  type:"lobby",
  code:roomCode,
  players:copyPlayers()
 });

 renderLobby();
}

function startOnline(){
 if(!isHost)return;

 if(Object.keys(players).length<1)return;

 Object.values(players).forEach(p=>{
  p.hp=100;
  p.human=true;
  p.cpu=false;
  p.last=Date.now();
  p.x=W*.5+(Math.random()-.5)*Math.min(W*.45,300);
  p.y=H*.5+(Math.random()-.5)*Math.min(H*.35,220);
  p.vx=0;p.vy=0;
  p.inputX=0;p.inputY=0;
 });

 running=true;
 onlineMode=true;

 const data={
  type:"start",
  id:"",
  players:copyPlayers()
 };

 connections.forEach(c=>{
  try{
   c.send({...data,id:c.playerId});
  }catch(e){}
 });

 startGame();
}

function startGame(){
 running=true;
 document.getElementById("resultBox").style.display="none";
 show("game");

 const msg=document.getElementById("message");

 msg.textContent="3";
 msg.classList.remove("show");
 void msg.offsetWidth;
 msg.classList.add("show");

 setTimeout(()=>{
  msg.textContent="2";
  msg.classList.remove("show");
  void msg.offsetWidth;
  msg.classList.add("show");
 },700);

 setTimeout(()=>{
  msg.textContent="1";
  msg.classList.remove("show");
  void msg.offsetWidth;
  msg.classList.add("show");
 },1400);

 setTimeout(()=>{
  msg.textContent="¡YA!";
  msg.classList.remove("show");
  void msg.offsetWidth;
  msg.classList.add("show");
 },2100);
}

function copyPlayers(){
 const out={};

 Object.keys(players).forEach(id=>{
  const p=players[id];
  out[id]={
   id:p.id,name:p.name,x:p.x,y:p.y,
   vx:p.vx,vy:p.vy,hp:p.hp,
   color:p.color,human:p.human,cpu:p.cpu,
   angle:p.angle||0
  };
 });

 return out;
}

function update(dt){
 if(!running)return;

 if(isHost){
  const now=Date.now();

  Object.values(players).forEach(p=>{
   if(p.hp<=0)return;

   if(p.human&&!p.cpu&&p.id!=="host"&&now-p.last>5000){
    p.cpu=true;
    p.inputX=0;
    p.inputY=0;
   }

   if(p.human&&!p.cpu){
    let ix=p.inputX||0;
    let iy=p.inputY||0;

    if(p.id==="host"){
     ix=keyboard.x;
     iy=keyboard.y;
    }

    const len=Math.hypot(ix,iy)||1;
    p.vx+=(ix/len)*650*dt;
    p.vy+=(iy/len)*650*dt;
   }else{
    cpuMove(p,dt);
   }

   p.vx*=Math.pow(.0005,dt);
   p.vy*=Math.pow(.0005,dt);

   const speed=Math.hypot(p.vx,p.vy);
   const maxSpeed=390;

   if(speed>maxSpeed){
    p.vx=p.vx/speed*maxSpeed;
    p.vy=p.vy/speed*maxSpeed;
   }

   p.x+=p.vx*dt;
   p.y+=p.vy*dt;

   const margin=65;
   if(p.x<margin){p.x=margin;p.vx=Math.abs(p.vx)*.7}
   if(p.x>W-margin){p.x=W-margin;p.vx=-Math.abs(p.vx)*.7}
   if(p.y<margin){p.y=margin;p.vy=Math.abs(p.vy)*.7}
   if(p.y>H-margin){p.y=H-margin;p.vy=-Math.abs(p.vy)*.7}

   p.angle+=(Math.hypot(p.vx,p.vy)*dt*.025)+.05;

   if(p.attack){
    attackPlayer(p);
    p.attack=false;
   }
  });

  checkWinner();

  if(onlineMode){
   broadcast({
    type:"state",
    players:copyPlayers()
   });
  }
 }
}

function cpuMove(p,dt){
 const alive=Object.values(players).filter(x=>x!==p&&x.hp>0);
 if(!alive.length)return;

 let target=alive[Math.floor(Math.random()*alive.length)];

 let dx=target.x-p.x;
 let dy=target.y-p.y;
 let d=Math.hypot(dx,dy)||1;

 let ix=dx/d;
 let iy=dy/d;

 if(d<150){
  ix+=Math.sin(performance.now()/300+p.x)*.8;
  iy+=Math.cos(performance.now()/320+p.y)*.8;
 }

 p.vx+=ix*430*dt;
 p.vy+=iy*430*dt;

 if(d<130&&Math.random()<.09){
  attackPlayer(p);
 }
}

function attackPlayer(p){
 const enemies=Object.values(players).filter(x=>x!==p&&x.hp>0);
 if(!enemies.length)return;

 let target=null;
 let best=Infinity;

 enemies.forEach(e=>{
  const d=Math.hypot(e.x-p.x,e.y-p.y);
  if(d<best){best=d;target=e}
 });

 if(target&&best<115){
  target.hp=Math.max(0,target.hp-(8+Math.random()*7));

  const dx=target.x-p.x;
  const dy=target.y-p.y;
  const d=Math.hypot(dx,dy)||1;

  target.vx+=(dx/d)*180;
  target.vy+=(dy/d)*180;
 }
}

function checkWinner(){
 const alive=Object.values(players).filter(p=>p.hp>0);

 if(alive.length<=1){
  running=false;

  const winner=alive[0];

  const title=winner?
   "🏆 "+winner.name+" GANÓ":
   "💥 EMPATE";

  const message=winner?
   "¡El último trompo en pie es "+winner.name+"!":
   "Todos quedaron fuera.";

  if(onlineMode&&isHost){
   broadcast({
    type:"result",
    title,
    message
   });
  }

  showResult(title,message);
 }
}

function showResult(title,message){
 running=false;
 document.getElementById("resultTitle").textContent=title;
 document.getElementById("resultText").textContent=message;
 document.getElementById("resultBox").style.display="block";
}

function updateHud(){
 const alive=Object.values(players).filter(p=>p.hp>0).length;
 const me=players[myId]||players.host||players.p1;

 document.getElementById("countHud").textContent=alive;
 document.getElementById("lifeHud").textContent=me?Math.ceil(me.hp):0;
 document.getElementById("roomHud").textContent=roomCode;
}

function drawArena(){
 const cx=W/2,cy=H/2;
 const r=Math.min(W,H)*.39;

 ctx.clearRect(0,0,W,H);

 const bg=ctx.createRadialGradient(cx,cy,30,cx,cy,Math.max(W,H));
 bg.addColorStop(0,"#24265c");
 bg.addColorStop(.35,"#10143b");
 bg.addColorStop(1,"#03040c");

 ctx.fillStyle=bg;
 ctx.fillRect(0,0,W,H);

 ctx.save();

 ctx.globalAlpha=.22;
 ctx.strokeStyle="#6e7aff";
 ctx.lineWidth=1;

 const grid=55;
 for(let x=0;x<W;x+=grid){
  ctx.beginPath();
  ctx.moveTo(x,0);
  ctx.lineTo(x,H);
  ctx.stroke();
 }
 for(let y=0;y<H;y+=grid){
  ctx.beginPath();
  ctx.moveTo(0,y);
  ctx.lineTo(W,y);
  ctx.stroke();
 }

 ctx.restore();

 ctx.save();
 ctx.translate(cx,cy);

 ctx.shadowBlur=40;
 ctx.shadowColor="#5664ff";
 ctx.strokeStyle="#7b86ff";
 ctx.lineWidth=10;
 ctx.beginPath();
 ctx.arc(0,0,r,0,Math.PI*2);
 ctx.stroke();

 ctx.shadowBlur=0;
 ctx.strokeStyle="#d7dcff55";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.arc(0,0,r*.86,0,Math.PI*2);
 ctx.stroke();

 ctx.strokeStyle="#ff4ee455";
 ctx.beginPath();
 ctx.arc(0,0,r*.63,0,Math.PI*2);
 ctx.stroke();

 const grd=ctx.createRadialGradient(0,0,5,0,0,85);
 grd.addColorStop(0,"#ffffff");
 grd.addColorStop(.15,"#67eaff");
 grd.addColorStop(.45,"#675dff");
 grd.addColorStop(1,"transparent");

 ctx.fillStyle=grd;
 ctx.beginPath();
 ctx.arc(0,0,85,0,Math.PI*2);
 ctx.fill();

 ctx.restore();

 for(let i=0;i<45;i++){
  const x=(i*97+performance.now()*.01*(i%3+1))%W;
  const y=(i*53)%H;
  ctx.fillStyle="#ffffff55";
  ctx.beginPath();
  ctx.arc(x,y,(i%3)+.5,0,Math.PI*2);
  ctx.fill();
 }
}

function drawBlade(p){
 if(p.hp<=0)return;

 const x=p.x,y=p.y;
 const size=43;

 ctx.save();
 ctx.translate(x,y);
 ctx.rotate(p.angle);

 ctx.shadowColor=p.color;
 ctx.shadowBlur=25;

 const grad=ctx.createRadialGradient(0,-8,4,0,0,size);
 grad.addColorStop(0,"#ffffff");
 grad.addColorStop(.18,p.color);
 grad.addColorStop(.55,"#171a39");
 grad.addColorStop(1,"#050611");

 ctx.fillStyle=grad;

 ctx.beginPath();

 for(let i=0;i<20;i++){
  const a=i*Math.PI/10;
  const rr=i%2===0?size:size*.72;
  const px=Math.cos(a)*rr;
  const py=Math.sin(a)*rr;

  if(i===0)ctx.moveTo(px,py);
  else ctx.lineTo(px,py);
 }

 ctx.closePath();
 ctx.fill();

 ctx.shadowBlur=0;

 ctx.strokeStyle=p.color;
 ctx.lineWidth=4;
 ctx.stroke();

 ctx.fillStyle="#0a0c20";
 ctx.beginPath();
 ctx.arc(0,0,17,0,Math.PI*2);
 ctx.fill();

 ctx.strokeStyle="#ffffff";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.arc(0,0,10,0,Math.PI*2);
 ctx.stroke();

 ctx.fillStyle=p.color;
 ctx.beginPath();
 ctx.arc(0,0,5,0,Math.PI*2);
 ctx.fill();

 ctx.restore();

 const barW=75;
 const barH=7;
 const hp=Math.max(0,p.hp)/100;

 ctx.fillStyle="#090a17";
 ctx.fillRect(x-barW/2,y-size-22,barW,barH);

 ctx.fillStyle=p.color;
 ctx.fillRect(x-barW/2,y-size-22,barW*hp,barH);

 ctx.strokeStyle="#ffffff55";
 ctx.strokeRect(x-barW/2,y-size-22,barW,barH);

 ctx.textAlign="center";
 ctx.font="bold 13px Arial";
 ctx.fillStyle="#fff";
 ctx.shadowColor="#000";
 ctx.shadowBlur=5;
 ctx.fillText(p.name,x,y-size-28);
 ctx.shadowBlur=0;

 if(p.cpu){
  ctx.font="10px Arial";
  ctx.fillStyle="#bfc8ff";
  ctx.fillText("CPU",x,y+58);
 }
}

function draw(){
 drawArena();

 Object.values(players)
  .sort((a,b)=>a.y-b.y)
  .forEach(drawBlade);

 updateHud();
}

const keyboard={x:0,y:0};

addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();

 if(["w","arrowup"].includes(k))keyboard.y=-1;
 if(["s","arrowdown"].includes(k))keyboard.y=1;
 if(["a","arrowleft"].includes(k))keyboard.x=-1;
 if(["d","arrowright"].includes(k))keyboard.x=1;

 if(e.code==="Space"){
  attackPressed=true;
  sendAttack();
 }

 if(e.key==="Escape")exitGame();
});

addEventListener("keyup",e=>{
 const k=e.key.toLowerCase();

 if(["w","arrowup","s","arrowdown"].includes(k))keyboard.y=0;
 if(["a","arrowleft","d","arrowright"].includes(k))keyboard.x=0;
});

function sendAttack(){
 if(!onlineMode||isHost){
  const p=players[myId]||players.host||players.p1;
  if(p)p.attack=true;
 }else if(conn&&conn.open){
  conn.send({
   type:"input",
   x:joy.x,
   y:joy.y,
   attack:true
  });
 }
}

document.getElementById("attack").addEventListener("pointerdown",e=>{
 e.preventDefault();
 sendAttack();
});

const joy={x:0,y:0};

const joyEl=document.getElementById("joy");
const stick=document.getElementById("stick");

let joyActive=false;

function moveJoy(e){
 const r=joyEl.getBoundingClientRect();
 const cx=r.left+r.width/2;
 const cy=r.top+r.height/2;

 let dx=e.clientX-cx;
 let dy=e.clientY-cy;

 const max=43;
 const d=Math.hypot(dx,dy)||1;

 if(d>max){
  dx=dx/d*max;
  dy=dy/d*max;
 }

 stick.style.transform=`translate(${dx}px,${dy}px)`;

 joy.x=dx/max;
 joy.y=dy/max;
}

joyEl.addEventListener("pointerdown",e=>{
 joyActive=true;
 joyEl.setPointerCapture(e.pointerId);
 moveJoy(e);
});

joyEl.addEventListener("pointermove",e=>{
 if(joyActive)moveJoy(e);
});

joyEl.addEventListener("pointerup",()=>{
 joyActive=false;
 joy.x=0;
 joy.y=0;
 stick.style.transform="translate(0,0)";
});

joyEl.addEventListener("pointercancel",()=>{
 joyActive=false;
 joy.x=0;
 joy.y=0;
 stick.style.transform="translate(0,0)";
});

setInterval(()=>{
 if(!running)return;

 if(onlineMode&&!isHost&&conn&&conn.open){
  conn.send({
   type:"input",
   x:joy.x,
   y:joy.y,
   attack:false
  });
 }
},60);

function gameInput(){
 if(!onlineMode||isHost){
  const p=players[myId]||players.host||players.p1;

  if(p&&myId!=="host"){
   p.inputX=joy.x;
   p.inputY=joy.y;
  }

  if(p&&myId==="host"){
   if(Math.abs(joy.x)+Math.abs(joy.y)>.05){
    keyboard.x=joy.x;
    keyboard.y=joy.y;
   }
  }
 }
}

function leaveLobby(){
 if(isHost){
  broadcast({type:"result",title:"SALA CERRADA",message:"El anfitrión salió de la sala."});
 }

 closeConnection();
 connections=[];
 players={};
 running=false;
 onlineMode=false;
 roomCode="";
 show("menu");
}

function exitGame(){
 if(onlineMode){
  document.getElementById("resultBox").style.display="none";
  if(isHost){
   resetToLobby();
  }else{
   running=false;
   showLobby();
  }
 }else{
  running=false;
  closeConnection();
  show("menu");
 }
}

function resetToLobby(){
 running=false;

 Object.values(players).forEach(p=>{
  p.hp=100;
  p.vx=0;
  p.vy=0;
  p.cpu=false;
  p.last=Date.now();
  p.x=W*.5+(Math.random()-.5)*200;
  p.y=H*.5+(Math.random()-.5)*150;
 });

 if(isHost){
  broadcastLobby();
  showLobby();
 }
}

function playAgain(){
 document.getElementById("resultBox").style.display="none";

 if(!onlineMode){
  createSoloPlayers();
  startGame();
  return;
 }

 if(isHost){
  resetToLobby();
 }else{
  running=false;

  if(conn&&conn.open){
   conn.send({type:"again"});
  }

  showLobby();
  document.getElementById("lobbyStatus").textContent="Esperando al anfitrión...";
 }
}

function leaveAfterGame(){
 if(isHost){
  broadcast({
   type:"result",
   title:"SALA CERRADA",
   message:"El anfitrión salió de la sala."
  });
 }

 closeConnection();
 connections=[];
 players={};
 running=false;
 onlineMode=false;
 roomCode="";

 document.getElementById("resultBox").style.display="none";
 show("menu");
}

function guestDisconnected(c){
 if(!c||!c.playerId)return;

 if(players[c.playerId]){
  if(running){
   players[c.playerId].cpu=true;
   players[c.playerId].human=false;
  }else{
   delete players[c.playerId];
   connections=connections.filter(x=>x!==c);
   broadcastLobby();
  }
 }
}

function animate(t){
 const dt=Math.min((t-lastFrame)/1000,.033);
 lastFrame=t;

 gameInput();
 update(dt);
 draw();

 requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

document.getElementById("roomCodeInput").addEventListener("input",e=>{
 e.target.value=e.target.value.replace(/\D/g,"").slice(0,4);
});

document.getElementById("guestName").addEventListener("keydown",e=>{
 if(e.key==="Enter")joinRoom();
});

document.getElementById("nameInput").addEventListener("keydown",e=>{
 if(e.key==="Enter")solo();
});

window.addEventListener("beforeunload",()=>{
 try{
  if(conn)conn.close();
  if(peer)peer.destroy();
 }catch(e){}
});
</script>
