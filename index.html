<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>GUERRA BEYBLADE</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ff8dce,#7bdcff);
}

button,input{
    font-family:Arial,sans-serif;
}

/* ================= PANTALLAS ================= */

.screen{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    z-index:20;
}

.screen.active{
    display:flex;
}

/* ================= TARJETAS ================= */

.card{
    width:min(92%,500px);
    background:rgba(255,255,255,.96);
    padding:28px;
    border-radius:28px;
    text-align:center;
    box-shadow:0 15px 45px rgba(0,0,0,.25);
}

.logo{
    font-size:38px;
    font-weight:900;
    color:#ff399f;
    text-shadow:3px 3px #ffd7ec;
    margin-bottom:10px;
}

.subtitle{
    color:#666;
    margin-bottom:22px;
}

input{
    width:100%;
    padding:15px;
    border:3px solid #ff9bce;
    border-radius:15px;
    font-size:18px;
    text-align:center;
    outline:none;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:15px;
    margin:6px 0;
    border:0;
    border-radius:17px;
    font-size:18px;
    font-weight:bold;
    color:white;
    background:linear-gradient(135deg,#ff4fa7,#8d72ff);
    box-shadow:0 5px 12px rgba(0,0,0,.2);
    cursor:pointer;
}

button:active{
    transform:scale(.97);
}

.blue{
    background:linear-gradient(135deg,#4fcfff,#657dff);
}

.green{
    background:linear-gradient(135deg,#55d86a,#20b96b);
}

.gray{
    background:#777;
}

.red{
    background:linear-gradient(135deg,#ff687d,#e83c61);
}

/* ================= ONLINE ================= */

.roomCode{
    font-size:48px;
    font-weight:900;
    letter-spacing:10px;
    color:#ff399f;
    background:#ffe2f1;
    border-radius:18px;
    padding:13px;
    margin:15px 0;
}

.status{
    color:#555;
    min-height:24px;
    margin:8px 0;
}

.playersBox{
    background:#fff3f9;
    border-radius:18px;
    padding:15px;
    text-align:left;
    margin:15px 0;
}

.playerItem{
    background:white;
    padding:10px;
    border-radius:12px;
    margin:6px 0;
    font-weight:bold;
}

.hostTag{
    color:#ff3e9f;
    font-size:12px;
}

/* ================= JUEGO ================= */

#gameScreen{
    background:#65c653;
}

#canvas{
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    display:block;
}

/* ================= INFORMACIÓN ================= */

#gameUI{
    position:fixed;
    top:8px;
    left:8px;
    right:8px;
    z-index:10;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    pointer-events:none;
}

#scoreBoard{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    max-width:80%;
}

.score{
    background:rgba(255,255,255,.92);
    border-radius:12px;
    padding:6px 9px;
    min-width:95px;
}

.scoreName{
    font-size:13px;
    font-weight:bold;
}

.hpBar{
    width:85px;
    height:8px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
    margin-top:3px;
}

.hpFill{
    height:100%;
    background:#ff4f83;
}

#pauseButton{
    width:auto;
    margin:0;
    padding:9px 13px;
    font-size:14px;
    pointer-events:auto;
}

/* ================= CONTROLES ================= */

#controls{
    position:fixed;
    left:15px;
    right:15px;
    bottom:15px;
    z-index:15;
    display:none;
    justify-content:space-between;
    align-items:center;
    pointer-events:none;
}

#joystick{
    width:125px;
    height:125px;
    border-radius:50%;
    background:rgba(255,255,255,.25);
    border:3px solid rgba(255,255,255,.7);
    position:relative;
    pointer-events:auto;
    touch-action:none;
}

#knob{
    position:absolute;
    left:32px;
    top:32px;
    width:55px;
    height:55px;
    border-radius:50%;
    background:#ff4fa7;
    border:3px solid white;
}

#attackButton{
    width:100px;
    height:100px;
    border-radius:50%;
    background:linear-gradient(135deg,#ff4b9e,#ff8bc8);
    border:4px solid white;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-weight:bold;
    pointer-events:auto;
    touch-action:none;
}

/* ================= PAUSA ================= */

#pauseOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:100;
    display:none;
    justify-content:center;
    align-items:center;
}

/* ================= FINAL ================= */

#resultOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:110;
    display:none;
    justify-content:center;
    align-items:center;
}

#resultOverlay .card{
    max-width:380px;
}

#winnerText{
    font-size:27px;
    color:#ff3d9f;
    font-weight:bold;
    margin:15px 0;
}

/* ================= CELULAR ================= */

@media(max-width:700px){

    .logo{
        font-size:31px;
    }

    .card{
        padding:22px;
    }

    .roomCode{
        font-size:39px;
    }

    #scoreBoard{
        max-width:72%;
    }

    .score{
        min-width:78px;
        padding:5px;
    }

    .hpBar{
        width:68px;
    }

}

</style>
</head>

<body>

<!-- ======================================================
     MENÚ
====================================================== -->

<div id="menuScreen" class="screen active">

    <div class="card">

        <div class="logo">
            ⚡ GUERRA BEYBLADE ⚡
        </div>

        <div class="subtitle">
            ¡Haz girar tu trompo y gana la batalla!
        </div>

        <input
            id="nameInput"
            maxlength="12"
            placeholder="Escribe tu nombre"
        >

        <button onclick="startSolo()">
            🎮 JUGAR SOLO
        </button>

        <button class="blue" onclick="openOnline()">
            🌐 JUGAR ONLINE
        </button>

    </div>

</div>


<!-- ======================================================
     ONLINE
====================================================== -->

<div id="onlineScreen" class="screen">

    <div class="card">

        <div class="logo">
            🌐 ONLINE
        </div>

        <input
            id="onlineName"
            maxlength="12"
            placeholder="Tu nombre"
        >

        <button onclick="createRoom()">
            🏠 CREAR SALA
        </button>

        <div style="color:#777;margin:10px;">
            O entra a una sala
        </div>

        <input
            id="roomInput"
            maxlength="4"
            inputmode="numeric"
            placeholder="CÓDIGO DE 4 NÚMEROS"
            oninput="numbersOnly(this)"
        >

        <button class="blue" onclick="joinRoom()">
            🚀 ENTRAR A SALA
        </button>

        <div id="onlineStatus" class="status"></div>

        <button class="gray" onclick="backMenu()">
            ⬅ VOLVER
        </button>

    </div>

</div>


<!-- ======================================================
     SALA DE ESPERA
====================================================== -->

<div id="lobbyScreen" class="screen">

    <div class="card">

        <div class="logo">
            ⚔️ SALA DE BATALLA
        </div>

        <div>
            Código de reunión:
        </div>

        <div id="roomCode" class="roomCode">
            0000
        </div>

        <div id="lobbyStatus" class="status">
            Esperando jugadores...
        </div>

        <div class="playersBox">

            <b>👥 Jugadores en la sala</b>

            <div id="playerList"></div>

        </div>

        <!-- SOLO EL ANFITRIÓN VE ESTE BOTÓN -->

        <button
            id="startMatchButton"
            class="green"
            onclick="hostStartMatch()"
            style="display:none;"
        >
            ⚔️ INICIAR PARTIDA
        </button>

        <button
            class="gray"
            onclick="leaveRoom()"
        >
            🚪 SALIR DE LA SALA
        </button>

    </div>

</div>


<!-- ======================================================
     JUEGO
====================================================== -->

<div id="gameScreen" class="screen">

    <canvas id="canvas"></canvas>

    <div id="gameUI">

        <div id="scoreBoard"></div>

        <button
            id="pauseButton"
            onclick="togglePause()"
        >
            ⏸
        </button>

    </div>

    <div id="controls">

        <div id="joystick">

            <div id="knob"></div>

        </div>

        <div id="attackButton">
            ⚡<br>
            ATACAR
        </div>

    </div>

</div>


<!-- ======================================================
     PAUSA
====================================================== -->

<div id="pauseOverlay">

    <div class="card">

        <div class="logo">
            ⏸ PAUSA
        </div>

        <button onclick="togglePause()">
            ▶ CONTINUAR
        </button>

        <button onclick="returnMenu()">
            🏠 MENÚ
        </button>

    </div>

</div>


<!-- ======================================================
     RESULTADO
====================================================== -->

<div id="resultOverlay">

    <div class="card">

        <div class="logo">
            🏆 BATALLA TERMINADA
        </div>

        <div id="winnerText">
            Ganador
        </div>

        <!-- ANFITRIÓN -->

        <button
            id="hostAgainButton"
            class="green"
            onclick="hostBackToLobby()"
        >
            🔄 VOLVER A JUGAR
        </button>

        <!-- INVITADO -->

        <button
            id="guestAgainButton"
            class="green"
            onclick="guestBackToLobby()"
            style="display:none;"
        >
            🔄 VOLVER A LA SALA
        </button>

        <button
            class="red"
            onclick="leaveFromResult()"
        >
            🚪 SALIR DE LA SALA
        </button>

    </div>

</div>


<script>

/* ======================================================
   CANVAS
====================================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resizeCanvas(){

    W = innerWidth;
    H = innerHeight;

    canvas.width = W;
    canvas.height = H;

}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


/* ======================================================
   VARIABLES DE RED
====================================================== */

let peer = null;

let hostConnection = null;

let guestConnections = [];

let roomCode = "";

let isHost = false;

let myId = 0;

let myName = "Jugador";


/* ======================================================
   JUEGO
====================================================== */

let players = [];

let gameMode = "";

let gameRunning = false;

let paused = false;

let lastTime = 0;

let attackCooldown = 0;


/* ======================================================
   CONTROLES
====================================================== */

let keys = {};

let moveX = 0;

let moveY = 0;

let attackRequest = false;


/* ======================================================
   COLORES
====================================================== */

const COLORS = [
    "#ff4fa5",
    "#667dff",
    "#52d35e",
    "#ffae3d"
];


/* ======================================================
   PANTALLAS
====================================================== */

function showScreen(id){

    document
        .querySelectorAll(".screen")
        .forEach(screen=>{
            screen.classList.remove("active");
        });

    document
        .getElementById(id)
        .classList.add("active");

}


/* ======================================================
   NÚMERO
====================================================== */

function numbersOnly(input){

    input.value =
        input.value
        .replace(/[^0-9]/g,"")
        .slice(0,4);

}


/* ======================================================
   MENÚ ONLINE
====================================================== */

function openOnline(){

    const name =
        document
        .getElementById("nameInput")
        .value
        .trim();

    document
        .getElementById("onlineName")
        .value =
        name || "";

    showScreen("onlineScreen");

}


/* ======================================================
   CREAR CÓDIGO
====================================================== */

function makeRoomCode(){

    return String(
        Math.floor(
            1000 +
            Math.random()*9000
        )
    );

}


/* ======================================================
   CREAR SALA
====================================================== */

function createRoom(){

    myName =
        document
        .getElementById("onlineName")
        .value
        .trim();

    if(!myName){

        myName = "Jugador";

    }

    myName =
        myName.substring(0,12);

    isHost = true;

    gameMode = "online";

    createHostPeer(0);

}


/* ======================================================
   PEER DEL ANFITRIÓN
====================================================== */

function createHostPeer(attempt){

    if(attempt > 20){

        document
        .getElementById("onlineStatus")
        .textContent =
        "No se pudo crear la sala.";

        return;

    }

    roomCode = makeRoomCode();

    const internalId =
        "beyblade" + roomCode;


    if(peer){

        try{
            peer.destroy();
        }catch(e){}

        peer = null;

    }


    document
    .getElementById("onlineStatus")
    .textContent =
    "Creando sala...";


    peer = new Peer(
        internalId,
        {
            debug:1
        }
    );


    /* SALA LISTA */

    peer.on("open",()=>{

        players = [];

        guestConnections = [];

        addHostPlayer();


        document
        .getElementById("roomCode")
        .textContent =
        roomCode;


        document
        .getElementById("lobbyStatus")
        .textContent =
        "Comparte el código y espera a tus jugadores.";


        updateLobby();


        showScreen("lobbyScreen");

    });


    /* ENTRA UN JUGADOR */

    peer.on("connection",conn=>{

        if(
            guestConnections.length >= 3
        ){

            conn.on("open",()=>{

                conn.send({
                    type:"full"
                });

                setTimeout(()=>{
                    conn.close();
                },500);

            });

            return;

        }


        guestConnections.push(conn);

        setupGuestConnection(conn);

    });


    /* ERROR */

    peer.on("error",error=>{

        console.log("HOST ERROR",error);


        if(
            error.type === "unavailable-id"
        ){

            try{
                peer.destroy();
            }catch(e){}


            setTimeout(()=>{

                createHostPeer(
                    attempt+1
                );

            },300);

        }else{

            document
            .getElementById("onlineStatus")
            .textContent =
            "Error de conexión.";

        }

    });

}


/* ======================================================
   AGREGAR ANFITRIÓN
====================================================== */

function addHostPlayer(){

    players.push({

        id:0,

        name:myName,

        x:W/2,

        y:H/2,

        vx:0,

        vy:0,

        hp:100,

        maxHp:100,

        alive:true,

        color:COLORS[0],

        attack:false,

        input:{
            x:0,
            y:0,
            attack:false
        }

    });

    myId = 0;

}


/* ======================================================
   CONEXIÓN DE INVITADO
====================================================== */

function setupGuestConnection(conn){

    conn.on("open",()=>{

        /*
          ID del invitado:
          1, 2 o 3
        */

        const id =
            players.length;

        conn.playerId = id;


        players.push({

            id:id,

            name:"Jugador "+id,

            x:W/2,

            y:H/2,

            vx:0,

            vy:0,

            hp:100,

            maxHp:100,

            alive:true,

            color:COLORS[id],

            attack:false,

            input:{
                x:0,
                y:0,
                attack:false
            }

        });


        /*
          Le mandamos su ID.
        */

        conn.send({

            type:"welcome",

            myId:id,

            players:getLobbyData()

        });


        /*
          Actualizamos la sala
          para TODOS.
        */

        broadcastLobby();

        updateLobby();

    });


    conn.on("data",data=>{

        /* NOMBRE */

        if(data.type === "name"){

            const p =
                players.find(
                    x =>
                    x.id === conn.playerId
                );

            if(p){

                p.name =
                    String(
                        data.name ||
                        "Jugador"
                    ).substring(0,12);

                broadcastLobby();

                updateLobby();

            }

        }


        /* CONTROLES */

        if(data.type === "input"){

            const p =
                players.find(
                    x =>
                    x.id === conn.playerId
                );

            if(p){

                p.input.x =
                    Number(data.x) || 0;

                p.input.y =
                    Number(data.y) || 0;

                p.input.attack =
                    Boolean(data.attack);

            }

        }


        /* VOLVER A SALA */

        if(
            data.type ===
            "guestReady"
        ){

            broadcastLobby();

        }

    });


    conn.on("close",()=>{

        const id =
            conn.playerId;


        guestConnections =
            guestConnections.filter(
                c=>c !== conn
            );


        players =
            players.filter(
                p=>p.id !== id
            );


        broadcastLobby();

        updateLobby();

    });

}


/* ======================================================
   DATOS DE LA SALA
====================================================== */

function getLobbyData(){

    return players.map(p=>({

        id:p.id,

        name:p.name,

        color:p.color

    }));

}


/* ======================================================
   ENVIAR SALA
====================================================== */

function broadcastLobby(){

    if(!isHost)return;


    const message = {

        type:"lobby",

        players:getLobbyData()

    };


    guestConnections.forEach(conn=>{

        if(conn.open){

            try{

                conn.send(message);

            }catch(e){}

        }

    });

}


/* ======================================================
   UNIRSE
====================================================== */

function joinRoom(){

    const code =
        document
        .getElementById("roomInput")
        .value
        .replace(/[^0-9]/g,"");


    if(code.length !== 4){

        document
        .getElementById("onlineStatus")
        .textContent =
        "Escribe exactamente 4 números.";

        return;

    }


    myName =
        document
        .getElementById("onlineName")
        .value
        .trim();


    if(!myName){

        myName = "Jugador";

    }


    myName =
        myName.substring(0,12);


    roomCode = code;

    isHost = false;

    gameMode = "online";


    if(peer){

        try{
            peer.destroy();
        }catch(e){}

    }


    document
    .getElementById("onlineStatus")
    .textContent =
    "Conectando...";


    /*
      El invitado crea su Peer.
    */

    peer =
        new Peer({
            debug:1
        });


    peer.on("open",()=>{

        /*
          Conecta con:

          beyblade + código

          Ejemplo:
          beyblade4827
        */

        hostConnection =
            peer.connect(
                "beyblade"+roomCode,
                {
                    reliable:true
                }
            );


        hostConnection.on("open",()=>{

            /*
              Mandamos nuestro nombre.
            */

            hostConnection.send({

                type:"name",

                name:myName

            });


            document
            .getElementById("roomCode")
            .textContent =
            roomCode;


            document
            .getElementById("lobbyStatus")
            .textContent =
            "Conectado. Esperando al anfitrión...";


            showScreen("lobbyScreen");

        });


        hostConnection.on("data",data=>{

            /* SALA LLENA */

            if(data.type === "full"){

                document
                .getElementById("lobbyStatus")
                .textContent =
                "❌ La sala está llena.";

                return;

            }


            /* BIENVENIDA */

            if(
                data.type ===
                "welcome"
            ){

                myId =
                    data.myId;

                players =
                    createLobbyPlayers(
                        data.players
                    );

                updateLobby();

            }


            /* ACTUALIZAR SALA */

            if(
                data.type ===
                "lobby"
            ){

                players =
                    createLobbyPlayers(
                        data.players
                    );

                updateLobby();

            }


            /* TODOS COMIENZAN */

            if(
                data.type ===
                "startGame"
            ){

                myId =
                    data.myId;

                players =
                    data.players;

                startOnline();

            }


            /* ESTADO */

            if(
                data.type ===
                "state"
            ){

                players =
                    data.players;

            }


            /* PAUSA */

            if(
                data.type ===
                "pause"
            ){

                paused =
                    data.paused;

            }


            /* VOLVER A SALA */

            if(
                data.type ===
                "backLobby"
            ){

                gameRunning = false;

                document
                .getElementById(
                    "resultOverlay"
                )
                .style.display =
                "none";


                players =
                    createLobbyPlayers(
                        data.players
                    );


                updateLobby();


                showScreen(
                    "lobbyScreen"
                );

            }


            /* GANADOR */

            if(
                data.type ===
                "winner"
            ){

                gameRunning = false;

                players =
                    data.players;

                showResult(
                    data.winner
                );

            }

        });


        hostConnection.on("close",()=>{

            gameRunning = false;

            document
            .getElementById("lobbyStatus")
            .textContent =
            "❌ El anfitrión salió de la sala.";

        });

    });


    peer.on("error",error=>{

        console.log(
            "GUEST ERROR",
            error
        );


        document
        .getElementById("onlineStatus")
        .textContent =
        "❌ No se encontró esa sala.";

    });

}


/* ======================================================
   CREAR JUGADORES DEL LOBBY
====================================================== */

function createLobbyPlayers(list){

    return list.map(p=>({

        id:p.id,

        name:p.name,

        x:W/2,

        y:H/2,

        vx:0,

        vy:0,

        hp:100,

        maxHp:100,

        alive:true,

        color:p.color,

        attack:false,

        input:{
            x:0,
            y:0,
            attack:false
        }

    }));

}


/* ======================================================
   MOSTRAR LOBBY
====================================================== */

function updateLobby(){

    const box =
        document
        .getElementById(
            "playerList"
        );


    box.innerHTML = "";


    players.forEach(p=>{

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "playerItem";


        if(p.id === 0){

            div.innerHTML =
                "👑 "+
                p.name+
                ' <span class="hostTag">(ANFITRIÓN)</span>';

        }else{

            div.innerHTML =
                "⚡ "+
                p.name;

        }


        box.appendChild(div);

    });


    /*
      BOTÓN DEL ANFITRIÓN
    */

    if(isHost){

        document
        .getElementById(
            "lobbyStatus"
        )
        .textContent =
        players.length+
        "/4 jugadores en la sala";


        document
        .getElementById(
            "startMatchButton"
        )
        .style.display =
        players.length >= 2
        ? "block"
        : "none";

    }else{

        document
        .getElementById(
            "startMatchButton"
        )
        .style.display =
        "none";


        document
        .getElementById(
            "lobbyStatus"
        )
        .textContent =
        "👑 Esperando al anfitrión para iniciar...";

    }

}


/* ======================================================
   ANFITRIÓN INICIA
====================================================== */

function hostStartMatch(){

    if(!isHost)return;


    if(players.length < 2){

        alert(
            "Necesitas al menos 2 jugadores."
        );

        return;

    }


    preparePlayers();


    /*
      A CADA JUGADOR LE MANDAMOS
      SU PROPIO ID.
    */

    guestConnections.forEach(conn=>{

        if(conn.open){

            conn.send({

                type:"startGame",

                myId:conn.playerId,

                players:players

            });

        }

    });


    /*
      EL HOST TAMBIÉN ENTRA.
    */

    startOnline();

}


/* ======================================================
   PREPARAR PARTIDA
====================================================== */

function preparePlayers(){

    const radius =
        Math.min(W,H)*.28;


    players.forEach((p,i)=>{

        const angle =
            (Math.PI*2/players.length)*i;


        p.x =
            W/2+
            Math.cos(angle)*radius;


        p.y =
            H/2+
            Math.sin(angle)*radius;


        p.vx=0;
        p.vy=0;

        p.hp=100;

        p.maxHp=100;

        p.alive=true;

        p.attack=false;


        p.input={
            x:0,
            y:0,
            attack:false
        };

    });

}


/* ======================================================
   START ONLINE
====================================================== */

function startOnline(){

    gameRunning = true;

    paused = false;

    attackCooldown = 0;


    document
    .getElementById(
        "resultOverlay"
    )
    .style.display =
    "none";


    document
    .getElementById(
        "controls"
    )
    .style.display =
    "flex";


    showScreen("gameScreen");


    lastTime =
        performance.now();


    requestAnimationFrame(
        gameLoop
    );

}


/* ======================================================
   JUGAR SOLO
====================================================== */

function startSolo(){

    myName =
        document
        .getElementById(
            "nameInput"
        )
        .value
        .trim();


    if(!myName){

        myName =
            "Jugador";

    }


    myName =
        myName.substring(
            0,12
        );


    gameMode =
        "solo";


    isHost = true;


    players=[];


    addHostPlayer();


    for(
        let i=1;
        i<4;
        i++
    ){

        players.push({

            id:i,

            name:"CPU "+i,

            x:W/2,

            y:H/2,

            vx:0,

            vy:0,

            hp:100,

            maxHp:100,

            alive:true,

            color:COLORS[i],

            attack:false,

            input:{
                x:0,
                y:0,
                attack:false
            },

            cpu:true

        });

    }


    preparePlayers();


    gameRunning=true;

    paused=false;


    document
    .getElementById(
        "controls"
    )
    .style.display =
    "flex";


    showScreen(
        "gameScreen"
    );


    lastTime =
        performance.now();


    requestAnimationFrame(
        gameLoop
    );

}


/* ======================================================
   GAME LOOP
====================================================== */

function gameLoop(time){

    if(!gameRunning)return;


    const dt =
        Math.min(
            (time-lastTime)/16.67,
            2
        );


    lastTime=time;


    if(!paused){

        updateLocalControl();


        if(gameMode==="solo"){

            updateSolo(dt);

        }else{

            if(isHost){

                updateHostOnline(dt);

            }

        }


        draw();

        updateScore();

    }


    requestAnimationFrame(
        gameLoop
    );

}


/* ======================================================
   CONTROL DEL JUGADOR
====================================================== */

function updateLocalControl(){

    let x=moveX;

    let y=moveY;


    if(
        keys["arrowleft"]||
        keys["a"]
    ){
        x-=1;
    }


    if(
        keys["arrowright"]||
        keys["d"]
    ){
        x+=1;
    }


    if(
        keys["arrowup"]||
        keys["w"]
    ){
        y-=1;
    }


    if(
        keys["arrowdown"]||
        keys["s"]
    ){
        y+=1;
    }


    const len =
        Math.hypot(x,y);


    if(len>1){

        x/=len;
        y/=len;

    }


    const p =
        players.find(
            p=>p.id===myId
        );


    if(!p)return;


    p.input.x=x;

    p.input.y=y;


    if(attackRequest){

        p.input.attack=true;

        attackRequest=false;

    }


    /*
      INVITADO MANDA SUS CONTROLES
      AL HOST CONSTANTEMENTE.
    */

    if(
        !isHost &&
        hostConnection &&
        hostConnection.open
    ){

        hostConnection.send({

            type:"input",

            x:x,

            y:y,

            attack:p.input.attack

        });


        /*
          No dejamos el ataque
          activado permanentemente.
        */

        p.input.attack=false;

    }

}


/* ======================================================
   UPDATE HOST
====================================================== */

function updateHostOnline(dt){

    players.forEach(p=>{

        if(!p.alive)return;

        movePlayer(
            p,
            dt
        );

    });


    doCombat();


    const alive =
        players.filter(
            p=>p.alive
        );


    if(alive.length<=1){

        finishOnline(
            alive.length
            ? alive[0].name
            : "Nadie"
        );

        return;

    }


    broadcastGameState();

}


/* ======================================================
   UPDATE SOLO
====================================================== */

function updateSolo(dt){

    players.forEach(p=>{

        if(!p.alive)return;


        if(p.cpu){

            cpuMove(p);

        }


        movePlayer(
            p,
            dt
        );

    });


    doCombat();


    const alive =
        players.filter(
            p=>p.alive
        );


    if(alive.length<=1){

        gameRunning=false;

        showResult(
            alive.length
            ? alive[0].name
            : "Nadie"
        );

    }

}


/* ======================================================
   MOVER
====================================================== */

function movePlayer(p,dt){

    let x =
        Number(p.input.x)||0;

    let y =
        Number(p.input.y)||0;


    const len =
        Math.hypot(x,y);


    if(len>1){

        x/=len;
        y/=len;

    }


    p.vx += x*.78;

    p.vy += y*.78;


    p.vx *= .91;

    p.vy *= .91;


    const speed =
        Math.hypot(
            p.vx,
            p.vy
        );


    if(speed>6){

        p.vx =
            p.vx/speed*6;

        p.vy =
            p.vy/speed*6;

    }


    p.x += p.vx*dt;

    p.y += p.vy*dt;


    const r=31;


    if(p.x<r){

        p.x=r;

        p.vx*=-.5;

    }


    if(p.x>W-r){

        p.x=W-r;

        p.vx*=-.5;

    }


    if(p.y<r){

        p.y=r;

        p.vy*=-.5;

    }


    if(p.y>H-r){

        p.y=H-r;

        p.vy*=-.5;

    }

}


/* ======================================================
   CPU
====================================================== */

function cpuMove(p){

    const enemies =
        players.filter(
            e =>
            e.id!==p.id &&
            e.alive
        );


    if(!enemies.length)return;


    let target =
        enemies[0];


    let closest =
        Infinity;


    enemies.forEach(e=>{

        const d =
            Math.hypot(
                e.x-p.x,
                e.y-p.y
            );


        if(d<closest){

            closest=d;

            target=e;

        }

    });


    const dx =
        target.x-p.x;

    const dy =
        target.y-p.y;


    const d =
        Math.hypot(
            dx,dy
        )||1;


    if(d>75){

        p.input.x =
            dx/d;

        p.input.y =
            dy/d;

    }else{

        p.input.x =
            -dy/d;

        p.input.y =
            dx/d;


        if(
            Math.random()<.08
        ){

            p.input.attack=true;

        }

    }

}


/* ======================================================
   COMBATE
====================================================== */

function doCombat(){

    if(attackCooldown>0){

        attackCooldown--;

    }


    players.forEach(p=>{

        if(
            !p.alive
        )return;


        if(
            p.input.attack &&
            attackCooldown<=0
        ){

            performAttack(p);

            p.input.attack=false;

        }

    });


    /* EMPUJONES */

    for(
        let i=0;
        i<players.length;
        i++
    ){

        for(
            let j=i+1;
            j<players.length;
            j++
        ){

            const a=players[i];

            const b=players[j];


            if(
                !a.alive||
                !b.alive
            )continue;


            const dx =
                b.x-a.x;

            const dy =
                b.y-a.y;


            const d =
                Math.hypot(
                    dx,dy
                );


            if(d<55){

                const nx =
                    dx/(d||1);

                const ny =
                    dy/(d||1);


                a.vx -= nx*.5;
                a.vy -= ny*.5;

                b.vx += nx*.5;
                b.vy += ny*.5;

            }

        }

    }

}


/* ======================================================
   ATAQUE
====================================================== */

function performAttack(p){

    attackCooldown=8;

    p.attack=true;


    setTimeout(()=>{

        p.attack=false;

    },130);


    players.forEach(enemy=>{

        if(
            enemy===p||
            !enemy.alive
        )return;


        const dx =
            enemy.x-p.x;

        const dy =
            enemy.y-p.y;


        const d =
            Math.hypot(
                dx,dy
            );


        if(d<72){

            enemy.hp -= 15;


            const nx =
                dx/(d||1);

            const ny =
                dy/(d||1);


            enemy.vx += nx*5;

            enemy.vy += ny*5;


            if(
                enemy.hp<=0
            ){

                enemy.hp=0;

                enemy.alive=false;

            }

        }

    });

}


/* ======================================================
   ENVIAR ESTADO
====================================================== */

function broadcastGameState(){

    const data={

        type:"state",

        players:players

    };


    guestConnections.forEach(conn=>{

        if(conn.open){

            try{

                conn.send(data);

            }catch(e){}

        }

    });

}


/* ======================================================
   TERMINAR ONLINE
====================================================== */

function finishOnline(winner){

    gameRunning=false;


    guestConnections.forEach(conn=>{

        if(conn.open){

            conn.send({

                type:"winner",

                winner:winner,

                players:players

            });

        }

    });


    showResult(
        winner
    );

}

    )

        "guestAgainButton"
    )
    .style.display =

    ? "none"
    : "block";

}


/* ======================================================
   ANFITRIÓN VOLVER A JUGAR
====================================================== */

function hostBackToLobby(){

    if(!isHost)return;


    document
    .getElementById(
        "resultOverlay"
    )
    .style.display =
    "none";


    /*
      Reiniciamos los jugadores
      pero NO cerramos las conexiones.
    */

    players.forEach(p=>{

        p.hp=100;

        p.alive=true;

        p.attack=false;

            y:0,

        };

   SALIR DE SALA

function leaveRoom(){

    document
    .getElementById(
        "resultOverlay"
    )
    .style.display =

    document

        "controls"

/* ======================================================
   PAUSA
====================================================== */

function togglePause(){

    if(!gameRunning)return;


    /*
      En online solamente
      el anfitrión puede pausar.
    */

    if(
        gameMode==="online" &&
        !isHost
    ){

        return;

    }


    paused =
        !paused;


    document
    .getElementById(
        "pauseOverlay"
    )
    .style.display =
    paused
    ? "flex"
    : "none";


    /*
      Avisamos a los celulares.
    */

    if(
        gameMode==="online" &&
        isHost
    ){

        guestConnections.forEach(conn=>{

            if(conn.open){

                conn.send({

                    type:"pause",

                    paused:paused

                });

            }

        });

    }

}

window.addEventListener(

            e.key.toLowerCase()

        if(e.key===" "){

);

/* ======================================================
   JOYSTICK
====================================================== */

const joystick =
    document.getElementById(
        "joystick"
    );

const knob =
    document.getElementById(
        "knob"
    );


let joystickActive=false;


function moveJoystick(e){

    if(!joystickActive)return;


    e.preventDefault();


    const touch =
        e.touches[0];


    const rect =
        joystick.getBoundingClientRect();


    const centerX =
        rect.left+
        rect.width/2;


    const centerY =
        rect.top+
        rect.height/2;


    let dx =
        touch.clientX-
        centerX;


    let dy =
        touch.clientY-
        centerY;


    const max=42;


    const len =
        Math.hypot(
            dx,dy
        );


    if(len>max){

        dx =
            dx/len*max;

        dy =
            dy/len*max;

    }


    knob.style.left =
        (32+dx)+"px";


    knob.style.top =
        (32+dy)+"px";


    moveX =
        dx/max;

    moveY =
        dy/max;

}


joystick.addEventListener(
    "touchstart",
    e=>{

        joystickActive=true;

        moveJoystick(e);

    },
    {passive:false}
);


joystick.addEventListener(
    "touchmove",
    e=>{

        moveJoystick(e);

    },
    {passive:false}
);


joystick.addEventListener(
    "touchend",
    e=>{

        joystickActive=false;

        moveX=0;

        moveY=0;


        knob.style.left="32px";

        knob.style.top="32px";

    },
    {passive:false}
);


/* ======================================================
   BOTÓN ATAQUE
====================================================== */

document
.getElementById("attackButton")
.addEventListener(
    "touchstart",
    e=>{

        e.preventDefault();

        attackRequest=true;

    },

/* ======================================================
   DIBUJAR
====================================================== */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /* PISO */

    ctx.fillStyle =
        "#69c858";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* CUADRÍCULA */

    ctx.strokeStyle =
        "rgba(255,255,255,.10)";

    ctx.lineWidth=2;


    for(
        let x=0;
        x<W;
        x+=50
    ){

        ctx.beginPath();

        ctx.moveTo(x,0);

        ctx.lineTo(x,H);

        ctx.stroke();

    }


    for(
        let y=0;
        y<H;
        y+=50
    ){

        ctx.beginPath();

        ctx.moveTo(0,y);

        ctx.lineTo(W,y);

        ctx.stroke();

    }


    /* ARENA */

    const radius =
        Math.min(W,H)*.42;


    ctx.beginPath();

    ctx.arc(
        W/2,
        H/2,
        radius,
        0,
        Math.PI*2
    );


    ctx.fillStyle =
        "#91df6d";

    ctx.fill();


    ctx.strokeStyle =
        "white";

    ctx.lineWidth=7;

    ctx.stroke();


    /* TROMPOS */

    players.forEach(p=>{

        if(p.alive){

            drawTrompo(p);

        }

    });

}


/* ======================================================
   TROMPO
====================================================== */

function drawTrompo(p){

    ctx.save();


    ctx.translate(
        p.x,
        p.y
    );


    ctx.rotate(
        performance.now()/75+
        p.id
    );


    /* SOMBRA */

    ctx.beginPath();

    ctx.ellipse(
        0,
        9,
        31,
        13,
        0,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        "rgba(0,0,0,.18)";

    ctx.fill();


    /* CUERPO */

    ctx.beginPath();

    ctx.moveTo(
        0,-34
    );

    ctx.lineTo(
        25,-11
    );

    ctx.lineTo(
        30,10
    );

    ctx.lineTo(
        15,29
    );

    ctx.lineTo(
        0,34
    );

    ctx.lineTo(
        -15,29
    );

    ctx.lineTo(
        -30,10
    );

    ctx.lineTo(
        -25,-11
    );

    ctx.closePath();


    ctx.fillStyle =
        p.color;

    ctx.fill();


    ctx.strokeStyle =
        "white";

    ctx.lineWidth=3;

    ctx.stroke();


    /* CENTRO */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        10,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        "white";

    ctx.fill();


    ctx.restore();


    /* ATAQUE */

    if(p.attack){

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            48,
            0,
            Math.PI*2
        );

        ctx.strokeStyle =
            "white";

        ctx.lineWidth=5;

        ctx.stroke();

    }


    /* NOMBRE */

    ctx.fillStyle =
        "white";

    ctx.font =
        "bold 13px Arial";

    ctx.textAlign =
        "center";


    ctx.fillText(
        p.name,
        p.x,
        p.y-45
    );

}


/* ======================================================
   MARCADOR
====================================================== */

function updateScore(){

    const board =
        document.getElementById(
            "scoreBoard"
        );


    board.innerHTML="";


    players.forEach(p=>{

        if(!p.alive)return;


        const div =
            document.createElement(
                "div"
            );


        div.className =
            "score";


        div.innerHTML = `

            <div class="scoreName">
                ${p.name}
            </div>

            <div class="hpBar">

                <div
                    class="hpFill"
                    style="width:${p.hp}%"
                ></div>

            </div>

        `;


        board.appendChild(div);

    });

}


/* ======================================================
   VOLVER AL MENÚ
====================================================== */

function backMenu(){

    cleanupNetwork();

    showScreen(
        "menuScreen"
    );

}


/* ======================================================
   LIMPIAR RED
====================================================== */

function cleanupNetwork(){

    gameRunning=false;

    paused=false;


    if(hostConnection){

        try{

            hostConnection.close();

        }catch(e){}

        hostConnection=null;

    }


    guestConnections.forEach(conn=>{

        try{

            conn.close();

        }catch(e){}

    });


    guestConnections=[];


    if(peer){

        try{

            peer.destroy();

        }catch(e){}

        peer=null;

    }


    players=[];

    isHost=false;

}


/* ======================================================
   MENÚ
====================================================== */

function returnMenu(){

    cleanupNetwork();

    document
    .getElementById(
        "pauseOverlay"
    )
    .style.display =
    "none";


    document
    .getElementById(
        "resultOverlay"
    )
    .style.display =
    "none";


    document
    .getElementById(
        "controls"
    )
    .style.display =
    "none";


    showScreen(
        "menuScreen"
    );

}
