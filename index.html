<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GUERRA BEYBLADE</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ff9edb,#8edbff);
}

.screen{
    width:100vw;
    height:100vh;
    display:none;
    justify-content:center;
    align-items:center;
}

.screen.active{
    display:flex;
}

.menu{
    width:min(92%,500px);
    padding:30px;
    border-radius:30px;
    background:rgba(255,255,255,.92);
    box-shadow:0 10px 40px rgba(0,0,0,.25);
    text-align:center;
}

h1{
    margin:0 0 10px;
    font-size:42px;
    color:#ff3fa4;
    text-shadow:3px 3px 0 #ffd8ef;
}

h2{
    color:#ff4ca8;
}

.subtitle{
    color:#555;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:15px;
    border:3px solid #ff9ed1;
    border-radius:15px;
    font-size:18px;
    text-align:center;
    outline:none;
    margin-bottom:12px;
}

button{
    width:100%;
    padding:15px;
    margin:7px 0;
    border:0;
    border-radius:18px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(135deg,#ff69b4,#9b7cff);
    color:white;
    box-shadow:0 5px 12px rgba(0,0,0,.2);
}

button:active{
    transform:scale(.97);
}

.secondary{
    background:linear-gradient(135deg,#6bdcff,#6f8cff);
}

.back{
    background:#777;
}

#game{
    position:fixed;
    inset:0;
    background:#71c95b;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#topUI{
    position:fixed;
    top:10px;
    left:10px;
    right:10px;
    z-index:5;
    display:none;
    justify-content:space-between;
    align-items:flex-start;
    pointer-events:none;
}

.playerBox{
    background:rgba(255,255,255,.88);
    border-radius:15px;
    padding:8px 12px;
    min-width:130px;
    box-shadow:0 3px 10px rgba(0,0,0,.2);
}

.playerName{
    font-weight:bold;
    font-size:15px;
}

.hpBar{
    width:120px;
    height:10px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
    margin-top:4px;
}

.hp{
    height:100%;
    background:#ff4f87;
    width:100%;
}

#pauseBtn{
    pointer-events:auto;
    width:auto;
    padding:10px 15px;
    margin:0;
    font-size:14px;
}

#pauseMenu{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:20;
    display:none;
    justify-content:center;
    align-items:center;
}

#pauseMenu .menu{
    max-width:350px;
}

#onlineLobby{
    width:min(92%,520px);
    padding:30px;
    border-radius:30px;
    background:rgba(255,255,255,.94);
    text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.25);
}

.roomCode{
    font-size:52px;
    font-weight:bold;
    letter-spacing:10px;
    color:#ff3fa4;
    background:#ffe3f2;
    border-radius:20px;
    padding:15px;
    margin:15px 0;
}

#playersList{
    text-align:left;
    background:#f7f7f7;
    border-radius:15px;
    padding:15px;
    margin:15px 0;
    min-height:70px;
}

.status{
    color:#555;
    font-size:14px;
    min-height:22px;
}

.controls{
    position:fixed;
    bottom:20px;
    left:20px;
    right:20px;
    display:none;
    justify-content:space-between;
    z-index:10;
    pointer-events:none;
}

.joystick{
    width:120px;
    height:120px;
    border-radius:50%;
    background:rgba(255,255,255,.35);
    border:3px solid rgba(255,255,255,.7);
    position:relative;
    pointer-events:auto;
}

.stick{
    position:absolute;
    width:55px;
    height:55px;
    left:30px;
    top:30px;
    border-radius:50%;
    background:rgba(255,105,180,.8);
}

.attackBtn{
    width:100px;
    height:100px;
    border-radius:50%;
    background:linear-gradient(135deg,#ff4f9a,#ff8bce);
    border:4px solid white;
    font-size:17px;
    pointer-events:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-weight:bold;
}

@media(max-width:600px){
    h1{
        font-size:32px;
    }

    .menu{
        padding:22px;
    }

    .roomCode{
        font-size:40px;
    }
}
</style>
</head>

<body>

<!-- ================= MENÚ ================= -->

<div id="menuScreen" class="screen active">
    <div class="menu">
        <h1>⚡ GUERRA BEYBLADE ⚡</h1>
        <div class="subtitle">¡Haz girar tu trompo y gana la batalla!</div>

        <input id="playerName" maxlength="12" placeholder="Escribe tu nombre">

        <button onclick="startSolo()">🎮 JUGAR SOLO</button>
        <button class="secondary" onclick="showOnline()">🌐 ONLINE</button>
    </div>
</div>

<!-- ================= ONLINE ================= -->

<div id="onlineScreen" class="screen">
    <div class="menu">
        <h1>🌐 ONLINE</h1>

        <input id="onlineName" maxlength="12" placeholder="Tu nombre">

        <button onclick="createRoom()">🏠 CREAR SALA</button>

        <div style="margin:15px 0;color:#777;">o</div>

        <input
            id="roomInput"
            maxlength="4"
            inputmode="numeric"
            pattern="[0-9]{4}"
            placeholder="CÓDIGO DE 4 NÚMEROS"
            oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,4)"
        >

        <button class="secondary" onclick="joinRoom()">🚀 UNIRSE</button>

        <div id="onlineStatus" class="status"></div>

        <button class="back" onclick="backToMenu()">⬅ VOLVER</button>
    </div>
</div>

<!-- ================= LOBBY ================= -->

<div id="lobbyScreen" class="screen">
    <div id="onlineLobby">
        <h1>⚡ SALA DE BATALLA ⚡</h1>

        <div>Comparte este código:</div>

        <div id="roomCode" class="roomCode">0000</div>

        <div id="lobbyStatus" class="status">
            Esperando jugadores...
        </div>

        <div id="playersList">
            <b>Jugadores:</b>
            <div id="playerListText">1. Tú</div>
        </div>

        <button id="startOnlineBtn" onclick="startOnlineGame()" style="display:none">
            ⚔️ COMENZAR BATALLA
        </button>

        <button class="back" onclick="leaveOnline()">⬅ SALIR</button>
    </div>
</div>

<!-- ================= JUEGO ================= -->

<div id="game">

<canvas id="canvas"></canvas>

<div id="topUI">
    <div id="playersUI"></div>

    <button id="pauseBtn" onclick="togglePause()">⏸ PAUSA</button>
</div>

<div class="controls" id="mobileControls">

    <div class="joystick" id="joystick">
        <div class="stick" id="stick"></div>
    </div>

    <div class="attackBtn" id="attackButton">
        ⚡<br>ATACAR
    </div>

</div>

</div>

<!-- ================= PAUSA ================= -->

<div id="pauseMenu">
    <div class="menu">
        <h1>⏸ PAUSA</h1>

        <button onclick="togglePause()">▶ CONTINUAR</button>

        <button onclick="restartCurrentMode()">
            🔄 REINICIAR
        </button>

        <button class="back" onclick="returnToMenu()">
            🏠 MENÚ
        </button>
    </div>
</div>

<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W=window.innerWidth;
let H=window.innerHeight;

canvas.width=W;
canvas.height=H;

window.addEventListener("resize",()=>{
    W=window.innerWidth;
    H=window.innerHeight;
    canvas.width=W;
    canvas.height=H;
});

/* =========================================================
   VARIABLES
========================================================= */

let gameRunning=false;
let paused=false;
let mode="solo";

let players=[];
let localPlayerId=0;

let peer=null;
let hostConnection=null;
let connections=[];

let isHost=false;

let roomCode="";
let localName="Jugador";

let lastTime=0;
let attackCooldown=0;

let keys={};

let touchX=0;
let touchY=0;
let touching=false;

/* =========================================================
   COLORES
========================================================= */

const colors=[
    "#ff4f9a",
    "#6f8cff",
    "#7ee35c",
    "#ffb84d"
];

/* =========================================================
   PANTALLAS
========================================================= */

function showScreen(id){

    document.querySelectorAll(".screen").forEach(s=>{
        s.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");
}

function backToMenu(){

    cleanupNetwork();

    showScreen("menuScreen");
}

function showOnline(){

    const name=document.getElementById("playerName").value.trim();

    if(name){
        document.getElementById("onlineName").value=name;
    }

    showScreen("onlineScreen");
}

function returnToMenu(){

    gameRunning=false;
    paused=false;

    document.getElementById("pauseMenu").style.display="none";
    document.getElementById("topUI").style.display="none";
    document.getElementById("mobileControls").style.display="none";

    cleanupNetwork();

    showScreen("menuScreen");
}

/* =========================================================
   NOMBRES
========================================================= */

function getPlayerName(){

    let n=document.getElementById("playerName").value.trim();

    if(!n){
        n="Jugador";
    }

    return n.substring(0,12);
}

/* =========================================================
   GENERAR CÓDIGO
========================================================= */

function generateRoomCode(){

    return String(
        Math.floor(1000+Math.random()*9000)
    );
}

/* =========================================================
   CREAR SALA ONLINE
========================================================= */

function createRoom(){

    localName=document.getElementById("onlineName").value.trim();

    if(!localName){
        localName="Jugador";
    }

    localName=localName.substring(0,12);

    isHost=true;

    connections=[];

    tryCreateRoom(0);
}

/* =========================================================
   CREAR PEER DEL HOST
========================================================= */

function tryCreateRoom(attempt){

    if(attempt>15){

        document.getElementById("onlineStatus").textContent=
            "No se pudo crear la sala. Intenta nuevamente.";

        return;
    }

    roomCode=generateRoomCode();

    document.getElementById("onlineStatus").textContent=
        "Creando sala...";

    /*
       El jugador solamente verá 4 números.

       El PeerJS ID real queda oculto:
       beyblade4827
    */

    const peerId="beyblade"+roomCode;

    if(peer){
        try{
            peer.destroy();
        }catch(e){}
    }

    peer=new Peer(peerId,{
        debug:1
    });

    peer.on("open",id=>{

        console.log("Sala creada:",roomCode);

        players=[];

        addHostPlayer();

        document.getElementById("roomCode").textContent=roomCode;

        document.getElementById("lobbyStatus").textContent=
            "Comparte el código con tus amigos.";

        updateLobby();

        showScreen("lobbyScreen");
    });

    peer.on("connection",conn=>{

        if(connections.length>=3){

            conn.on("open",()=>{
                conn.send({
                    type:"full"
                });

                setTimeout(()=>{
                    conn.close();
                },500);
            });

            return;
        }

        connections.push(conn);

        setupHostConnection(conn);

        updateLobby();
    });

    peer.on("error",err=>{

        console.log("Peer error:",err);

        /*
          Si el código ya está ocupado,
          generamos otro código de 4 números.
        */

        if(err.type==="unavailable-id"){

            try{
                peer.destroy();
            }catch(e){}

            setTimeout(()=>{
                tryCreateRoom(attempt+1);
            },300);

        }else{

            document.getElementById("onlineStatus").textContent=
                "Error de conexión. Intenta otra vez.";
        }

    });

}

/* =========================================================
   HOST
========================================================= */

function addHostPlayer(){

    players.push({
        id:0,
        name:localName,
        x:W/2,
        y:H/2,
        vx:0,
        vy:0,
        hp:100,
        maxHp:100,
        color:colors[0],
        alive:true,
        attack:false,
        input:{
            x:0,
            y:0,
            attack:false
        },
        cpu:false
    });

    localPlayerId=0;
}

/* =========================================================
   CONEXIÓN HOST
========================================================= */

function setupHostConnection(conn){

    conn.on("open",()=>{

        const id=players.length;

        conn.playerId=id;

        players.push({

            id:id,

            name:"Jugador "+(id+1),

            x:100+Math.random()*(W-200),

            y:100+Math.random()*(H-200),

            vx:0,

            vy:0,

            hp:100,

            maxHp:100,

            color:colors[id],

            alive:true,

            attack:false,

            input:{
                x:0,
                y:0,
                attack:false
            },

            cpu:false
        });

        conn.send({

            type:"welcome",

            id:id,

            players:players.map(p=>({
                id:p.id,
                name:p.name,
                color:p.color
            }))
        });

        updateLobby();
    });

    conn.on("data",data=>{

        if(data.type==="joinName"){

            const p=players.find(x=>x.id===conn.playerId);

            if(p){

                p.name=(data.name||"Jugador")
                    .substring(0,12);

                updateLobby();
                broadcastLobby();
            }
        }

        if(data.type==="input"){

            const p=players.find(x=>x.id===conn.playerId);

            if(p){

                p.input.x=Number(data.x)||0;
                p.input.y=Number(data.y)||0;
                p.input.attack=!!data.attack;
            }
        }

        if(data.type==="startRequest"){

            startOnlineGame();
        }

    });

    conn.on("close",()=>{

        const id=conn.playerId;

        connections=connections.filter(c=>c!==conn);

        players=players.filter(p=>p.id!==id);

        updateLobby();
        broadcastLobby();
    });
}

/* =========================================================
   UNIRSE A SALA
========================================================= */

function joinRoom(){

    const code=document
        .getElementById("roomInput")
        .value
        .replace(/[^0-9]/g,"")
        .slice(0,4);

    document.getElementById("roomInput").value=code;

    if(code.length!==4){

        document.getElementById("onlineStatus").textContent=
            "Escribe exactamente 4 números.";

        return;
    }

    localName=document.getElementById("onlineName").value.trim();

    if(!localName){
        localName="Jugador";
    }

    localName=localName.substring(0,12);

    roomCode=code;

    isHost=false;

    document.getElementById("onlineStatus").textContent=
        "Conectando...";

    peer=new Peer({
        debug:1
    });

    peer.on("open",()=>{

        /*
          El código visible es 4827,
          pero internamente se conecta a beyblade4827.
        */

        hostConnection=peer.connect(
            "beyblade"+roomCode,
            {
                reliable:true,
                serialization:"json"
            }
        );

        hostConnection.on("open",()=>{

            hostConnection.send({
                type:"joinName",
                name:localName
            });

            document.getElementById("lobbyStatus").textContent=
                "Conectado. Esperando al anfitrión...";

            document.getElementById("roomCode").textContent=
                roomCode;

            showScreen("lobbyScreen");
        });

        hostConnection.on("data",data=>{

            if(data.type==="full"){

                document.getElementById("lobbyStatus").textContent=
                    "La sala está llena.";

                hostConnection.close();

                return;
            }

            if(data.type==="welcome"){

                localPlayerId=data.id;

                players=data.players.map(p=>({

                    id:p.id,
                    name:p.name,
                    x:W/2,
                    y:H/2,
                    vx:0,
                    vy:0,
                    hp:100,
                    maxHp:100,
                    color:p.color,
                    alive:true,
                    attack:false,
                    input:{
                        x:0,
                        y:0,
                        attack:false
                    },
                    cpu:false
                }));

                updateLobby();
            }

            if(data.type==="lobby"){

                players=data.players.map(p=>({

                    id:p.id,
                    name:p.name,
                    x:W/2,
                    y:H/2,
                    vx:0,
                    vy:0,
                    hp:100,
                    maxHp:100,
                    color:p.color,
                    alive:true,
                    attack:false,
                    input:{
                        x:0,
                        y:0,
                        attack:false
                    },
                    cpu:false
                }));

                updateLobby();
            }

            if(data.type==="start"){

                players=data.players;

                startGameLoop();
            }

            if(data.type==="state"){

                players=data.players;
            }

            if(data.type==="end"){

                players=data.players;

                setTimeout(()=>{
                    showWinner(data.winner);
                },300);
            }
        });

        hostConnection.on("close",()=>{

            document.getElementById("lobbyStatus").textContent=
                "El anfitrión salió de la sala.";
        });
    });

    peer.on("error",err=>{

        console.log(err);

        document.getElementById("onlineStatus").textContent=
            "No se encontró la sala. Revisa el código.";
    });
}

/* =========================================================
   LOBBY
========================================================= */

function updateLobby(){

    const text=document.getElementById("playerListText");

    if(!players.length){

        text.innerHTML="Esperando jugadores...";

        return;
    }

    text.innerHTML=players.map((p,i)=>{

        return `${i+1}. ${p.name}`;

    }).join("<br>");

    if(isHost){

        document.getElementById("startOnlineBtn").style.display=
            players.length>=2 ? "block":"none";

        document.getElementById("lobbyStatus").textContent=
            players.length+"/4 jugadores conectados";
    }
}

/* =========================================================
   ACTUALIZAR LOBBY A TODOS
========================================================= */

function broadcastLobby(){

    if(!isHost)return;

    const data={
        type:"lobby",
        players:players.map(p=>({
            id:p.id,
            name:p.name,
            color:p.color
        }))
    };

    connections.forEach(c=>{

        if(c.open){

            try{
                c.send(data);
            }catch(e){}
        }
    });
}

/* =========================================================
   EMPEZAR ONLINE
========================================================= */

function startOnlineGame(){

    if(!isHost){

        if(hostConnection && hostConnection.open){

            hostConnection.send({
                type:"startRequest"
            });
        }

        return;
    }

    if(players.length<2){

        alert("Necesitas al menos 2 jugadores.");

        return;
    }

    preparePlayers();

    connections.forEach(c=>{

        if(c.open){

            c.send({
                type:"start",
                players:players
            });
        }
    });

    startGameLoop();
}

/* =========================================================
   PREPARAR JUGADORES
========================================================= */

function preparePlayers(){

    players.forEach((p,i)=>{

        p.x=100+Math.random()*(W-200);
        p.y=100+Math.random()*(H-200);

        p.vx=0;
        p.vy=0;

        p.hp=100;
        p.maxHp=100;

        p.alive=true;

        p.input={
            x:0,
            y:0,
            attack:false
        };

        p.attack=false;
    });
}

/* =========================================================
   MODO SOLO
========================================================= */

function startSolo(){

    localName=getPlayerName();

    mode="solo";

    isHost=true;

    players=[];

    addHostPlayer();

    for(let i=1;i<4;i++){

        players.push({

            id:i,

            name:"CPU "+i,

            x:100+Math.random()*(W-200),

            y:100+Math.random()*(H-200),

            vx:0,

            vy:0,

            hp:100,

            maxHp:100,

            color:colors[i],

            alive:true,

            attack:false,

            input:{
                x:0,
                y:0,
                attack:false
            },

            cpu:true
        });
    }

    startGameLoop();
}

/* =========================================================
   INICIAR JUEGO
========================================================= */

function startGameLoop(){

    mode=mode==="solo" ? "solo":"online";

    gameRunning=true;
    paused=false;

    document.getElementById("pauseMenu").style.display="none";

    document.getElementById("topUI").style.display="flex";

    document.getElementById("mobileControls").style.display="flex";

    showScreen("game");

    preparePlayers();

    lastTime=performance.now();

    requestAnimationFrame(gameLoop);
}

/* =========================================================
   LOOP
========================================================= */

function gameLoop(time){

    if(!gameRunning)return;

    const dt=Math.min((time-lastTime)/16.67,2);

    lastTime=time;

    if(!paused){

        update(dt);

        draw();

        updateUI();
    }

    requestAnimationFrame(gameLoop);
}

/* =========================================================
   ACTUALIZAR
========================================================= */

function update(dt){

    if(attackCooldown>0){

        attackCooldown-=dt;
    }

    players.forEach(p=>{

        if(!p.alive)return;

        if(mode==="solo" && p.cpu){

            updateCPU(p);
        }
        else if(mode==="online" && !isHost){

            if(p.id===localPlayerId){

                p.input.x=touchX;
                p.input.y=touchY;
            }
        }

        movePlayer(p,dt);

        if(p.input.attack && attackCooldown<=0){

            attackPlayer(p);

            if(p.id===localPlayerId){
                p.input.attack=false;
            }
        }
    });

    checkCollisions();

    if(isHost){

        const alive=players.filter(p=>p.alive);

        if(alive.length<=1){

            gameRunning=false;

            const winner=alive.length
                ? alive[0].name
                : "Nadie";

            if(mode==="online"){

                connections.forEach(c=>{

                    if(c.open){

                        c.send({
                            type:"end",
                            players:players,
                            winner:winner
                        });
                    }
                });
            }

            setTimeout(()=>{
                showWinner(winner);
            },300);

        }
        else if(mode==="online"){

            broadcastState();
        }
    }
}

/* =========================================================
   MOVIMIENTO
========================================================= */

function movePlayer(p,dt){

    let dx=p.input.x||0;
    let dy=p.input.y||0;

    const length=Math.hypot(dx,dy);

    if(length>1){

        dx/=length;
        dy/=length;
    }

    p.vx+=dx*.85;
    p.vy+=dy*.85;

    p.vx*=.91;
    p.vy*=.91;

    let speed=Math.hypot(p.vx,p.vy);

    if(speed>6){

        p.vx=p.vx/speed*6;
        p.vy=p.vy/speed*6;
    }

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    const r=30;

    if(p.x<r){

        p.x=r;
        p.vx*=-.5;
    }

    if(p.x>W-r){

        p.x=W-r;
        p.vx*=-.5;
    }

    if(p.y<r){

        p.y=r;
        p.vy*=-.5;
    }

    if(p.y>H-r){

        p.y=H-r;
        p.vy*=-.5;
    }
}

/* =========================================================
   CPU
========================================================= */

function updateCPU(p){

    const enemies=players.filter(
        x=>x.id!==p.id && x.alive
    );

    if(!enemies.length)return;

    let target=enemies[0];

    let best=Infinity;

    enemies.forEach(e=>{

        const d=Math.hypot(
            e.x-p.x,
            e.y-p.y
        );

        if(d<best){

            best=d;
            target=e;
        }
    });

    const dx=target.x-p.x;
    const dy=target.y-p.y;

    const d=Math.hypot(dx,dy)||1;

    const nx=dx/d;
    const ny=dy/d;

    if(d>75){

        p.input.x=nx;
        p.input.y=ny;

    }else{

        const sx=-ny;
        const sy=nx;

        p.input.x=sx;
        p.input.y=sy;

        if(Math.random()<.08){

            p.input.attack=true;
        }
    }

    p.vx*=.94;
    p.vy*=.94;

    const speed=Math.hypot(p.vx,p.vy);

    if(speed>5){

        p.vx=p.vx/speed*5;
        p.vy=p.vy/speed*5;
    }
}

/* =========================================================
   ATAQUE
========================================================= */

function attackPlayer(p){

    attackCooldown=15;

    p.attack=true;

    setTimeout(()=>{

        p.attack=false;

    },180);

    players.forEach(enemy=>{

        if(enemy===p || !enemy.alive)return;

        const d=Math.hypot(
            enemy.x-p.x,
            enemy.y-p.y
        );

        if(d<70){

            enemy.hp-=12;

            const dx=enemy.x-p.x;
            const dy=enemy.y-p.y;

            const len=Math.hypot(dx,dy)||1;

            enemy.vx+=dx/len*5;
            enemy.vy+=dy/len*5;

            if(enemy.hp<=0){

                enemy.hp=0;
                enemy.alive=false;
            }
        }
    });
}

/* =========================================================
   COLISIONES
========================================================= */

function checkCollisions(){

    for(let i=0;i<players.length;i++){

        for(let j=i+1;j<players.length;j++){

            const a=players[i];
            const b=players[j];

            if(!a.alive || !b.alive)continue;

            const dx=b.x-a.x;
            const dy=b.y-a.y;

            const d=Math.hypot(dx,dy);

            if(d<55){

                const nx=dx/(d||1);
                const ny=dy/(d||1);

                a.vx-=nx*.6;
                a.vy-=ny*.6;

                b.vx+=nx*.6;
                b.vy+=ny*.6;
            }
        }
    }
}

/* =========================================================
   ESTADO ONLINE
========================================================= */

function broadcastState(){

    const state={
        type:"state",
        players:players
    };

    connections.forEach(c=>{

        if(c.open){

            try{
                c.send(state);
            }catch(e){}
        }
    });
}

/* =========================================================
   ENVIAR CONTROL DEL INVITADO
========================================================= */

function sendGuestInput(){

    if(
        !isHost &&
        hostConnection &&
        hostConnection.open &&
        gameRunning
    ){

        hostConnection.send({

            type:"input",

            x:touchX,

            y:touchY,

            attack:players[localPlayerId]
                ? players[localPlayerId].input.attack
                : false
        });
    }
}

setInterval(sendGuestInput,40);

/* =========================================================
   TECLADO
========================================================= */

window.addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()]=true;

    if(e.key===" "){

        e.preventDefault();

        attack();
    }

    if(e.key.toLowerCase()==="p"){

        togglePause();
    }
});

window.addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()]=false;
});

/* =========================================================
   CONTROL PC
========================================================= */

function updateKeyboard(){

    let x=0;
    let y=0;

    if(keys["arrowleft"] || keys["a"])x-=1;
    if(keys["arrowright"] || keys["d"])x+=1;
    if(keys["arrowup"] || keys["w"])y-=1;
    if(keys["arrowdown"] || keys["s"])y+=1;

    const d=Math.hypot(x,y);

    if(d>0){

        x/=d;
        y/=d;
    }

    touchX=x;
    touchY=y;

    const p=players[localPlayerId];

    if(p){

        p.input.x=x;
        p.input.y=y;
    }
}

/* =========================================================
   ATAQUE
========================================================= */

function attack(){

    const p=players[localPlayerId];

    if(p && p.alive){

        p.input.attack=true;
    }
}

/* =========================================================
   TOUCH / JOYSTICK
========================================================= */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joystickRect=null;

function startTouch(e){

    e.preventDefault();

    joystickRect=joystick.getBoundingClientRect();

    touching=true;

    moveTouch(e);
}

function moveTouch(e){

    if(!touching)return;

    e.preventDefault();

    const t=e.touches[0];

    const cx=joystickRect.left+
        joystickRect.width/2;

    const cy=joystickRect.top+
        joystickRect.height/2;

    let dx=t.clientX-cx;
    let dy=t.clientY-cy;

    const max=40;

    const len=Math.hypot(dx,dy);

    if(len>max){

        dx=dx/len*max;
        dy=dy/len*max;
    }

    stick.style.left=
        (30+dx)+"px";

    stick.style.top=
        (30+dy)+"px";

    touchX=dx/max;
    touchY=dy/max;
}

function endTouch(){

    touching=false;

    touchX=0;
    touchY=0;

    stick.style.left="30px";
    stick.style.top="30px";
}

joystick.addEventListener(
    "touchstart",
    startTouch,
    {passive:false}
);

joystick.addEventListener(
    "touchmove",
    moveTouch,
    {passive:false}
);

joystick.addEventListener(
    "touchend",
    endTouch,
    {passive:false}
);

document.getElementById("attackButton")
.addEventListener("touchstart",e=>{

    e.preventDefault();

    attack();

},{passive:false});

/* =========================================================
   DIBUJAR
========================================================= */

function draw(){

    ctx.clearRect(0,0,W,H);

    drawArena();

    players.forEach(p=>{

        if(p.alive){

            drawTrompo(p);
        }
    });
}

/* =========================================================
   ARENA
========================================================= */

function drawArena(){

    ctx.fillStyle="#6fc858";

    ctx.fillRect(0,0,W,H);

    /*
       Rayas del piso
    */

    ctx.strokeStyle="rgba(255,255,255,.12)";
    ctx.lineWidth=2;

    const size=50;

    for(let x=0;x<W;x+=size){

        ctx.beginPath();

        ctx.moveTo(x,0);
        ctx.lineTo(x,H);

        ctx.stroke();
    }

    for(let y=0;y<H;y+=size){

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

        ctx.stroke();
    }

    /*
       Arena central
    */

    ctx.beginPath();

    ctx.arc(
        W/2,
        H/2,
        Math.min(W,H)*.42,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#91e06d";
    ctx.fill();

    ctx.strokeStyle="#ffffff";
    ctx.lineWidth=8;
    ctx.stroke();
}

/* =========================================================
   TROMPO
========================================================= */

function drawTrompo(p){

    ctx.save();

    ctx.translate(p.x,p.y);

    const rotation=
        performance.now()/80+
        p.id;

    ctx.rotate(rotation);

    /*
       Sombra
    */

    ctx.beginPath();

    ctx.ellipse(
        0,
        8,
        30,
        13,
        0,
        0,
        Math.PI*2
    );

    ctx.fillStyle="rgba(0,0,0,.18)";
    ctx.fill();

    /*
       Trompo
    */

    ctx.beginPath();

    ctx.moveTo(0,-32);

    ctx.lineTo(24,-10);

    ctx.lineTo(30,10);

    ctx.lineTo(14,28);

    ctx.lineTo(0,34);

    ctx.lineTo(-14,28);

    ctx.lineTo(-30,10);

    ctx.lineTo(-24,-10);

    ctx.closePath();

    ctx.fillStyle=p.color;

    ctx.fill();

    ctx.strokeStyle="#fff";

    ctx.lineWidth=3;

    ctx.stroke();

    /*
       Centro
    */

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        10,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#fff";

    ctx.fill();

    ctx.restore();

    /*
       Ataque
    */

    if(p.attack){

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            45,
            0,
            Math.PI*2
        );

        ctx.strokeStyle="#fff";
        ctx.lineWidth=5;

        ctx.stroke();
    }

    /*
       Nombre
    */

    ctx.fillStyle="#fff";

    ctx.font="bold 13px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        p.name,
        p.x,
        p.y-43
    );
}

/* =========================================================
   UI
========================================================= */

function updateUI(){

    const ui=document.getElementById("playersUI");

    ui.innerHTML="";

    players.forEach(p=>{

        if(!p.alive)return;

        const box=document.createElement("div");

        box.className="playerBox";

        box.style.marginBottom="5px";

        box.innerHTML=`

            <div class="playerName">
                ${p.name}
            </div>

            <div class="hpBar">
                <div
                    class="hp"
                    style="width:${p.hp}%"
                ></div>
            </div>
        `;

        ui.appendChild(box);
    });

    updateKeyboard();
}

/* =========================================================
   PAUSA
========================================================= */

function togglePause(){

    if(!gameRunning)return;

    /*
       En online solo el host pausa.
    */

    if(mode==="online" && !isHost){

        return;
    }

    paused=!paused;

    document.getElementById("pauseMenu").style.display=
        paused ? "flex":"none";
}

/* =========================================================
   REINICIAR
========================================================= */

function restartCurrentMode(){

    document.getElementById("pauseMenu").style.display="none";

    if(mode==="solo"){

        startSolo();

    }else{

        if(isHost){

            preparePlayers();

            connections.forEach(c=>{

                if(c.open){

                    c.send({
                        type:"start",
                        players:players
                    });
                }
            });

            gameRunning=true;
            paused=false;
        }
    }
}

/* =========================================================
   GANADOR
========================================================= */

function showWinner(name){

    gameRunning=false;

    document.getElementById("topUI").style.display="none";
    document.getElementById("mobileControls").style.display="none";

    setTimeout(()=>{

        alert("🏆 ¡GANADOR!\n\n"+name);

        if(mode==="solo"){

            showScreen("menuScreen");

        }else{

            showScreen("lobbyScreen");
        }

    },100);
}

/* =========================================================
   SALIR ONLINE
========================================================= */

function leaveOnline(){

    cleanupNetwork();

    showScreen("onlineScreen");
}

/* =========================================================
   LIMPIAR RED
========================================================= */

function cleanupNetwork(){

    gameRunning=false;

    if(hostConnection){

        try{
            hostConnection.close();
        }catch(e){}

        hostConnection=null;
    }

    connections.forEach(c=>{

        try{
            c.close();
        }catch(e){}

    });

    connections=[];

    if(peer){

        try{
            peer.destroy();
        }catch(e){}

        peer=null;
    }

    players=[];
    isHost=false;
}

/* =========================================================
   INICIO
========================================================= */

showScreen("menuScreen");

</script>
