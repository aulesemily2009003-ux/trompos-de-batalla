<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trompos de Batalla</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #080b16;
    font-family: Arial, sans-serif;
    color: white;
}

canvas {
    display: block;
}

#panel {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 850px;
    z-index: 5;
    text-align: center;
    pointer-events: none;
}

.titulo {
    font-size: 30px;
    font-weight: bold;
    text-shadow: 0 0 15px #00aaff;
    margin-bottom: 10px;
}

.barras {
    display: flex;
    justify-content: space-between;
    gap: 30px;
}

.barraCaja {
    width: 45%;
}

.nombre {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 4px;
}

.barra {
    width: 100%;
    height: 22px;
    background: #222;
    border: 2px solid white;
    border-radius: 15px;
    overflow: hidden;
}

.vida {
    height: 100%;
    width: 100%;
    transition: width 0.15s;
}

#vidaJugador {
    background: linear-gradient(90deg, #006eff, #00d9ff);
}

#vidaRival {
    background: linear-gradient(90deg, #ff1818, #ff8a00);
}

#info {
    margin-top: 6px;
    font-size: 14px;
}

#mensaje {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(0,0,0,0.75);
    align-items: center;
    justify-content: center;
    flex-direction: column;
}

#resultado {
    font-size: 55px;
    font-weight: bold;
    text-shadow: 0 0 25px white;
    margin-bottom: 25px;
}

button {
    padding: 14px 35px;
    font-size: 20px;
    border: none;
    border-radius: 12px;
    background: #168cff;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    transform: scale(1.05);
}

#controles {
    position: fixed;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    background: rgba(0,0,0,0.55);
    padding: 10px 18px;
    border-radius: 15px;
    text-align: center;
    font-size: 14px;
}
</style>
</head>

<body>

<div id="panel">

    <div class="titulo">🌀 TROMPOS DE BATALLA 🌀</div>

    <div class="barras">

        <div class="barraCaja">
            <div class="nombre">🔵 TU TROMPO</div>
            <div class="barra">
                <div id="vidaJugador" class="vida"></div>
            </div>
            <div id="textoJugador">❤️ 100 / 100</div>
        </div>

        <div class="barraCaja">
            <div class="nombre">🔴 CONTRINCANTE</div>
            <div class="barra">
                <div id="vidaRival" class="vida"></div>
            </div>
            <div id="textoRival">❤️ 100 / 100</div>
        </div>

    </div>

    <div id="info">
        ⚔️ Choca contra el rival para hacerle daño
    </div>

</div>

<div id="controles">
    🎮 Mover: WASD / Flechas &nbsp;&nbsp; | &nbsp;&nbsp;
    ⚡ ATAQUE: ESPACIO
</div>

<div id="mensaje">
    <div id="resultado"></div>
    <button onclick="reiniciar()">🔄 JUGAR OTRA VEZ</button>
</div>

<canvas id="juego"></canvas>

<script>

const canvas = document.getElementById("juego");
const ctx = canvas.getContext("2d");

let jugador;
let rival;

let teclas = {};

let particulas = [];

let jugando = true;

let ataqueJugador = false;

let tiempoGolpeJugador = 0;
let tiempoGolpeRival = 0;

let arena = {
    x: 0,
    y: 0,
    radio: 0
};

function ajustarPantalla() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    arena.x = canvas.width / 2;
    arena.y = canvas.height / 2 + 35;

    arena.radio = Math.min(
        canvas.width,
        canvas.height
    ) * 0.36;
}

window.addEventListener("resize", ajustarPantalla);

ajustarPantalla();


// ============================
// INICIAR JUEGO
// ============================

function iniciar() {

    jugador = {

        x: arena.x - 100,
        y: arena.y,

        radio: 38,

        vida: 100,
        vidaMax: 100,

        velocidad: 3.7,

        rotacion: 0,

        color: "#008cff"

    };


    rival = {

        x: arena.x + 100,
        y: arena.y,

        radio: 40,

        vida: 100,
        vidaMax: 100,

        velocidad: 2.4,

        vx: -1,
        vy: 0.5,

        rotacion: 0,

        color: "#ff3030"

    };

    particulas = [];

    jugando = true;

    document.getElementById("mensaje").style.display = "none";

    actualizarVida();

}

iniciar();


// ============================
// TECLADO
// ============================

window.addEventListener("keydown", function(e) {

    teclas[e.key.toLowerCase()] = true;

    if (e.code === "Space") {

        ataqueJugador = true;

    }

});

window.addEventListener("keyup", function(e) {

    teclas[e.key.toLowerCase()] = false;

    if (e.code === "Space") {

        ataqueJugador = false;

    }

});


// ============================
// MOVIMIENTO DEL JUGADOR
// ============================

function moverJugador() {

    let dx = 0;
    let dy = 0;

    if (teclas["w"] || teclas["arrowup"]) {
        dy -= 1;
    }

    if (teclas["s"] || teclas["arrowdown"]) {
        dy += 1;
    }

    if (teclas["a"] || teclas["arrowleft"]) {
        dx -= 1;
    }

    if (teclas["d"] || teclas["arrowright"]) {
        dx += 1;
    }

    if (dx !== 0 || dy !== 0) {

        let distancia = Math.sqrt(dx * dx + dy * dy);

        dx /= distancia;
        dy /= distancia;

        let velocidadActual = jugador.velocidad;

        if (ataqueJugador) {

            velocidadActual = 6;

        }

        jugador.x += dx * velocidadActual;
        jugador.y += dy * velocidadActual;

    }

    jugador.rotacion += ataqueJugador ? 0.35 : 0.18;

}


// ============================
// MOVIMIENTO RIVAL
// ============================

function moverRival() {

    let dx = jugador.x - rival.x;
    let dy = jugador.y - rival.y;

    let distancia = Math.sqrt(dx * dx + dy * dy);

    if (distancia > 1) {

        dx /= distancia;
        dy /= distancia;

        rival.x += dx * rival.velocidad;
        rival.y += dy * rival.velocidad;

    }

    rival.rotacion += 0.2;

}


// ============================
// LIMITAR DENTRO DE LA ARENA
// ============================

function limitar(trompo) {

    let dx = trompo.x - arena.x;
    let dy = trompo.y - arena.y;

    let distancia = Math.sqrt(dx * dx + dy * dy);

    let limite = arena.radio - trompo.radio;

    if (distancia > limite) {

        let angulo = Math.atan2(dy, dx);

        trompo.x = arena.x + Math.cos(angulo) * limite;
        trompo.y = arena.y + Math.sin(angulo) * limite;

        // Golpe contra el borde
        trompo.vida -= 0.12;

        crearParticulas(
            trompo.x,
            trompo.y,
            trompo.color,
            3
        );

    }

}


// ============================
// COMBATE
// ============================

function combate() {

    let dx = rival.x - jugador.x;
    let dy = rival.y - jugador.y;

    let distancia = Math.sqrt(dx * dx + dy * dy);

    let distanciaGolpe = jugador.radio + rival.radio;

    if (distancia < distanciaGolpe) {

        if (tiempoGolpeJugador <= 0) {

            let daño = ataqueJugador ? 8 : 4;

            rival.vida -= daño;

            tiempoGolpeJugador = 25;

            crearParticulas(
                rival.x,
                rival.y,
                "#ffcc00",
                15
            );

        }

        if (tiempoGolpeRival <= 0) {

            let dañoRival = 4;

            jugador.vida -= dañoRival;

            tiempoGolpeRival = 30;

            crearParticulas(
                jugador.x,
                jugador.y,
                "#00ffff",
                12
            );

        }

        // Separar trompos

        let angulo = Math.atan2(dy, dx);

        let fuerza = 5;

        jugador.x -= Math.cos(angulo) * fuerza;
        jugador.y -= Math.sin(angulo) * fuerza;

        rival.x += Math.cos(angulo) * fuerza;
        rival.y += Math.sin(angulo) * fuerza;

    }

    if (tiempoGolpeJugador > 0) {
        tiempoGolpeJugador--;
    }

    if (tiempoGolpeRival > 0) {
        tiempoGolpeRival--;
    }


    if (jugador.vida <= 0) {

        jugador.vida = 0;

        perder();

    }

    if (rival.vida <= 0) {

        rival.vida = 0;

        ganar();

    }

}


// ============================
// PARTÍCULAS
// ============================

function crearParticulas(x, y, color, cantidad) {

    for (let i = 0; i < cantidad; i++) {

        let angulo = Math.random() * Math.PI * 2;

        let velocidad = Math.random() * 5 + 1;

        particulas.push({

            x: x,
            y: y,

            vx: Math.cos(angulo) * velocidad,
            vy: Math.sin(angulo) * velocidad,

            vida: 30,

            color: color

        });

    }

}


function actualizarParticulas() {

    for (let i = particulas.length - 1; i >= 0; i--) {

        let p = particulas[i];

        p.x += p.vx;
        p.y += p.vy;

        p.vx *= 0.95;
        p.vy *= 0.95;

        p.vida--;

        if (p.vida <= 0) {

            particulas.splice(i, 1);

        }

    }

}


function dibujarParticulas() {

    for (let p of particulas) {

        ctx.globalAlpha = p.vida / 30;

        ctx.fillStyle = p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            4,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }

    ctx.globalAlpha = 1;

}


// ============================
// DIBUJAR TROMPO
// ============================

function dibujarTrompo(trompo) {

    ctx.save();

    ctx.translate(trompo.x, trompo.y);

    ctx.rotate(trompo.rotacion);


    // Sombra

    ctx.beginPath();

    ctx.arc(
        4,
        6,
        trompo.radio,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "rgba(0,0,0,0.45)";

    ctx.fill();


    // Cuerpo

    let gradiente = ctx.createRadialGradient(
        -10,
        -10,
        5,
        0,
        0,
        trompo.radio
    );

    gradiente.addColorStop(0, "#ffffff");
    gradiente.addColorStop(0.15, trompo.color);
    gradiente.addColorStop(1, "#111");

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        trompo.radio,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = gradiente;

    ctx.fill();

    ctx.lineWidth = 4;

    ctx.strokeStyle = trompo.color;

    ctx.stroke();


    // Aspas

    for (let i = 0; i < 8; i++) {

        ctx.rotate(Math.PI / 4);

        ctx.beginPath();

        ctx.moveTo(0, 0);

        ctx.lineTo(
            trompo.radio - 6,
            0
        );

        ctx.strokeStyle = "white";

        ctx.lineWidth = 3;

        ctx.stroke();

    }


    // Centro

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        10,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#111";

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        5,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "white";

    ctx.fill();


    ctx.restore();

}


// ============================
// ARENA
// ============================

function dibujarArena() {

    // Fondo

    ctx.fillStyle = "#080b16";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Aura

    ctx.beginPath();

    ctx.arc(
        arena.x,
        arena.y,
        arena.radio + 20,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "rgba(0,150,255,0.08)";

    ctx.fill();


    // Arena

    let gradiente = ctx.createRadialGradient(
        arena.x,
        arena.y,
        20,
        arena.x,
        arena.y,
        arena.radio
    );

    gradiente.addColorStop(0, "#30343d");
    gradiente.addColorStop(1, "#11141b");

    ctx.beginPath();

    ctx.arc(
        arena.x,
        arena.y,
        arena.radio,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = gradiente;

    ctx.fill();

    ctx.lineWidth = 8;

    ctx.strokeStyle = "#5c6675";

    ctx.stroke();


    // Anillo interior

    ctx.beginPath();

    ctx.arc(
        arena.x,
        arena.y,
        arena.radio * 0.65,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle = "rgba(255,255,255,0.15)";

    ctx.lineWidth = 2;

    ctx.stroke();

}


// ============================
// VIDA
// ============================

function actualizarVida() {

    document.getElementById("vidaJugador").style.width =
        jugador.vida + "%";

    document.getElementById("vidaRival").style.width =
        rival.vida + "%";

    document.getElementById("textoJugador").innerHTML =
        "❤️ " + Math.ceil(jugador.vida) + " / 100";

    document.getElementById("textoRival").innerHTML =
        "❤️ " + Math.ceil(rival.vida) + " / 100";

}


// ============================
// GANAR
// ============================

function ganar() {

    if (!jugando) return;

    jugando = false;

    document.getElementById("resultado").innerHTML =
        "🏆 ¡GANASTE!";

    document.getElementById("mensaje").style.display =
        "flex";

}


// ============================
// PERDER
// ============================

function perder() {

    if (!jugando) return;

    jugando = false;

    document.getElementById("resultado").innerHTML =
        "💥 ¡PERDISTE!";

    document.getElementById("mensaje").style.display =
        "flex";

}


// ============================
// REINICIAR
// ============================

function reiniciar() {

    iniciar();

}


// ============================
// BUCLE PRINCIPAL
// ============================

function juego() {

    if (jugando) {

        moverJugador();

        moverRival();

        limitar(jugador);

        limitar(rival);

        combate();

        actualizarParticulas();

        actualizarVida();

    }

    dibujarArena();

    if (jugador) {
        dibujarTrompo(jugador);
    }

    if (rival) {
        dibujarTrompo(rival);
    }

    dibujarParticulas();

    requestAnimationFrame(juego);

}

juego();

</script>

</body>
</html>
